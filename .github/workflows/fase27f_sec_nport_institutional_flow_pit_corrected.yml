name: Fase 27F - SEC N-PORT Institutional Flow PIT Corrected

on:
  push:
    branches: [phase27f-nport-institutional-flow-pit-correction]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 27F
        run: python Nueva_Estrategia_Fase27F_SEC_NPORT_InstitutionalFlow_PIT_Corrected.py
      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: phase27f-sec-nport-institutional-flow-pit-corrected
          path: nueva_estrategia_phase27f_sec_nport/
          if-no-files-found: error
