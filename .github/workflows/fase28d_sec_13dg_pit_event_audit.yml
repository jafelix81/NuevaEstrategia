name: Fase 28D - SEC 13D/13G PIT event audit
on:
  push:
    branches: [phase28d-sec-13dg-pit-event-audit]
  workflow_dispatch:
concurrency:
  group: phase28d-sec-13dg-pit-event-audit
  cancel-in-progress: true
jobs:
  research:
    strategy:
      max-parallel: 1
      matrix:
        include:
          - id: '00_06'
            start: 0
            end: 6
          - id: '06_12'
            start: 6
            end: 12
          - id: '12_18'
            start: 12
            end: 18
          - id: '18_24'
            start: 18
            end: 24
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 28D chunk
        env:
          PHASE28D_CHUNK_START: ${{ matrix.start }}
          PHASE28D_CHUNK_END: ${{ matrix.end }}
        run: python -u Nueva_Estrategia_Fase28D_SEC_13DG_PIT_Event_Audit.py
      - name: Upload chunk output
        uses: actions/upload-artifact@v4
        with:
          name: phase28d-sec-13dg-pit-event-audit-chunk-${{ matrix.id }}
          path: nueva_estrategia_phase28d_sec_13dg_pit_event_audit_chunk${{ matrix.id }}/
          if-no-files-found: error

  aggregate:
    needs: research
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all chunk outputs
        uses: actions/download-artifact@v4
        with:
          pattern: phase28d-sec-13dg-pit-event-audit-chunk-*
          path: chunk_artifacts
      - name: Aggregate Phase 28D
        env:
          PHASE28D_MODE: aggregate
          PHASE28D_ARTIFACT_ROOT: chunk_artifacts
        run: python -u Nueva_Estrategia_Fase28D_SEC_13DG_PIT_Event_Audit.py
      - name: Upload aggregated research output
        uses: actions/upload-artifact@v4
        with:
          name: phase28d-sec-13dg-pit-event-audit-final
          path: nueva_estrategia_phase28d_sec_13dg_pit_event_audit/
          if-no-files-found: error
