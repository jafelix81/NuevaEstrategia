name: Fase 29 - Independent Alpha Lab

on:
  push:
    branches:
      - phase29-independent-alpha-lab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance
      - name: Run Phase 29
        run: python Nueva_Estrategia_Fase29_IndependentAlphaLab.py
      - name: Upload Phase 29 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase29-independent-alpha-lab
          path: nueva_estrategia_phase29_independent_alpha/**
          if-no-files-found: warn
          retention-days: 30
