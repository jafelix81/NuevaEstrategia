name: Phase 162 SEC 13D-G referenced-parent document validation

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase162_*"
      - "research/test_phase162_*"
      - ".github/workflows/phase162_sec_13dg_parent_accession_validation.yml"
      - "SMART_MONEY_RESEARCH_STATE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase162-sec-13dg-parent-accession-validation
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile research/phase162_13dg_parent_accession_validation.py
          python -m unittest discover -s research -p 'test_phase162_*.py' -v
      - name: Recompute parent-document identity comparison
        run: |
          python research/phase162_13dg_parent_accession_validation.py \
            --output-dir phase162_output
      - name: Upload reproducible audit
        uses: actions/upload-artifact@v4
        with:
          name: phase162-sec-13dg-parent-accession-validation
          path: |
            phase162_output/phase162_13dg_parent_accession_validation.csv
            phase162_output/phase162_13dg_parent_accession_validation_summary.json
          if-no-files-found: error
          retention-days: 30
