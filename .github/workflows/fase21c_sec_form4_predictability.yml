name: Fase 21C - SEC Form 4 Predictability
on:
  push:
    branches: [phase21c-sec-form4-predictability]
  workflow_dispatch:
jobs:
  phase21c:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests yfinance
      - name: Run Phase 21C
        run: python -u Nueva_Estrategia_Fase21C_SEC_Form4_Predictability.py
      - name: Upload Phase 21C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase21c-sec-form4-predictability
          path: nueva_estrategia_phase21c_sec_form4_predictability/**
          if-no-files-found: warn
          retention-days: 30
