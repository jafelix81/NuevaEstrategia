name: Phase 382 - CFTC archive anomaly repair diagnostic

on:
  push:
    branches:
      - phase382-cftc-archive-anomaly-repair
    paths:
      - "research/phase382_cftc_archive_anomaly_repair.py"
      - "research/test_phase382_cftc_archive_anomaly_repair.py"
      - ".github/workflows/phase382_cftc_archive_anomaly_repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase382-cftc-archive-anomaly-repair
  cancel-in-progress: false

jobs:
  anomaly-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase382_cftc_archive_anomaly_repair.py research/test_phase382_cftc_archive_anomaly_repair.py
          python -m unittest -v research.test_phase382_cftc_archive_anomaly_repair
      - name: Probe archive neighbors, headers and CFTC row counts
        run: python -u -m research.phase382_cftc_archive_anomaly_repair --output phase382_cftc_archive_anomaly_repair
      - name: Enforce diagnostic-only controls
        run: |
          python - <<'PY'
          import json,sys
          r=json.load(open("phase382_cftc_archive_anomaly_repair/summary.json",encoding="utf-8"))
          if r.get("raw_html_retained") or r.get("raw_positions_retained") or r.get("strict_pit_authorized") or r.get("alpha_test_authorized") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Phase 382 diagnostic-only controls violated")
          print("PHASE382_ARCHIVE_ANOMALY_DIAGNOSTIC=PASS")
          print("EXACT_PAGE_RESOLUTIONS=",r["targets_with_exact_heading_page"],"/",r["target_count"])
          PY
      - name: Upload metadata-only diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase382-cftc-archive-anomaly-repair
          path: phase382_cftc_archive_anomaly_repair/
          if-no-files-found: warn
          retention-days: 90
