name: Phase 397 - Form 144 PIT data-integrity regression
on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase397_form144_pit_data_integrity_audit.py"
      - "research/test_phase397_form144_pit_data_integrity_audit.py"
      - ".github/workflows/phase397_form144_pit_data_integrity_audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and run offline tests
        run: |
          python -m py_compile research/phase397_form144_pit_data_integrity_audit.py research/test_phase397_form144_pit_data_integrity_audit.py
          cd research
          python -m unittest -v test_phase397_form144_pit_data_integrity_audit.py
