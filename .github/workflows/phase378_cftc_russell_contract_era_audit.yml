name: Phase 378 - CFTC Russell contract-era and classification-regime audit

on:
  push:
    branches:
      - phase378-cftc-russell-contract-era-audit
    paths:
      - "research/phase378_cftc_russell_contract_era_audit.py"
      - "research/test_phase378_cftc_russell_contract_era_audit.py"
      - ".github/workflows/phase378_cftc_russell_contract_era_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase378-cftc-russell-contract-era-audit
  cancel-in-progress: false

jobs:
  contract-era-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase378_cftc_russell_contract_era_audit.py research/test_phase378_cftc_russell_contract_era_audit.py
          python -m unittest -v research.test_phase378_cftc_russell_contract_era_audit
      - name: Retrieve and audit Russell TFF contract eras
        run: python -u -m research.phase378_cftc_russell_contract_era_audit --output phase378_cftc_russell_contract_era_audit
      - name: Enforce source-feasibility-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase378_cftc_russell_contract_era_audit/summary.json",encoding="utf-8"))
          if not r.get("row_count_reconciled") or not r.get("snapshot_stable_during_retrieval"):
              sys.exit("CFTC Russell subset did not reconcile or snapshot changed")
          if r.get("invalid_report_dates") or r.get("duplicate_natural_key_groups"):
              sys.exit("CFTC Russell date/natural-key gate failed")
          if not r.get("all_russell_codes_present_gate") or not r.get("russell_239742_contract_era_split_gate"):
              sys.exit("CFTC Russell contract-era gate failed")
          if r.get("pre_launch_rows_eligible_for_primary_tff_feature") or r.get("alpha_test_authorized") or r.get("holdout_used"):
              sys.exit("Historical classification/PIT or research-only control violated")
          if r.get("raw_rows_retained") or r.get("raw_ids_retained") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Raw retention or production-control violation")
          print("PHASE378_CFTC_RUSSELL_CONTRACT_ERA_AUDIT=PASS")
          print("ROWS=",r["retrieved_row_count"])
          print("239742_EPISODES=",r["series_by_code"]["239742"]["episode_count"])
          print("PRE_LAUNCH_BACKCAST=EXCLUDED_FROM_PRIMARY")
          print("STRICT_PIT=NOT_ESTABLISHED")
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase378-cftc-russell-contract-era-audit
          path: phase378_cftc_russell_contract_era_audit/
          if-no-files-found: warn
          retention-days: 90
