name: Phase 112 Cboe Option Trades public sample audit

on:
  push:
    branches:
      - phase99-broad-pit-universe-charter
    paths:
      - research/PHASE112_CBOE_OPTION_TRADES_SAMPLE_SCHEMA_AUDIT_2026-11-05.md
      - research/phase112_cboe_option_trades_sample_audit.py
      - research/test_phase112_cboe_option_trades_sample_audit.py

permissions:
  contents: read

jobs:
  sample-audit:
    if: contains(github.event.head_commit.message, '[phase112-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Offline parser tests
        run: python -m unittest -v research/test_phase112_cboe_option_trades_sample_audit.py
      - name: Download and audit public sample
        run: python research/phase112_cboe_option_trades_sample_audit.py --output phase112_cboe_option_trades_output
      - name: Upload sample audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase112-cboe-option-trades-sample-audit
          path: phase112_cboe_option_trades_output/
          if-no-files-found: error
          retention-days: 90
