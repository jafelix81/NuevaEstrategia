name: Phase 247 SEC N-PORT flattened UNIT field contract

on:
  pull_request:
    branches: [phase99-broad-pit-universe-charter]
    paths:
      - "research/phase247_sec_nport_unit_field_contract.py"
      - "research/test_phase247_sec_nport_unit_field_contract.py"
      - ".github/workflows/phase247_nport_unit_field_contract.yml"

permissions:
  contents: read

concurrency:
  group: phase247-nport-unit-field-contract
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: python -m py_compile research/phase247_sec_nport_unit_field_contract.py research/test_phase247_sec_nport_unit_field_contract.py
      - name: Run offline schema-contract regression tests
        run: python -m unittest -v research.test_phase247_sec_nport_unit_field_contract
      - name: Build deterministic audit artifact
        run: python -m research.phase247_sec_nport_unit_field_contract --output phase247_output/phase247_nport_unit_field_contract.json
      - name: Upload metadata-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase247-nport-unit-field-contract
          path: phase247_output/phase247_nport_unit_field_contract.json
          if-no-files-found: error
          retention-days: 90
