name: Fase 21B - SEC Form 4 Research

on:
  push:
    branches:
      - phase21b-sec-form4-research
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase21b:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests yfinance openpyxl

      - name: Run Phase 21B
        run: |
          python -u Nueva_Estrategia_Fase21B_SEC_Form4_Research.py

      - name: Upload Phase 21B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21b-sec-form4-research
          path: nueva_estrategia_phase21b_sec_form4_research/**
          if-no-files-found: warn
          retention-days: 30
