name: Phase 353 - Cboe daily EOD flow and OPRA context audit

on:
  pull_request:
    branches:
      - phase352-cboe-open-close-1m-v18-pit-audit
    paths:
      - "research/phase353_cboe_eod_flow_companion_audit.py"
      - "research/test_phase353_cboe_eod_flow_companion_audit.py"
      - "research/PHASE353_CBOE_EOD_FLOW_COMPANION_AUDIT_2026-11-13.md"
      - ".github/workflows/phase353_cboe_eod_flow_companion_audit.yml"

permissions:
  contents: read

concurrency:
  group: phase353-cboe-eod-flow-companion-audit
  cancel-in-progress: false

jobs:
  sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned PDF extractor
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Compile audit and tests
        run: python -m py_compile research/phase353_cboe_eod_flow_companion_audit.py research/test_phase353_cboe_eod_flow_companion_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase353_cboe_eod_flow_companion_audit
      - name: Download and audit public EOD samples and official specifications
        run: python -m research.phase353_cboe_eod_flow_companion_audit --output phase353_output/audit.json
      - name: Enforce sample-only and no-alpha gates
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase353_output/audit.json", encoding="utf-8"))
          if result.get("status") != "PASS_DAILY_EOD_PAIR_SAMPLE_AND_SPEC_AUDIT":
              print(json.dumps(result, indent=2))
              sys.exit(1)
          gates = (
              "historical_pit_admitted", "prospective_pit_admitted",
              "licensing_confirmed", "return_test_authorized",
              "alpha_admission", "holdout_used",
          )
          if any(result.get("gates", {}).get(gate) for gate in gates):
              sys.exit(2)
          if not result.get("gates", {}).get("f80_frozen"):
              sys.exit(3)
          print("PHASE353_STATUS=" + result["status"])
          print("DAILY_EOD_PAIR_SAMPLE_SCHEMA=PASS")
          print("PIT_ALPHA_GATES=CLOSED")
          PY
      - name: Upload metadata-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase353-cboe-daily-eod-flow-companion-audit
          path: phase353_output/audit.json
          if-no-files-found: warn
          retention-days: 90
