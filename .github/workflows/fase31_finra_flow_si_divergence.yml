name: Fase 31 - FINRA Flow SI Divergence
on:
  push:
    branches: [phase31-finra-flow-si-divergence]
  workflow_dispatch:
concurrency:
  group: phase31-finra-flow-si-divergence
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests yfinance
      - name: Normalize Phase 31 residual series
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('Nueva_Estrategia_Fase31_FINRA_Flow_SI_Divergence.py')
          s=p.read_text()
          old="""    return r\n\n\ndef spearman(a,b):"""
          new="""    return pd.Series(r,index=z.index)\n\n\ndef spearman(a,b):"""
          if old not in s:
              raise SystemExit('resid_rank return pattern not found')
          s=s.replace(old,new,1)
          old2="spearman(pd.Series(resid_rank(snap[f],snap['LTM']),index=snap.index),snap[f'FWD{h}'])"
          new2="spearman(resid_rank(snap[f],snap['LTM']),snap[f'FWD{h}'])"
          if old2 not in s:
              raise SystemExit('residual IC caller pattern not found')
          s=s.replace(old2,new2,1)
          p.write_text(s)
          PY
      - name: Run Phase 31
        run: python -u Nueva_Estrategia_Fase31_FINRA_Flow_SI_Divergence_RobustRunner.py
      - name: Upload Phase 31 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase31-finra-flow-si-divergence
          path: nueva_estrategia_phase31_finra_flow_si_divergence/
          retention-days: 30
          if-no-files-found: error
