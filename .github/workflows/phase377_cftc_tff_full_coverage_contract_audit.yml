name: Phase 377 - CFTC TFF full coverage and contract audit

on:
  push:
    branches:
      - phase377-cftc-tff-full-coverage-contract-audit
    paths:
      - "research/phase377_cftc_tff_full_coverage_audit.py"
      - "research/test_phase377_cftc_tff_full_coverage_audit.py"
      - ".github/workflows/phase377_cftc_tff_full_coverage_contract_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase377-cftc-tff-full-coverage-contract-audit
  cancel-in-progress: false

jobs:
  full-coverage-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase377_cftc_tff_full_coverage_audit.py research/test_phase377_cftc_tff_full_coverage_audit.py
          python -m unittest -v research.test_phase377_cftc_tff_full_coverage_audit
      - name: Retrieve and audit the full TFF Futures Only dataset
        run: python -u -m research.phase377_cftc_tff_full_coverage_audit --output phase377_cftc_tff_full_coverage_audit
      - name: Enforce source-feasibility-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase377_cftc_tff_full_coverage_audit/summary.json",encoding="utf-8"))
          if not r.get("row_count_reconciled") or not r.get("snapshot_stable_during_retrieval"):
              sys.exit("CFTC full snapshot did not reconcile or changed during retrieval")
          if r.get("required_schema_fields_missing") or not r.get("position_category_schema_complete"):
              sys.exit("CFTC schema gate failed")
          if not r.get("candidate_codes_present_gate") or not r.get("candidate_report_date_code_unique_gate"):
              sys.exit("Candidate index-futures code/key gate failed")
          if r.get("forward_returns_used") or r.get("alpha_test_authorized") or r.get("holdout_used"):
              sys.exit("Research-only controls violated")
          if r.get("raw_rows_retained") or r.get("raw_ids_retained") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Raw retention or production-control violation")
          print("PHASE377_CFTC_TFF_SOURCE_AUDIT=PASS")
          print("ROWS=",r["retrieved_row_count"],"FIELDS=",r["schema_field_count"])
          print("INDEX_CODES=PASS")
          print("PIT=",r["historical_pit_status"])
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase377-cftc-tff-full-coverage-audit
          path: phase377_cftc_tff_full_coverage_audit/
          if-no-files-found: warn
          retention-days: 90
