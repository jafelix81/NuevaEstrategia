name: Phase 311 N-PORT historical accession census

on:
  push:
    branches:
      - phase311-nport-historical-accession-census
    paths:
      - ".github/workflows/phase311_nport_accession_census.yml"
      - "research/phase311_nport_accession_census.py"
      - "research/test_phase311_nport_accession_census.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase311-nport-accession-census-${{ github.ref }}
  cancel-in-progress: false

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Compile and run Phase 311 regressions
        run: |
          python -m compileall -q research/phase311_nport_accession_census.py research/test_phase311_nport_accession_census.py
          python -m unittest -v research.test_phase311_nport_accession_census

      - name: Download and audit all quarterly SEC master indexes
        run: python research/phase311_nport_accession_census.py --start 2019Q4 --end 2026Q3 --output-dir phase311_output

      - name: Upload census, hashes and deterministic sample
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase311-nport-historical-accession-census
          path: phase311_output/
          retention-days: 90
          if-no-files-found: error
