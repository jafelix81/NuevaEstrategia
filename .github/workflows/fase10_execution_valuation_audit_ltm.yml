name: Fase 10 - Execution and Valuation Audit LTM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase10:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance
      - name: Run Phase 10
        run: python Nueva_Estrategia_Fase10_ExecutionValuationAudit_LTM.py
      - name: Upload Phase 10 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase10-execution-valuation-audit-ltm-results
          path: nueva_estrategia_phase10_execution_valuation_audit/**
          if-no-files-found: warn
          retention-days: 14
