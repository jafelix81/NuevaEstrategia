name: Phase 170 Cboe Option Trades public sample and PIT audit

on:
  pull_request:
    branches: [main]
    paths:
      - research/phase170_cboe_option_trades_public_sample_audit.py
      - research/test_phase170_cboe_option_trades_public_sample_audit.py
      - .github/workflows/phase170_cboe_option_trades_public_sample_audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase170-cboe-option-trades-public-sample-audit
  cancel-in-progress: false

jobs:
  sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Phase 170
        run: python -m py_compile research/phase170_cboe_option_trades_public_sample_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase170_cboe_option_trades_public_sample_audit
      - name: Download and audit public Cboe Option Trades sample in memory
        id: audit
        continue-on-error: true
        run: >-
          python -m research.phase170_cboe_option_trades_public_sample_audit
          --output-dir phase170_output
      - name: Upload metadata-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase170-cboe-option-trades-public-sample-audit
          path: phase170_output/phase170_cboe_option_trades_public_sample_summary.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Enforce public sample schema gate after artifact upload
        if: always()
        run: |
          test -f phase170_output/phase170_cboe_option_trades_public_sample_summary.json
          python -c "import json; p='phase170_output/phase170_cboe_option_trades_public_sample_summary.json'; s=json.load(open(p)); assert s['status'] in {'PASS_SCHEMA_SAMPLE', 'DIAGNOSTIC_COMPLETE_ROW_GATE_FAIL'}, s['status']; print('ROW_GATE_STATUS=' + s['status'])"
