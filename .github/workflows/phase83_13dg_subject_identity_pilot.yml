name: Phase 83 - SEC 13D/13G stratified subject-identity pilot

on:
  push:
    branches:
      - phase82-13dg-global-index-coverage-audit
    paths:
      - research/phase83_13dg_identity_pilot_trigger.txt
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run SEC submission, XML, index-pair and snapshot regression tests
        run: >-
          python -m unittest
          research.test_phase73_sec_submission_text_extractor
          research.test_phase74_13dg_global_subject_audit
          research.test_phase82_13dg_global_index_snapshot
          -v

  stratified_identity_pilot:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Trigger Phase 83 120-filing SEC 13D/13G subject identity pilot')
    needs: offline_tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run 43-quarter deterministic stratified complete-submission identity pilot
        run: >-
          python -u -m research.phase74_13dg_global_subject_audit
          --mode pilot
          --target-cik-file research/phase82_current_candidate_ciks.csv
          --quarters "2016Q1,2016Q2,2016Q3,2016Q4,2017Q1,2017Q2,2017Q3,2017Q4,2018Q1,2018Q2,2018Q3,2018Q4,2019Q1,2019Q2,2019Q3,2019Q4,2020Q1,2020Q2,2020Q3,2020Q4,2021Q1,2021Q2,2021Q3,2021Q4,2022Q1,2022Q2,2022Q3,2022Q4,2023Q1,2023Q2,2023Q3,2023Q4,2024Q1,2024Q2,2024Q3,2024Q4,2025Q1,2025Q2,2025Q3,2025Q4,2026Q1,2026Q2,2026Q3"
          --sample-limit 120
          --outdir phase83_global_13dg_identity_pilot
          --sleep-seconds 0.8
      - name: Upload Phase 83 identity-pilot raw submissions and validation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase83-global-13dg-subject-identity-pilot
          path: phase83_global_13dg_identity_pilot/
          if-no-files-found: warn
          retention-days: 90
