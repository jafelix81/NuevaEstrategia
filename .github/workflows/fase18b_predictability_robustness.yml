name: Fase 18B - Robustez Predictibilidad

on:
  workflow_dispatch:

jobs:
  phase18b:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      # ============================================================
      # FASE 15B
      # Motor exacto del baseline C20
      # Genera phase15b_c20_trades.csv
      # ============================================================

      - name: Run Phase 15B
        run: |
          python -u "Nueva_Estrategia_Fase15B_Drawdown_Audit_LTM.py"

      - name: Verify Phase 15B output
        run: |
          test -f "phase15b_c20_trades.csv"
          echo "OK - phase15b_c20_trades.csv encontrado"
          ls -lh "phase15b_c20_trades.csv"

      # ============================================================
      # FASE 16B
      # Anatomy of Momentum Failure
      # ============================================================

      - name: Run Phase 16B
        env:
          PHASE15B_TRADES_PATH: phase15b_c20_trades.csv
        run: |
          python -u "Nueva_Estrategia_Fase16B_Momentum_Failure_Anatomy.py"

      - name: Verify Phase 16B output
        run: |
          test -f "fase16B_momentum_failure_anatomy.csv"
          echo "OK - fase16B_momentum_failure_anatomy.csv encontrado"
          ls -lh "fase16B_momentum_failure_anatomy.csv"

      # ============================================================
      # FASE 17
      # Ex-ante Momentum Failure Predictability
      # Usa el matching robusto:
      # ExecutionDate + Ticker + round(Notional, 8)
      # ============================================================

      - name: Run Phase 17
        run: |
          python -u "Nueva_Estrategia_Fase17_Momentum_Failure_Predictability.py"

      - name: Verify Phase 17 output
        run: |
          test -f "nueva_estrategia_phase17_failure_predictability/phase17_entry_factor_dataset.csv"
          echo "OK - dataset de Phase 17 encontrado"
          ls -lh "nueva_estrategia_phase17_failure_predictability/phase17_entry_factor_dataset.csv"

      # ============================================================
      # FASE 18B
      # Robustez de Predictibilidad
      # ============================================================

      - name: Run Phase 18B
        env:
          PHASE17_DATASET_PATH: nueva_estrategia_phase17_failure_predictability/phase17_entry_factor_dataset.csv
        run: |
          python -u "Nueva_Estrategia_Fase18B_Predictability_Robustness.py"

      # ============================================================
      # DIAGNOSTICO FINAL
      # ============================================================

      - name: List generated files
        if: always()
        run: |
          echo "========================================"
          echo "ARCHIVOS GENERADOS"
          echo "========================================"
          find . -maxdepth 3 -type f | sort

      # ============================================================
      # GUARDAR RESULTADOS COMO ARTIFACT
      # ============================================================

      - name: Upload Phase 18B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase18b_predictability_robustness
          path: |
            phase15b_c20_trades.csv
            fase16B_momentum_failure_anatomy.csv
            nueva_estrategia_phase17_failure_predictability/
            nueva_estrategia_phase18b_predictability_robustness/
          if-no-files-found: warn
