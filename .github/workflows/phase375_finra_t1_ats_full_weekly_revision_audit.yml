name: Phase 375 - FINRA T1 ATS full weekly revision audit

on:
  push:
    branches:
      - phase375-finra-t1-ats-full-weekly-revision-audit
    paths:
      - "research/phase375_finra_t1_ats_full_weekly_revision_audit.py"
      - "research/test_phase375_finra_t1_ats_full_weekly_revision_audit.py"
      - ".github/workflows/phase375_finra_t1_ats_full_weekly_revision_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase375-finra-t1-ats-full-weekly-revision-audit
  cancel-in-progress: false

jobs:
  full-weekly-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      FINRA_API_TOKEN: \${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase371_finra_t1_ats_monthly_coverage_audit.py research/phase374_finra_t1_ats_revision_stable_symbol_panel.py research/phase375_finra_t1_ats_full_weekly_revision_audit.py research/test_phase375_finra_t1_ats_full_weekly_revision_audit.py
          python -m unittest -v research.test_phase375_finra_t1_ats_full_weekly_revision_audit
      - name: Retrieve every T1 historic weekly partition and calculate revision-stable panel
        run: python -u -m research.phase375_finra_t1_ats_full_weekly_revision_audit --output phase375_finra_t1_ats_full_weekly_revision_audit
      - name: Enforce retrieval and research-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase375_finra_t1_ats_full_weekly_revision_audit/summary.json",encoding="utf-8"))
          if not r.get("all_partitions_complete") or r.get("errors"):
              sys.exit("Phase 375 full weekly retrieval is incomplete")
          if not r.get("inventory",{}).get("consecutive") or r.get("completed_partitions") != 209:
              sys.exit("Phase 375 did not validate all 209 consecutive weekly partitions")
          if r.get("pit_availability_established") is not False or r.get("historical_signal_test_authorized"):
              sys.exit("Phase 375 cannot claim exact PIT or authorize returns")
          if r.get("forward_returns_used") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Research-only controls violated")
          if r.get("raw_rows_retained") or r.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers retained")
          print("PHASE375_FULL_WEEKLY_RETRIEVAL=PASS")
          print("WEEKS=",r["completed_partitions"],"ROWS=",r["total_rows"],"PAGES=",r["total_pages"])
          print("STABLE_SYMBOL_COVERAGE=",r["revision_stable_concentration_symbol_coverage_pct"])
          print("STABLE_SHARE_COVERAGE=",r["revision_stable_share_volume_coverage_pct"])
          print("PIT_AVAILABILITY=NOT_ESTABLISHED")
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase375-finra-t1-ats-full-weekly-revision-audit
          path: phase375_finra_t1_ats_full_weekly_revision_audit/
          if-no-files-found: warn
          retention-days: 90
