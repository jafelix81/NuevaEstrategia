name: Phase 39 - SEC Form 4 actual-file feasibility audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase39_sec_form4_actual_file_audit.yml'
      - 'research/PHASE39_SEC_FORM4_INSIDER_FEASIBILITY_2026-10-26.md'
  workflow_dispatch:

concurrency:
  group: phase39-sec-form4-actual-file-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download representative SEC quarterly files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          UA='NuevaEstrategia/Phase39 data-feasibility audit contact research'
          BASE='https://www.sec.gov/files'
          for spec in \
            'datastandardsinnovation/data/insider-transactions-data-sets/2026q3_form345.zip 2026q3_form345.zip' \
            'structureddata/data/insider-transactions-data-sets/2012q1_form345.zip 2012q1_form345.zip'; do
            set -- $spec
            url="$BASE/$1"
            out="audit/$2"
            echo "Downloading $url"
            curl --fail --show-error --location --retry 6 --retry-all-errors --retry-delay 5 \
              --connect-timeout 30 --max-time 180 -A "$UA" \
              -H 'Accept: application/zip, application/octet-stream, */*' \
              -H 'Accept-Encoding: gzip, deflate' "$url" -o "$out"
            test -s "$out"
            file "$out"
            unzip -t "$out" >/dev/null
          done

      - name: Inspect ZIP schemas and required fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, json, zipfile
          from pathlib import Path

          required = {
              'SUBMISSION.tsv': {'ACCESSION_NUMBER','FILING_DATE','ISSUERCIK','ISSUERNAME','ISSUERTRADINGSYMBOL'},
              'NONDERIV_TRANS.tsv': {'ACCESSION_NUMBER','TRANS_DATE','TRANS_CODE','TRANS_SHARES','TRANS_PRICEPERSHARE','TRANS_ACQUIRED_DISP_CD'},
              'REPORTINGOWNER.tsv': {'ACCESSION_NUMBER','RPTOWNERCIK','RPTOWNERNAME','RPTOWNER_RELATIONSHIP'},
          }
          out=[]
          for fn in ['audit/2012q1_form345.zip','audit/2026q3_form345.zip']:
              with zipfile.ZipFile(fn) as z:
                  names=z.namelist()
                  rec={'file':fn,'members':names,'headers':{},'required_fields_ok':{}}
                  for target, req in required.items():
                      if target not in names:
                          raise SystemExit(f'{fn}: missing required member {target}')
                      with z.open(target) as f:
                          header=f.readline().decode('utf-8-sig',errors='replace').rstrip('\r\n')
                      cols=set(next(csv.reader([header]), []))
                      rec['headers'][target]=sorted(cols)
                      missing=sorted(req-cols)
                      rec['required_fields_ok'][target]=not missing
                      if missing:
                          raise SystemExit(f'{fn}: {target} missing fields {missing}')
                  out.append(rec)
          Path('audit/schema_report.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2)[:30000])
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase39-sec-form4-actual-file-audit
          path: audit/
          if-no-files-found: error
