name: Phase 39 - SEC Form 4 actual-file feasibility audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/phase39_sec_form4_actual_file_audit.yml'
      - 'research/PHASE39_SEC_FORM4_INSIDER_FEASIBILITY_2026-10-26.md'
  workflow_dispatch:

concurrency:
  group: phase39-sec-form4-actual-file-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download representative SEC quarterly files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          UA='NuevaEstrategia/Phase39 data-feasibility audit contact research'
          curl -fL --retry 4 --retry-delay 3 -A "$UA" \
            'https://www.sec.gov/files/datastandardsinnovation/data/insider-transactions-data-sets/2026q3_form345.zip' \
            -o audit/2026q3_form345.zip
          curl -fL --retry 4 --retry-delay 3 -A "$UA" \
            'https://www.sec.gov/files/structureddata/data/insider-transactions-data-sets/2012q1_form345.zip' \
            -o audit/2012q1_form345.zip

      - name: Inspect ZIP schemas and coverage fields
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv, io, json, os, zipfile
          from pathlib import Path

          out=[]
          for fn in ['audit/2012q1_form345.zip','audit/2026q3_form345.zip']:
              z=zipfile.ZipFile(fn)
              names=z.namelist()
              rec={'file':fn,'members':names}
              for n in names:
                  low=n.lower()
                  if low.endswith('.csv') and any(k in low for k in ['submission','nonderiv_trans','reportingowner','metadata']):
                      with z.open(n) as f:
                          raw=f.read(200000).decode('utf-8-sig',errors='replace')
                      lines=raw.splitlines()
                      if lines:
                          rec.setdefault('csv_headers',{})[n]=next(csv.reader([lines[0]]))
              out.append(rec)
          Path('audit/schema_report.json').write_text(json.dumps(out,indent=2),encoding='utf-8')
          print(json.dumps(out,indent=2)[:20000])
          PY

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase39-sec-form4-actual-file-audit
          path: audit/
          if-no-files-found: error
