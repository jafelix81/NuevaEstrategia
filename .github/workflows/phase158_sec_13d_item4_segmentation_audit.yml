name: Phase 158 SEC 13D Item 4 segmentation and amendment audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase158_*"
      - "research/test_phase158_*"
      - ".github/workflows/phase158_sec_13d_item4_segmentation_audit.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: phase158-sec-13d-item4-segmentation
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download immutable Phase 124 role-aware sample
        uses: actions/download-artifact@v4
        with:
          name: phase124-global-sec-13dg-stratified-submission-audit
          run-id: 42073725379
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase124_source
      - name: Download immutable Phase 157 legacy HTML audit
        uses: actions/download-artifact@v4
        with:
          name: phase157-sec-13dg-legacy-html-pit-feasibility
          run-id: 42224436013
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase157_source
      - name: Compile and run regression tests
        env:
          PHASE124_DIR: phase124_source
          PHASE157_DIR: phase157_source
        run: |
          python -m py_compile research/phase158_13d_item4_segmentation_audit.py
          python -m unittest discover -s research -p 'test_phase158_*.py' -v
      - name: Recompute Item 4 segmentation and amendment audit
        run: |
          python research/phase158_13d_item4_segmentation_audit.py \
            --phase124-dir phase124_source \
            --phase157-dir phase157_source \
            --output-dir phase158_output
      - name: Upload reproducible Item 4 audit
        uses: actions/upload-artifact@v4
        with:
          name: phase158-sec-13d-item4-segmentation-audit
          path: |
            phase158_output/phase158_13d_item4_segments.csv
            phase158_output/phase158_13d_item4_summary.json
          if-no-files-found: error
          retention-days: 30
