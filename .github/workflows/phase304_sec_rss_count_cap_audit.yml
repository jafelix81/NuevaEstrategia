name: Phase 304 SEC RSS count-cap and accession-coverage audit

on:
  push:
    branches: [phase304-sec-rss-count-cap-accession-coverage-audit]
    paths:
      - 'research/phase304_sec_rss_count_cap_audit.py'
      - 'research/test_phase304_sec_rss_count_cap_audit.py'
      - '.github/workflows/phase304_sec_rss_count_cap_audit.yml'

permissions:
  contents: read

concurrency:
  group: phase304-sec-rss-count-cap-audit
  cancel-in-progress: false

jobs:
  count-cap-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_CONTACT_EMAIL: \${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile research/phase303_sec_latest_filings_rss_probe.py research/phase304_sec_rss_count_cap_audit.py research/test_phase304_sec_rss_count_cap_audit.py
          python -m unittest -v research.test_phase304_sec_rss_count_cap_audit
          python -m unittest -v research.test_phase303_sec_latest_filings_rss_probe
      - name: Probe SEC Atom count capacity and accession coverage
        run: python -u -m research.phase304_sec_rss_count_cap_audit --output phase304_output
      - name: Upload raw Atom responses and audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase304-sec-rss-count-cap-audit
          path: phase304_output/
          if-no-files-found: warn
          retention-days: 90
