name: Phase 381 - FINRA price provider fallback feasibility audit

on:
  push:
    branches:
      - phase381-finra-price-provider-fallback-audit
    paths:
      - "research/phase381_finra_price_provider_fallback_audit.py"
      - "research/test_phase381_finra_price_provider_fallback_audit.py"
      - ".github/workflows/phase381_finra_price_provider_fallback_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase381-finra-price-provider-fallback-audit
  cancel-in-progress: false

jobs:
  provider-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests pandas numpy
      - name: Compile and test
        run: |
          python -m py_compile research/phase381_finra_price_provider_fallback_audit.py research/test_phase381_finra_price_provider_fallback_audit.py
          python -m unittest -v research.test_phase381_finra_price_provider_fallback_audit
      - name: Probe Yahoo, Stooq and Nasdaq
        run: python -u -m research.phase381_finra_price_provider_fallback_audit --output phase381_finra_price_provider_fallback_audit
      - name: Enforce no-mix/no-production controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase381_finra_price_provider_fallback_audit/summary.json",encoding="utf-8"))
          if r.get("raw_prices_retained") or r.get("alpha_test_authorized") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Phase 381 research-only controls violated")
          if r.get("fallback_accepted"):
              sys.exit("Provider fallback cannot be admitted by a feasibility-only audit")
          print("PHASE381_PROVIDER_FEASIBILITY=PASS")
          print("FALLBACK_ACCEPTED=False")
          PY
      - name: Upload provider metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase381-finra-price-provider-fallback-audit
          path: phase381_finra_price_provider_fallback_audit/
          if-no-files-found: warn
          retention-days: 90
