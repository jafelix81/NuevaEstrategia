name: Phase 48 - SEC 13D/13G source regime audit v4
on:
  push:
    branches: [phase48-sec-13dg-feasibility-audit-v4]
  workflow_dispatch:
concurrency:
  group: phase48-sec-13dg-source-regime-v4
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run source-regime audit v4
        run: python -u research/phase48_sec_13dg_source_regime_audit_v4.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase48-sec-13dg-source-regime-v4
          path: phase48_sec_13dg_source_regime_audit_v4/
          if-no-files-found: error
