name: Phase 665 - Form 144 accession-level PIT and plan-date join

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".github/workflows/phase665_form144_accession_pit_plan_date_join.yml"
      - "research/phase665_form144_accession_pit_plan_date_join.py"
      - "research/test_phase665_form144_accession_pit_plan_date_join.py"
      - "research/PHASE665_FORM144_ACCESSION_LEVEL_PIT_PLAN_DATE_JOIN_2026-11-27.md"
      - "research/PHASE665_FORM144_ACCESSION_LEVEL_PIT_PLAN_DATE_JOIN_2026-11-27.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-27_PHASE665.md"

permissions:
  contents: read

concurrency:
  group: phase665-form144-accession-pit-plan-date-join
  cancel-in-progress: true

jobs:
  offline-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run fixture regressions
        run: |
          python -m py_compile research/phase665_form144_accession_pit_plan_date_join.py research/test_phase665_form144_accession_pit_plan_date_join.py
          python -m unittest -v research.test_phase665_form144_accession_pit_plan_date_join
      - name: Reproduce the accession-level join against committed ledgers
        run: |
          python -m research.phase665_form144_accession_pit_plan_date_join --output phase665_output/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("phase665_output/summary.json").read_text())
          expected = {
              "structured_detail_accessions": 855,
              "research_observation_eligible_accessions": 807,
              "initial_baseline_no_lower_bound_accessions": 48,
              "formal_plan_date_accessions": 322,
              "formal_plan_date_and_research_observation_eligible_accessions": 290,
              "formal_plan_date_and_initial_baseline_accessions": 32,
              "public_availability_certified_accessions": 0,
              "signal_eligible_accessions": 0,
              "event_accessions_without_structured_details": 148,
              "structured_detail_accessions_without_event": 0,
          }
          for key, value in expected.items():
              assert summary["counts"][key] == value, (key, summary["counts"][key], value)
          assert summary["source_files"]["events"]["rows"] == 1003
          assert summary["source_files"]["events"]["unique_accessions"] == 1003
          assert summary["source_files"]["sale_details"]["rows"] == 5651
          assert summary["integrity"]["crossledger_pit_mismatches"] == 0
          assert summary["controls"]["signal_admitted"] is False
          print("Phase 665 actual-ledger reconciliation passed")
          PY
      - name: Upload reproducible Phase 665 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase665-form144-accession-pit-join
          path: phase665_output/summary.json
          if-no-files-found: warn
          retention-days: 90
