name: Phase 352 - Cboe Open-Close 1m v1.8 spec and PIT audit

on:
  push:
    branches:
      - phase352-cboe-open-close-1m-v18-pit-audit
    paths:
      - "research/phase352_cboe_open_close_1m_v18_spec_audit.py"
      - "research/test_phase352_cboe_open_close_1m_v18_spec_audit.py"
      - "research/PHASE352_CBOE_OPEN_CLOSE_1M_V18_SPEC_PIT_AUDIT_2026-11-13.md"
      - ".github/workflows/phase352_cboe_open_close_1m_v18_spec_audit.yml"
  pull_request:
    branches:
      - phase351-cboe-tbt-public-sample-row-grain-audit
    paths:
      - "research/phase352_cboe_open_close_1m_v18_spec_audit.py"
      - "research/test_phase352_cboe_open_close_1m_v18_spec_audit.py"
      - "research/PHASE352_CBOE_OPEN_CLOSE_1M_V18_SPEC_PIT_AUDIT_2026-11-13.md"
      - ".github/workflows/phase352_cboe_open_close_1m_v18_spec_audit.yml"

permissions:
  contents: read

concurrency:
  group: phase352-cboe-open-close-1m-v18-spec-audit
  cancel-in-progress: false

jobs:
  spec-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install PDF text extractor
        run: python -m pip install --disable-pip-version-check pypdf==5.9.0
      - name: Compile audit and tests
        run: python -m py_compile research/phase352_cboe_open_close_1m_v18_spec_audit.py research/test_phase352_cboe_open_close_1m_v18_spec_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase352_cboe_open_close_1m_v18_spec_audit
      - name: Download and audit official v1.8 specification
        run: python -m research.phase352_cboe_open_close_1m_v18_spec_audit --output phase352_output/spec_audit.json
      - name: Enforce documentation-only PIT and alpha gates
        run: |
          python - <<'PY'
          import json, sys
          path = "phase352_output/spec_audit.json"
          result = json.load(open(path, encoding="utf-8"))
          if result.get("status") != "PASS_SPEC_SEMANTICS":
              print(json.dumps(result, indent=2))
              sys.exit(1)
          gates = (
              "historical_pit_admitted",
              "prospective_pit_admitted",
              "alpha_admission",
              "return_test_authorized",
              "holdout_used",
          )
          if any(result.get(gate) for gate in gates):
              sys.exit(2)
          if not result.get("f80_frozen"):
              sys.exit(3)
          print("PHASE352_STATUS=" + result["status"])
          print("SNAPSHOT_MODEL=" + result["snapshot_model"])
          print("PIT_ALPHA_GATES=CLOSED")
          PY
      - name: Upload metadata-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase352-cboe-open-close-1m-v18-spec-audit
          path: phase352_output/spec_audit.json
          if-no-files-found: warn
          retention-days: 90
