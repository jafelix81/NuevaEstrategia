name: Phase 74 - SEC 13D/13G global subject discovery helper tests

on:
  push:
    branches:
      - phase74-13dg-global-subject-discovery-audit
      - phase76-global-13dg-archive-path-correction
    paths:
      - research/phase74_13dg_global_subject_audit.py
      - research/test_phase74_13dg_global_subject_audit.py
      - .github/workflows/phase74_13dg_global_subject_audit_tests.yml

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run Phase 74 offline tests
        run: python -m unittest research.test_phase74_13dg_global_subject_audit -v
      - name: Compile Phase 74 module
        run: python -m py_compile research/phase74_13dg_global_subject_audit.py
