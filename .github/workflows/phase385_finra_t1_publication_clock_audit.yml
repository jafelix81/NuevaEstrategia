name: Phase 385 - FINRA T1 publication clock census

on:
  push:
    branches: [phase385-finra-t1-publication-clock-census]
    paths:
      - ".github/workflows/phase385_finra_t1_publication_clock_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase385-finra-t1-publication-clock-census
  cancel-in-progress: false

jobs:
  publication-clock-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      FINRA_API_TOKEN: \${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install requests pandas-market-calendars==5.6.0
      - name: Compile and test
        run: |
          python -m py_compile research/phase371_finra_t1_ats_monthly_coverage_audit.py research/phase385_finra_t1_publication_clock_audit.py research/test_phase385_finra_t1_publication_clock_audit.py
          python -m unittest -v research.test_phase385_finra_t1_publication_clock_audit
      - name: Retrieve 209 weekly publication dates and derive conservative session clock
        run: python -u -m research.phase385_finra_t1_publication_clock_audit --output phase385_finra_t1_publication_clock_audit
      - name: Enforce date-level and research-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase385_finra_t1_publication_clock_audit/summary.json",encoding="utf-8"))
          if not r.get("all_partitions_complete") or r.get("completed_partitions") != 209:
              sys.exit("Phase 385 did not retrieve all 209 T1 partitions")
          if not r.get("date_level_clock_validated") or not r.get("all_date_level_clock_gates_pass"):
              sys.exit("FINRA date-level publication clock did not pass")
          if not r.get("metadata_stable"):
              sys.exit("FINRA metadata changed during snapshot")
          if r.get("historical_return_test_authorized") or r.get("forward_returns_used") or r.get("alpha_test_authorized"):
              sys.exit("Phase 385 cannot authorize or run return tests")
          if r.get("oos_test_used") or r.get("bootstrap_used") or r.get("loo_used") or r.get("holdout_used"):
              sys.exit("No OOS/bootstrap/LOO/holdout use is permitted")
          if r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Frozen baseline or production changed")
          if r.get("raw_rows_retained") or r.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers were retained")
          print("PHASE385_DATE_LEVEL_CLOCK=PASS")
          print("WEEKS=",r["completed_partitions"],"ROWS=",r["total_aggregate_rows"],"PAGES=",r["total_pages"])
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized date-only audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase385-finra-t1-publication-clock-audit
          path: phase385_finra_t1_publication_clock_audit/
          if-no-files-found: warn
          retention-days: 90
