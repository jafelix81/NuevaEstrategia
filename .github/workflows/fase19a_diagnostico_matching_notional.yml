name: Fase 19A - Diagnostico Matching Notional

on:
  workflow_dispatch:

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # PYTHON
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'


      # ======================================================
      # DEPENDENCIAS
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scipy yfinance openpyxl

          python -c "import numpy; print('numpy OK:', numpy.__version__)"
          python -c "import pandas; print('pandas OK:', pandas.__version__)"
          python -c "import scipy; print('scipy OK:', scipy.__version__)"
          python -c "import yfinance; print('yfinance OK:', yfinance.__version__)"
          python -c "import openpyxl; print('openpyxl OK:', openpyxl.__version__)"


      # ======================================================
      # PHASE 15B
      # ======================================================

      - name: Run exact Phase 15B baseline C20
        run: |
          python -u 'Nueva_Estrategia_Fase15B_Drawdown_Audit_LTM.py'


      - name: Verify Phase 15B ledger
        run: |
          test -f 'phase15b_c20_trades.csv'
          echo "Phase15B ledger OK"


      # ======================================================
      # PHASE 16B
      # ======================================================

      - name: Run exact Phase 16B
        env:
          PHASE15B_TRADES_PATH: phase15b_c20_trades.csv
        run: |
          python -u 'Nueva_Estrategia_Fase16B_Momentum_Failure_Anatomy.py'


      - name: Verify Phase 16B output
        run: |
          test -f 'fase16B_momentum_failure_anatomy.csv'
          echo "Phase16B output OK"


      # ======================================================
      # DIAGNÓSTICO MATCHING NOTIONAL
      # ======================================================

      - name: Run Notional matching diagnostic
        run: |
          python -u 'Nueva_Estrategia_Fase19A_Diagnostico_Matching_Notional.py'


      # ======================================================
      # VERIFICAR RESULTADOS
      # ======================================================

      - name: Verify diagnostic artifacts
        run: |

          test -f 'fase19a_notional_matching/phase19a_notional_missing_exact.csv'

          test -f 'fase19a_notional_matching/phase19a_notional_robust_matches.csv'

          test -f 'fase19a_notional_matching/phase19a_notional_duplicates_15b.csv'

          test -f 'fase19a_notional_matching/phase19a_notional_duplicates_16b.csv'

          test -f 'fase19a_notional_matching/phase19a_notional_matching_diagnostic.json'

          echo "Todos los artefactos existen."


      # ======================================================
      # SUBIR RESULTADOS
      # ======================================================

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase19a_notional_matching
          path: |
            fase19a_notional_matching/phase19a_notional_missing_exact.csv
            fase19a_notional_matching/phase19a_notional_robust_matches.csv
            fase19a_notional_matching/phase19a_notional_duplicates_15b.csv
            fase19a_notional_matching/phase19a_notional_duplicates_16b.csv
            fase19a_notional_matching/phase19a_notional_matching_diagnostic.json
          if-no-files-found: warn
