name: Phase 257 Form 144/Form 4 temporal-stratified placebo sensitivity
on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - 'research/phase257_form144_form4_temporal_stratified_placebo_audit.py'
      - 'research/test_phase257_form144_form4_temporal_stratified_placebo_audit.py'
      - '.github/workflows/phase257_form144_form4_temporal_stratified_placebo_audit.yml'
  workflow_dispatch:
concurrency:
  group: phase257-form144-temporal-placebo
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download immutable Phase 69 Form 144 artifact
        uses: actions/download-artifact@v4
        with:
          name: phase69-form144-incremental-fund-registrant-scan
          repository: ${{ github.repository }}
          run-id: 41959603351
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase257_input/form144
      - name: Download immutable Phase 39 Form 4 artifact
        uses: actions/download-artifact@v4
        with:
          name: phase39-sec-form4-actual-file-audit
          repository: ${{ github.repository }}
          run-id: 40606706518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase257_input/form4
      - name: Run Phase 257 unit tests
        run: python -m unittest discover -s research -p 'test_phase257_form144_form4_temporal_stratified_placebo_audit.py' -v
      - name: Reproduce temporal-stratified conditional placebos
        run: >-
          python -m research.phase257_form144_form4_temporal_stratified_placebo_audit
          --form144-csv phase257_input/form144/expanded_issuer_event_raw.csv
          --form4-zip phase257_input/form4/2026q3_form345.zip
          --output phase257_output/phase257_form144_form4_temporal_stratified_placebo_audit_result.json
          --permutations 1000 --seed 257
      - name: Enforce immutable sample and no-alpha controls
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase257_output/phase257_form144_form4_temporal_stratified_placebo_audit_result.json'))
          assert x['sample']['eligible_notices'] == 1451
          assert x['sample']['eligible_tranches'] == 1460
          assert x['sample']['form4_unique_owner_sale_blocks'] == 10525
          assert x['sample']['exact_date_share_links'] == 521
          assert x['sample']['fallback_links'] == 49
          assert x['permutations_per_stratification'] == 1000
          assert len(x['placebos']) == 3
          assert set(x['placebos']) == {'issuer_owner','issuer_owner_month','issuer_owner_iso_week'}
          for name, row in x['placebos'].items():
              assert row['status'] in {'COMPLETED','INSUFFICIENT_PERMUTABLE_GROUPS'}, name
              if row['status'] == 'COMPLETED':
                  assert row['replicates'] == 1000, name
                  assert 0 <= row['empirical_tail_plus_one'] <= 1, name
                  assert 0 <= row['holm_adjusted_tail'] <= 1, name
              else:
                  assert row['replicates'] == 0, name
                  assert row['empirical_tail_plus_one'] is None, name
          assert x['decision']['strict_pit_admitted'] is False
          assert x['decision']['alpha_test_authorized'] is False
          assert x['decision']['holdout_used'] is False
          assert x['decision']['f80_frozen'] is True
          print('Phase 257 temporal-stratification and no-alpha controls passed.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: phase257-form144-form4-temporal-stratified-placebo-audit
          path: phase257_output/*.json
          if-no-files-found: error
          retention-days: 90
