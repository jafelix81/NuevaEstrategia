name: Phase 308 SEC RSS prospective capture

on:
  push:
    branches: [phase308-sec-rss-prospective-capture]
    paths:
      - 'research/SEC_RSS_CAPTURE_TRIGGER.json'

permissions:
  contents: write

concurrency:
  group: phase308-sec-rss-prospective-capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: phase308-sec-rss-prospective-capture
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run capture-ledger regressions
        env:
          PYTHONPATH: .:research
        run: |
          python -m py_compile research/phase303_sec_latest_filings_rss_probe.py research/phase304_sec_rss_count_cap_audit.py research/phase305_sec_rss_start_offset_audit.py research/phase306_sec_rss_contiguous_scan.py research/phase308_sec_rss_prospective_capture.py research/test_phase308_sec_rss_prospective_capture.py
          python -m unittest -v research.test_phase308_sec_rss_prospective_capture
          python -m unittest -v research.test_phase306_sec_rss_contiguous_scan
          python -m unittest -v research.test_phase305_sec_rss_start_offset_audit
          python -m unittest -v research.test_phase304_sec_rss_count_cap_audit
          python -m unittest -v research.test_phase303_sec_latest_filings_rss_probe
      - name: Capture SEC Form 4 and Form 4/A owner-only feeds
        env:
          GITHUB_RUN_ID: \${{ github.run_id }}
          GITHUB_SHA: \${{ github.sha }}
        run: |
          python -u -m research.phase308_sec_rss_prospective_capture --output phase308_output --ledger research/data/sec_rss_prospective_ledger.json
      - name: Commit cumulative first-observation ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/sec_rss_prospective_ledger.json
          if ! git diff --cached --quiet; then
            git commit -m "Record SEC RSS prospective capture \${{ github.run_id }}"
            git push origin HEAD:phase308-sec-rss-prospective-capture
          fi
      - name: Upload raw Atom pages, manifest and ledger snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase308-sec-rss-capture-\${{ github.run_id }}
          path: phase308_output/
          if-no-files-found: warn
          retention-days: 90
