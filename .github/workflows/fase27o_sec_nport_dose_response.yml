name: Fase 27O - SEC N-PORT PIT dose-response diagnostic
on:
  push:
    branches: [phase27o-nport-dose-response]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install --disable-pip-version-check --no-input yfinance
      - name: Run Phase 27O
        run: python -u Nueva_Estrategia_Fase27O_SEC_NPORT_PIT_DoseResponse.py
      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: phase27o-nport-dose-response
          path: nueva_estrategia_phase27o_nport_dose_response/
          if-no-files-found: error
