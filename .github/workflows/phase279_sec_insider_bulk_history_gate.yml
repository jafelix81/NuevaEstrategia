name: Phase 279 SEC Insider Transactions bulk-history gate

on:
  push:
    branches:
      - phase231-cboe-option-quotes-full-row-reparse
    paths:
      - research/phase279_sec_insider_bulk_history_gate.py
      - research/test_phase279_sec_insider_bulk_history_gate.py
      - research/phase279_sec_insider_bulk_history_gate_result.json
      - .github/workflows/phase279_sec_insider_bulk_history_gate.yml
  pull_request:
    branches:
      - phase99-broad-pit-universe-charter
    paths:
      - research/phase279_sec_insider_bulk_history_gate.py
      - research/test_phase279_sec_insider_bulk_history_gate.py
      - research/phase279_sec_insider_bulk_history_gate_result.json
      - .github/workflows/phase279_sec_insider_bulk_history_gate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile Phase 279
        run: python -m compileall -q research/phase279_sec_insider_bulk_history_gate.py research/test_phase279_sec_insider_bulk_history_gate.py
      - name: Run Phase 279 regression tests
        run: python -m unittest research.test_phase279_sec_insider_bulk_history_gate -v
      - name: Build metadata-only result
        run: |
          mkdir -p phase279_sec_insider_bulk_history_gate
          python -m research.phase279_sec_insider_bulk_history_gate > phase279_sec_insider_bulk_history_gate/result.json
      - name: Upload metadata-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase279-sec-insider-bulk-history-gate
          path: phase279_sec_insider_bulk_history_gate/result.json
          retention-days: 90
          if-no-files-found: error
