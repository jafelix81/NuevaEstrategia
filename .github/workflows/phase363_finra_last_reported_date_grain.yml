name: Phase 363 - FINRA lastReportedDate row-grain audit

on:
  push:
    branches:
      - phase363-finra-last-reported-date-grain-audit
    paths:
      - "research/phase363_finra_last_reported_date_grain.py"
      - "research/test_phase363_finra_last_reported_date_grain.py"
      - ".github/workflows/phase363_finra_last_reported_date_grain.yml"
  pull_request:
    branches:
      - phase362-finra-lnd-duplicate-root-cause
    paths:
      - "research/phase363_finra_last_reported_date_grain.py"
      - "research/test_phase363_finra_last_reported_date_grain.py"
      - ".github/workflows/phase363_finra_last_reported_date_grain.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase363-finra-last-reported-date-grain
  cancel-in-progress: false

jobs:
  row-grain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile diagnostic and tests
        run: python -m py_compile research/phase363_finra_last_reported_date_grain.py research/test_phase363_finra_last_reported_date_grain.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase360_finra_symbol_bridge research.test_phase362_finra_lnd_duplicate_diagnostic research.test_phase363_finra_last_reported_date_grain
      - name: Retrieve one partition and test date-grain reconciliation
        run: python -m research.phase363_finra_last_reported_date_grain --output phase363_finra_last_reported_date_grain
      - name: Enforce retrieval-only controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase363_finra_last_reported_date_grain/summary.json", encoding="utf-8"))
          if result.get("retrieval_gate") != "PASS" or not result.get("api_record_total_match"):
              sys.exit("Phase 363 did not retrieve the complete FINRA partition")
          if result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          print("PHASE363_RETRIEVAL=PASS")
          print("DATA_GATE=" + str(result.get("overall_data_gate")))
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload metadata-only row-grain artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase363-finra-last-reported-date-grain
          path: phase363_finra_last_reported_date_grain/
          if-no-files-found: warn
          retention-days: 90
