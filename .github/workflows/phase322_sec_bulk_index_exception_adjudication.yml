name: Phase 322 SEC bulk/index exception adjudication

on:
  push:
    branches:
      - phase322-sec-bulk-index-exception-adjudication
    paths:
      - ".github/workflows/phase322_sec_bulk_index_exception_adjudication.yml"
      - "research/phase322_sec_bulk_index_exception_adjudication.py"
      - "research/test_phase322_sec_bulk_index_exception_adjudication.py"
      - "research/phase321_sec_bulk_daily_index_full_census.py"
      - "research/phase320_sec_bulk_daily_index_join.py"
      - "research/phase319_sec_daily_index_live_pilot.py"
      - "research/phase283_sec_daily_index_parser.py"
      - "research/phase318_nport_next_business_day_clock.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase322-sec-bulk-index-exception-adjudication
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run offline regressions
        run: |
          python -m compileall -q research/phase322_sec_bulk_index_exception_adjudication.py research/test_phase322_sec_bulk_index_exception_adjudication.py research/phase321_sec_bulk_daily_index_full_census.py research/phase320_sec_bulk_daily_index_join.py research/phase319_sec_daily_index_live_pilot.py research/phase283_sec_daily_index_parser.py research/phase318_nport_next_business_day_clock.py
          python -m unittest -v research.test_phase322_sec_bulk_index_exception_adjudication

      - name: Download immutable Phase 321 census artifact
        run: |
          mkdir -p phase321_input
          gh run download 43177940904 --repo jafelix81/NuevaEstrategia --name phase321-sec-bulk-daily-index-full-census --dir phase321_input

      - name: Adjudicate every quarantined accession against SEC master and daily indexes
        run: |
          python -m research.phase322_sec_bulk_index_exception_adjudication --census-dir phase321_input --output-dir phase322_output

      - name: Enforce denominator and frozen-baseline controls
        run: |
          python - <<'PY'
          import json, sys
          p = "phase322_output/phase322_exception_adjudication_result.json"
          r = json.load(open(p, encoding="utf-8"))
          if r.get("source_phase321", {}).get("exceptions_adjudicated") != 24:
              sys.exit("Phase 321 exception denominator changed")
          if r.get("exception_summary", {}).get("total") != 24:
              sys.exit("Expected all 24 exceptions")
          c = r.get("controls", {})
          for key in ("strict_pit_admitted", "alpha_test_authorized", "return_test_run",
                      "bootstrap_loo_run", "chronological_oos_run", "holdout_used",
                      "production_changed", "universe_changed", "capital_changed",
                      "parameters_changed", "raw_sec_bytes_uploaded", "vendor_contacted",
                      "data_purchased", "email_sent"):
              if c.get(key) is not False:
                  sys.exit("Research control unexpectedly opened: " + key)
          if c.get("f80_frozen") is not True:
              sys.exit("F80 frozen control failed")
          if r.get("retrieval", {}).get("raw_sec_bytes_uploaded") is not False:
              sys.exit("Raw SEC bytes must not be uploaded")
          print("PHASE322_STATUS=" + str(r.get("status")))
          print("EXCEPTION_SUMMARY=" + str(r.get("exception_summary")))
          print("MASTER_INDEX=" + str({k: r.get("master_index", {}).get(k) for k in ("files_downloaded", "years_searched")}))
          print("DAILY_INDEX=" + str({k: r.get("daily_index", {}).get(k) for k in ("files_downloaded", "unique_candidate_dates")}))
          print("RETRIEVAL=" + str({k: r.get("retrieval", {}).get(k) for k in ("http_request_errors", "parser_errors", "total_sec_bytes_downloaded")}))
          PY

      - name: Upload parsed adjudication, manifests and hashes only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase322-sec-bulk-index-exception-adjudication
          path: phase322_output/
          retention-days: 90
          if-no-files-found: warn
