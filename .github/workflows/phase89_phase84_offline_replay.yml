name: Phase 89 - Offline replay and correction of Phase 84 XML gate

on:
  push:
    branches:
      - phase89-phase84-xml-gate-correction
    paths:
      - research/phase84_13dg_role_aware_identity_audit.py
      - research/test_phase84_13dg_role_aware_identity_audit.py
      - research/phase89_phase84_offline_replay.py
      - research/test_phase89_phase84_offline_replay.py
      - research/PHASE89_PHASE84_XML_GATE_DENOMINATOR_CORRECTION_2026-11-04.md
      - .github/workflows/phase89_phase84_offline_replay.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  offline_replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependency
        run: python -m pip install requests
      - name: Download immutable Phase 84 artifact
        uses: actions/download-artifact@v4
        with:
          name: phase84-13dg-role-aware-identity-validation
          path: phase84_original_artifact
          repository: jafelix81/NuevaEstrategia
          run-id: 41914491120
          github-token: ${{ github.token }}
      - name: Run Phase 84 and Phase 89 regression tests
        run: >-
          python -m unittest
          research.test_phase73_sec_submission_text_extractor
          research.test_phase74_13dg_global_subject_audit
          research.test_phase84_13dg_role_aware_identity_audit
          research.test_phase89_phase84_offline_replay
          -v
      - name: Replay 600 raw submissions offline
        run: >-
          python -u -m research.phase89_phase84_offline_replay
          --artifact-dir phase84_original_artifact
          --target-cik-file research/phase82_current_candidate_ciks.csv
          --outdir phase89_phase84_offline_replay
          --source-run-id 41914491120
          --source-artifact-id 13364856424
      - name: Upload corrected replay summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase89-phase84-offline-replay
          path: phase89_phase84_offline_replay/
          if-no-files-found: warn
          retention-days: 90
