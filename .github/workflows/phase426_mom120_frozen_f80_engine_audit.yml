name: Phase 426 - MOM120 exact frozen F80 engine audit

on:
  push:
    branches: [phase426-mom120-frozen-f80-exact-engine]
    paths:
      - ".github/workflows/phase426_mom120_frozen_f80_engine_audit.yml"
      - "research/phase426_mom120_frozen_f80_engine_audit.py"
      - "Nueva_Estrategia_Fase11_Real1000_LTM_v4.py"

permissions:
  contents: read

concurrency:
  group: phase426-mom120-frozen-f80-exact-engine
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install numpy pandas yfinance scipy
      - name: Run exact frozen-engine comparison
        run: python -u research/phase426_mom120_frozen_f80_engine_audit.py
      - name: Upload Phase 426 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase426-mom120-frozen-f80-exact-engine
          path: phase426_output/
          retention-days: 90
          if-no-files-found: warn
