name: Phase 161 SEC 13D-G previous-accession one-to-many semantics audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase161_*"
      - "research/test_phase161_*"
      - ".github/workflows/phase161_sec_13dg_previous_accession_semantics_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase161-sec-13dg-previous-accession-semantics
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile research/phase161_13dg_previous_accession_semantics_audit.py
          python -m unittest discover -s research -p 'test_phase161_*.py' -v
      - name: Recompute targeted accession-reference audit
        run: |
          python research/phase161_13dg_previous_accession_semantics_audit.py \
            --output-dir phase161_output
      - name: Upload reproducible audit
        uses: actions/upload-artifact@v4
        with:
          name: phase161-sec-13dg-previous-accession-semantics-audit
          path: |
            phase161_output/phase161_13dg_previous_accession_semantics_groups.csv
            phase161_output/phase161_13dg_previous_accession_semantics_summary.json
          if-no-files-found: error
          retention-days: 30
