name: Fase 28E - SEC 13D/13G historical CIK crosswalk

on:
  push:
    branches: [phase28e-sec-13dg-historical-cik-crosswalk]
    paths:
      - 'Nueva_Estrategia_Fase28E_SEC_13DG_Historical_CIK_Crosswalk.py'
      - 'Nueva_Estrategia_Fase0_Descubrimiento.py'
      - '.github/workflows/fase28e_sec_13dg_historical_cik_crosswalk.yml'
  workflow_dispatch:

concurrency:
  group: fase28e-sec-13dg-historical-cik-crosswalk
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 28E
        run: python Nueva_Estrategia_Fase28E_SEC_13DG_Historical_CIK_Crosswalk.py
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: phase28e-sec-13dg-historical-cik-crosswalk
          path: nueva_estrategia_phase28e_sec_13dg_historical_cik_crosswalk/
