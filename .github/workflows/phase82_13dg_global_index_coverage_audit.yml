name: Phase 82 - Global SEC 13D/13G master-index coverage audit

on:
  push:
    branches:
      - phase82-13dg-global-index-coverage-audit
    paths:
      - research/phase74_13dg_global_subject_audit.py
      - research/test_phase74_13dg_global_subject_audit.py
      - research/test_phase82_13dg_global_index_snapshot.py
      - research/phase82_current_candidate_ciks.csv
      - research/phase82_13dg_global_index_trigger.txt
      - .github/workflows/phase82_13dg_global_index_coverage_audit.yml

permissions:
  contents: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  tests_and_guarded_index_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run Phase 74 and Phase 82 offline tests
        run: python -m unittest research.test_phase74_13dg_global_subject_audit research.test_phase82_13dg_global_index_snapshot -v
      - name: Compile global-index audit module
        run: python -m py_compile research/phase74_13dg_global_subject_audit.py
      - name: Run 43-quarter global index-only audit on explicit trigger commit
        if: contains(github.event.head_commit.message, 'Trigger Phase 82 43-quarter global 13D/13G index audit')
        run: >-
          python -u -m research.phase74_13dg_global_subject_audit
          --mode index-only
          --target-cik-file research/phase82_current_candidate_ciks.csv
          --quarters "2016Q1,2016Q2,2016Q3,2016Q4,2017Q1,2017Q2,2017Q3,2017Q4,2018Q1,2018Q2,2018Q3,2018Q4,2019Q1,2019Q2,2019Q3,2019Q4,2020Q1,2020Q2,2020Q3,2020Q4,2021Q1,2021Q2,2021Q3,2021Q4,2022Q1,2022Q2,2022Q3,2022Q4,2023Q1,2023Q2,2023Q3,2023Q4,2024Q1,2024Q2,2024Q3,2024Q4,2025Q1,2025Q2,2025Q3,2025Q4,2026Q1,2026Q2,2026Q3"
          --outdir phase82_global_13dg_index_audit
          --sleep-seconds 0.8
      - name: Upload Phase 82 index audit outputs
        if: always() && contains(github.event.head_commit.message, 'Trigger Phase 82 43-quarter global 13D/13G index audit')
        uses: actions/upload-artifact@v4
        with:
          name: phase82-global-13dg-index-coverage-audit
          path: phase82_global_13dg_index_audit/
          retention-days: 90
