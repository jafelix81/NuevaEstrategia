name: Fase 38 - FINRA ATS Historical Security Coverage Audit

on:
  push:
    paths:
      - 'Nueva_Estrategia_Fase38_FINRA_ATS_Historical_Audit.py'
      - '.github/workflows/fase38_finra_ats_historical_audit.yml'
  workflow_dispatch:

concurrency:
  group: phase38-finra-ats-historical-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests numpy pandas yfinance scipy
      - name: Run historical security-level audit
        run: python -u Nueva_Estrategia_Fase38_FINRA_ATS_Historical_Audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase38-finra-ats-historical-audit
          path: phase38_finra_ats_audit/
          retention-days: 30
          if-no-files-found: error
