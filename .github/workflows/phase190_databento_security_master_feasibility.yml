name: Phase 190 Databento PIT security master feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase190_databento_security_master_feasibility.py"
      - "research/phase190_databento_security_master_feasibility.json"
      - "research/test_phase190_databento_security_master_feasibility.py"
      - ".github/workflows/phase190_databento_security_master_feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase190-databento-security-master-feasibility
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: python -m py_compile research/phase190_databento_security_master_feasibility.py research/test_phase190_databento_security_master_feasibility.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase190_databento_security_master_feasibility
      - name: Build deterministic feasibility audit
        run: python -m research.phase190_databento_security_master_feasibility --output phase190_output/phase190_databento_security_master_audit.json
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase190-databento-security-master-feasibility
          path: phase190_output/phase190_databento_security_master_audit.json
          if-no-files-found: error
          retention-days: 90
