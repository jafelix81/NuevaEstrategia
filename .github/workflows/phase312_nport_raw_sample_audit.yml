name: Phase 312 N-PORT raw stratified sample audit

on:
  push:
    branches:
      - phase312-nport-raw-stratified-sample
    paths:
      - ".github/workflows/phase312_nport_raw_sample_audit.yml"
      - "research/phase312_nport_raw_sample_audit.py"
      - "research/test_phase312_nport_raw_sample_audit.py"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - ".github/workflows/phase312_nport_raw_sample_audit.yml"
      - "research/phase312_nport_raw_sample_audit.py"
      - "research/test_phase312_nport_raw_sample_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase312-nport-raw-sample-${{ github.ref }}
  cancel-in-progress: false

jobs:
  raw-sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install HTTP dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download immutable Phase 311 sample artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase311-nport-historical-accession-census
          repository: ${{ github.repository }}
          run-id: 43156706936
          github-token: ${{ github.token }}
          path: phase311_input

      - name: Compile and run Phase 312 regressions
        run: |
          python -m compileall -q research/phase312_nport_raw_sample_audit.py research/test_phase312_nport_raw_sample_audit.py
          python -m unittest -v research.test_phase312_nport_raw_sample_audit

      - name: Retrieve and audit the 56 accession sample
        run: python research/phase312_nport_raw_sample_audit.py --input-dir phase311_input --output-dir phase312_output

      - name: Upload raw bytes, hashes and reconciliation outputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase312-nport-raw-stratified-sample
          path: phase312_output/
          retention-days: 90
          if-no-files-found: error
