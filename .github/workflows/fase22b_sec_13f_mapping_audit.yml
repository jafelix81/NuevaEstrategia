name: Fase 22C - SEC 13F Fuzzy Mapping Audit
on:
  push:
    branches: [phase22b-sec-13f-mapping-audit]
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pandas requests
      - name: Run Phase 22C
        run: python -u Nueva_Estrategia_Fase22C_SEC_13F_Fuzzy_Mapping_Audit.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase22c-sec-13f-fuzzy-mapping-audit
          path: nueva_estrategia_phase22c_sec_13f_fuzzy_mapping_audit/**
          retention-days: 30
