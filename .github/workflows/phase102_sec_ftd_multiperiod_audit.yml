name: Phase 102 - SEC FTD multi-period archive audit

on:
  push:
    branches: [phase99-broad-pit-universe-charter]
    paths:
      - 'research/phase102_sec_ftd_multiperiod_audit.py'
      - 'research/test_phase102_sec_ftd_multiperiod_audit.py'
      - '.github/workflows/phase102_sec_ftd_multiperiod_audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase102-sec-ftd-multiperiod-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: pip install requests
      - name: Run offline parser tests
        run: python -m unittest research.test_phase102_sec_ftd_multiperiod_audit -v
      - name: Audit official SEC archive regimes
        run: python -u research/phase102_sec_ftd_multiperiod_audit.py
      - name: Upload audit outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase102-sec-ftd-multiperiod-audit
          path: phase102_sec_ftd_multiperiod/
          retention-days: 90
          if-no-files-found: warn
