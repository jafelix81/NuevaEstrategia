name: Phase 369 - FINRA T1 ATS expanded PIT and grain audit

on:
  push:
    branches:
      - phase369-finra-t1-ats-expanded-pit-grain-audit
    paths:
      - "research/phase369_finra_t1_ats_expanded_pit_grain_audit.py"
      - "research/test_phase369_finra_t1_ats_expanded_pit_grain_audit.py"
      - ".github/workflows/phase369_finra_t1_ats_expanded_pit_grain_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase369-finra-t1-ats-expanded-pit-grain-audit
  cancel-in-progress: false

jobs:
  expanded-t1-ats-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FINRA_API_TOKEN: \${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase369_finra_t1_ats_expanded_pit_grain_audit.py research/test_phase369_finra_t1_ats_expanded_pit_grain_audit.py
          python -m unittest -v research.test_phase369_finra_t1_ats_expanded_pit_grain_audit
      - name: Retrieve 19 full T1 historical partitions and audit PIT/grain
        run: python -m research.phase369_finra_t1_ats_expanded_pit_grain_audit --output phase369_finra_t1_ats_expanded_pit_grain_audit
      - name: Enforce research-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase369_finra_t1_ats_expanded_pit_grain_audit/summary.json",encoding="utf-8"))
          if not r.get("all_partitions_complete") or r.get("errors"):
              sys.exit("Phase 369 did not retrieve every preregistered partition")
          if r.get("pit_availability_established") is not False:
              sys.exit("Phase 369 must not claim exact PIT availability")
          if r.get("historical_signal_test_authorized") or r.get("forward_returns_used") or r.get("holdout_used") or r.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          if r.get("raw_rows_retained") or r.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers were retained")
          print("PHASE369_RETRIEVAL=PASS")
          print("PIT_AVAILABILITY=NOT_ESTABLISHED")
          print("HISTORICAL_SIGNAL_TEST=NOT_AUTHORIZED")
          print("ALL_T1_ATS_DATE_GATES=",r["all_t1_ats_date_gates_pass"])
          print("ALL_T1_ATS_BRIDGE_GATES=",r["all_t1_ats_bridge_gates_pass"])
          for p in r["partitions"]:
              b=p["ats_symbol_firm_bridge"]
              print(f"WEEK={p['week']}|ROWS={p['rows']}|ATS_DATE={p['ats_date_pit_candidate']}|BRIDGE={b['bridge_gate']}|MATCH={b['both_exact_matches']}/{b['unambiguous_bridges']}")
          PY
      - name: Upload anonymized audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase369-finra-t1-ats-expanded-pit-grain-audit
          path: phase369_finra_t1_ats_expanded_pit_grain_audit/
          if-no-files-found: warn
          retention-days: 90
