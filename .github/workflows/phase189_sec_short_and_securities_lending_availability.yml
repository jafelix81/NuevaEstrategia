name: Phase 189 SEC Form SHO and FINRA SLATE future availability audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase189_sec_short_and_securities_lending_availability.py"
      - "research/test_phase189_sec_short_and_securities_lending_availability.py"
      - ".github/workflows/phase189_sec_short_and_securities_lending_availability.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase189-sec-short-lending-availability
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: python -m py_compile research/phase189_sec_short_and_securities_lending_availability.py research/test_phase189_sec_short_and_securities_lending_availability.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase189_sec_short_and_securities_lending_availability
      - name: Build deterministic future-availability audit
        run: python -m research.phase189_sec_short_and_securities_lending_availability --output phase189_output/phase189_short_lending_availability_audit.json
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase189-sec-short-lending-availability
          path: phase189_output/phase189_short_lending_availability_audit.json
          if-no-files-found: error
          retention-days: 90
