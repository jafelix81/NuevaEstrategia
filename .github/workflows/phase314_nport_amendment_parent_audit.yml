name: Phase 314 Otter Creek N-PORT amendment parent audit

on:
  push:
    branches:
      - phase313-nport-sgml-header-identity-correction
    paths:
      - ".github/workflows/phase314_nport_amendment_parent_audit.yml"
      - "research/phase314_nport_amendment_parent_audit.py"
      - "research/test_phase314_nport_amendment_parent_audit.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase314-otter-creek-parent-audit
  cancel-in-progress: false

jobs:
  parent-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download Phase 311 historical accession census
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase311-nport-historical-accession-census
          repository: jafelix81/NuevaEstrategia
          run-id: 43156706936
          github-token: ${{ github.token }}
          path: phase311_input

      - name: Download Phase 312 raw sample and Otter Creek amendment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase312-nport-raw-stratified-sample
          repository: jafelix81/NuevaEstrategia
          run-id: 43157888685
          github-token: ${{ github.token }}
          path: phase312_input

      - name: Download Phase 310 same-series 2023 control
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase310-nport-raw-filing-vintage-audit
          repository: jafelix81/NuevaEstrategia
          run-id: 43154326395
          github-token: ${{ github.token }}
          path: phase310_input

      - name: Compile and run Phase 314 regressions
        run: |
          python -m compileall -q research/phase314_nport_amendment_parent_audit.py research/test_phase314_nport_amendment_parent_audit.py
          python -m unittest -v research.test_phase314_nport_amendment_parent_audit

      - name: Resolve the 2022 Otter Creek original candidate
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
        run: |
          python research/phase314_nport_amendment_parent_audit.py             --phase311-dir phase311_input             --phase312-dir phase312_input             --phase310-dir phase310_input             --output-dir phase314_output

      - name: Upload parent and position-vintage audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase314-otter-creek-parent-audit
          path: phase314_output/
          retention-days: 90
          if-no-files-found: error
