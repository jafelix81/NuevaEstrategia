name: Nueva Estrategia - Fase 1 Confirmacion

on:
  workflow_dispatch:
  schedule:
    - cron: '20 19 * * 1-5'

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance

      - name: Run Phase 1
        run: python Nueva_Estrategia_Fase1_Confirmacion.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nueva-estrategia-phase1-${{ github.run_id }}
          path: nueva_estrategia_phase1_confirmacion/
          if-no-files-found: error
