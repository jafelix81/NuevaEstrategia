name: Phase 94 - DOOD formula regression tests

on:
  push:
    branches:
      - phase94-dood-exact-replication-spec
    paths:
      - "research/phase94_dood.py"
      - "research/test_phase94_dood.py"
      - ".github/workflows/phase94_dood_formula.yml"
  pull_request:
    branches:
      - main
    paths:
      - "research/phase94_dood.py"
      - "research/test_phase94_dood.py"
      - ".github/workflows/phase94_dood_formula.yml"

permissions:
  contents: read

jobs:
  formula-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run deterministic DOOD formula tests
        run: python -m unittest research.test_phase94_dood -v
