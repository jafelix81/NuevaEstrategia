name: Phase 380 - CFTC TFF full post-launch archive census

on:
  push:
    branches:
      - phase380-cftc-tff-full-postlaunch-archive-census
    paths:
      - "research/phase380_cftc_tff_full_postlaunch_archive_census.py"
      - "research/test_phase380_cftc_tff_full_postlaunch_archive_census.py"
      - ".github/workflows/phase380_cftc_tff_full_postlaunch_archive_census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase380-cftc-tff-full-postlaunch-archive-census
  cancel-in-progress: false

jobs:
  full-archive-census:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase380_cftc_tff_full_postlaunch_archive_census.py research/test_phase380_cftc_tff_full_postlaunch_archive_census.py
          python -m unittest -v research.test_phase380_cftc_tff_full_postlaunch_archive_census
      - name: Retrieve every post-launch report archive page
        run: python -u -m research.phase380_cftc_tff_full_postlaunch_archive_census --output phase380_cftc_tff_full_postlaunch_archive_census
      - name: Enforce full census and PIT-proxy controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase380_cftc_tff_full_postlaunch_archive_census/summary.json",encoding="utf-8"))
          if not r.get("dataset_metadata_stable") or not r.get("full_postlaunch_archive_census_gate"):
              sys.exit("Full post-launch archive census incomplete or dataset changed")
          if not r.get("official_schedule_not_earlier_gate") or not r.get("first_tff_report_date_gate"):
              sys.exit("Official schedule or first-report timestamp gate failed")
          if r.get("archive_updated_is_formally_defined_as_first_publication") or r.get("strict_historical_pit_authorized"):
              sys.exit("Archive Updated was incorrectly promoted to certified PIT")
          if r.get("raw_html_retained") or r.get("raw_positions_retained") or r.get("raw_trader_ids_retained") or r.get("forward_returns_used") or r.get("alpha_test_authorized") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Research-only controls violated")
          print("PHASE380_CFTC_TFF_FULL_ARCHIVE_CENSUS=PASS")
          print("POSTLAUNCH_ARCHIVE_COVERAGE=",r["archive_pages_retrieved"],"/",r["primary_postlaunch_report_date_count"])
          print("BACKCAST_REPORT_DATES=",r["backcast_report_date_count_before_first_tff_report"])
          print("STRICT_PIT=NOT_AUTHORIZED")
          PY
      - name: Upload date-only census summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase380-cftc-tff-full-postlaunch-archive-census
          path: phase380_cftc_tff_full_postlaunch_archive_census/
          if-no-files-found: warn
          retention-days: 90
