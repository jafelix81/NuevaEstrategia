name: Fase 5 - Long-Term Momentum

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 5
        run: |
          python Nueva_Estrategia_Fase5_LongTermMomentum.py

      - name: Upload Phase 5 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase5-longterm-momentum-results
          path: |
            nueva_estrategia_phase5_longterm_momentum/**
          if-no-files-found: warn
          retention-days: 14
