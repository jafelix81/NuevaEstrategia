name: Phase 365 - FINRA weekly partition data probe

on:
  push:
    branches:
      - phase365-finra-weekly-partition-data-probe
    paths:
      - "research/phase365_finra_weekly_partition_data_probe.py"
      - "research/test_phase365_finra_weekly_partition_data_probe.py"
      - ".github/workflows/phase365_finra_weekly_partition_data_probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase365-finra-weekly-partition-data-probe
  cancel-in-progress: false

jobs:
  data-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile probe and tests
        run: python -m py_compile research/phase365_finra_weekly_partition_data_probe.py research/test_phase365_finra_weekly_partition_data_probe.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase365_finra_weekly_partition_data_probe
      - name: Probe actual rows behind partition metadata
        run: python -m research.phase365_finra_weekly_partition_data_probe --output phase365_finra_weekly_partition_data_probe
      - name: Enforce retrieval-only research controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase365_finra_weekly_partition_data_probe/summary.json", encoding="utf-8"))
          if result.get("queries_completed") != result.get("queries_expected") or result.get("query_errors"):
              sys.exit("Phase 365 did not complete all targeted probes")
          if not result.get("all_page_counts_match"):
              sys.exit("One or more FINRA sample page counts failed")
          if result.get("raw_rows_retained") or result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          print("PHASE365_DATA_PROBE=PASS")
          print("QUERIES=" + str(result["queries_completed"]))
          print("CURRENT_OLD_PARTITIONS_WITH_ROWS=" + str(result["current_dataset_old_partition_nonzero_count"]))
          print("UNDOCUMENTED_NA_NMS_PARTITIONS_WITH_ROWS=" + str(result["undocumented_na_nms_nonzero_count"]))
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized metadata-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase365-finra-weekly-partition-data-probe
          path: phase365_finra_weekly_partition_data_probe/
          if-no-files-found: warn
          retention-days: 90
