name: Phase 80 - SEC Entity Landing Page PIT audit

on:
  push:
    branches:
      - phase80-sec-entity-landing-page-pit-audit
    paths:
      - research/phase80_sec_entity_landing_page_audit.py
      - research/test_phase80_sec_entity_landing_page_audit.py
      - research/phase80_sec_entity_landing_page_trigger.txt
      - .github/workflows/phase80_sec_entity_landing_page_audit.yml

permissions:
  contents: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  tests_and_guarded_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run Phase 80 offline tests
        run: python -m unittest research.test_phase80_sec_entity_landing_page_audit -v
      - name: Compile Phase 80 module
        run: python -m py_compile research/phase80_sec_entity_landing_page_audit.py
      - name: Run bounded SEC page audit only on explicit trigger commit
        if: contains(github.event.head_commit.message, 'Trigger Phase 80 bounded SEC Entity Landing Page audit')
        run: python -u -m research.phase80_sec_entity_landing_page_audit --outdir phase80_sec_entity_landing_page_audit --sleep-seconds 0.6 --max-js 8
      - name: Upload Phase 80 audit outputs
        if: always() && contains(github.event.head_commit.message, 'Trigger Phase 80 bounded SEC Entity Landing Page audit')
        uses: actions/upload-artifact@v4
        with:
          name: phase80-sec-entity-landing-page-audit
          path: phase80_sec_entity_landing_page_audit/
          retention-days: 90
