name: Phase 361 - FINRA five-week firm-to-symbol reconciliation

on:
  push:
    branches:
      - phase361-finra-five-week-bridge-audit
    paths:
      - "research/phase361_finra_five_week_bridge.py"
      - "research/test_phase361_finra_five_week_bridge.py"
      - ".github/workflows/phase361_finra_five_week_bridge.yml"
  pull_request:
    branches:
      - phase360-finra-symbol-bridge-reconciliation
    paths:
      - "research/phase361_finra_five_week_bridge.py"
      - "research/test_phase361_finra_five_week_bridge.py"
      - ".github/workflows/phase361_finra_five_week_bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase361-finra-five-week-bridge-audit
  cancel-in-progress: false

jobs:
  five-week-bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile diagnostic and tests
        run: python -m py_compile research/phase361_finra_five_week_bridge.py research/test_phase361_finra_five_week_bridge.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase360_finra_symbol_bridge research.test_phase361_finra_five_week_bridge
      - name: Retrieve and reconcile five historical weeks
        run: python -m research.phase361_finra_five_week_bridge --output phase361_finra_five_week_bridge
      - name: Enforce retrieval-only controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase361_finra_five_week_bridge/summary.json", encoding="utf-8"))
          if result.get("partitions_completed") != 10 or result.get("request_errors"):
              sys.exit("Phase 361 did not retrieve all ten requested partitions")
          if result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          print("PHASE361_RETRIEVAL=PASS")
          print("DATA_GATE=" + str(result.get("overall_data_gate")))
          print("LND_DUPLICATE_REPRODUCED=" + str(result.get("known_phase107_lnd_duplicate_reproduced")))
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload metadata-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase361-finra-five-week-bridge
          path: phase361_finra_five_week_bridge/
          if-no-files-found: warn
          retention-days: 90
