name: Phase 333 SEC TradingSymbol share-class binding audit

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "research/phase333_symbol_class_binding_audit.py"
      - "research/test_phase333_symbol_class_binding_audit.py"
      - "research/phase333_symbol_class_binding_manifest.json"
      - ".github/workflows/phase333_sec_symbol_class_binding.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase333-sec-symbol-class-binding
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Phase 333
        run: python -m py_compile research/phase333_symbol_class_binding_audit.py research/test_phase333_symbol_class_binding_audit.py
      - name: Run offline regressions
        run: python -m unittest -v research.test_phase333_symbol_class_binding_audit
      - name: Re-fetch nine hash-pinned SEC XBRL documents
        run: python -m research.phase333_symbol_class_binding_audit --output-dir phase333_output
      - name: Validate hashes, symbols, direct-binding discipline and frozen baseline
        run: |
          python - <<'PY'
          import json
          p = "phase333_output/phase333_symbol_class_binding_audit.json"
          s = json.load(open(p, encoding="utf-8"))
          assert s["phase"] == 333
          c = s["controls"]
          assert c["f80_frozen"] is True
          assert c["strict_pit_admitted"] is False
          assert c["security_master_admitted"] is False
          assert c["alpha_test_run"] is False
          assert c["return_test_run"] is False
          assert c["holdout_used"] is False
          assert c["production_changed"] is False
          assert c["data_purchased"] is False
          if s["status"] == "COMPLETED_SEC_SYMBOL_CLASS_BINDING_PILOT":
              assert len(s["documents"]) == 9
              assert s["summary"]["hash_matches"] == 9
              assert s["summary"]["hash_mismatches"] == 0
              for d in s["documents"]:
                  assert d["hash_match"] is True
                  assert d["filing_date"] < d["event_date"]
                  assert d["actual_symbols"] == d["expected_symbols"]
          else:
              assert s["status"] == "BLOCKED_MISSING_SEC_CONTACT_EMAIL"
          print("PHASE333_STATUS=" + s["status"])
          print("PHASE333_SUMMARY=" + json.dumps(s.get("summary", {}), sort_keys=True))
          PY
      - name: Upload Phase 333 XBRL binding audit
        uses: actions/upload-artifact@v4
        with:
          name: phase333-sec-symbol-class-binding-audit
          path: phase333_output/
          if-no-files-found: error
          retention-days: 90
