name: Phase 256 Form 144/Form 4 lag-preserving linkage placebos
on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - 'research/phase256_form144_form4_lag_preserving_placebo_audit.py'
      - 'research/test_phase256_form144_form4_lag_preserving_placebo_audit.py'
      - 'research/PHASE256_FORM144_FORM4_LAG_PRESERVING_PLACEBO_CORRECTION_2026-11-10.md'
      - 'research/phase256_form144_form4_lag_preserving_placebo_audit_result.json'
      - '.github/workflows/phase256_form144_form4_lag_preserving_placebo_audit.yml'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download immutable Phase 69 Form 144 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase69-form144-incremental-fund-registrant-scan
          repository: ${{ github.repository }}
          run-id: 41959603351
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase256_input/form144
      - name: Download immutable Phase 39 Form 4 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase39-sec-form4-actual-file-audit
          repository: ${{ github.repository }}
          run-id: 40606706518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase256_input/form4
      - name: Run Phase 256 unit tests
        run: python -m unittest discover -s research -p 'test_phase256_form144_form4_lag_preserving_placebo_audit.py' -v
      - name: Reproduce lag-preserving conditional placebos
        run: >-
          python -m research.phase256_form144_form4_lag_preserving_placebo_audit
          --form144-csv phase256_input/form144/expanded_issuer_event_raw.csv
          --form4-zip phase256_input/form4/2026q3_form345.zip
          --output phase256_output/phase256_form144_form4_lag_preserving_placebo_audit_result.json
          --permutations 1000 --seed 210
      - name: Enforce immutable linkage, lag-envelope and no-alpha controls
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase256_output/phase256_form144_form4_lag_preserving_placebo_audit_result.json'))
          assert x['sample']['eligible_notices'] == 1451
          assert x['sample']['eligible_tranches'] == 1460
          assert x['sample']['form4_unique_owner_sale_blocks'] == 10525
          assert x['sample']['exact_date_share_links'] == 521
          assert x['sample']['fallback_links'] == 49
          p=x['permutation_audit']
          assert p['replicates'] == 1000
          assert p['group_structure']['all_original_lags_within_0_4'] is True
          assert p['group_structure']['original_lag_min'] == 0
          assert p['group_structure']['original_lag_max'] == 4
          assert 'keep each block' in p['lag_null_design']
          assert x['phase210_raw_date_shuffle_invalidity']['mean_invalid_fraction'] > 0.35
          for name, row in p['placebos'].items():
              assert row['replicates'] == 1000, name
              assert row['null_replicates_at_or_above_observed'] == 0, name
              assert row['observed_mutable_exact_links'] > row['null_max'], name
          assert x['decision']['strict_pit_admitted'] is False
          assert x['decision']['alpha_test_authorized'] is False
          assert x['decision']['holdout_used'] is False
          assert x['decision']['f80_frozen'] is True
          print('Phase 256 linkage, lag-preserving nulls and no-alpha controls passed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase256-form144-form4-lag-preserving-placebo-audit
          path: phase256_output/*.json
          if-no-files-found: error
          retention-days: 90
