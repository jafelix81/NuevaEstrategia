name: Phase 320 SEC bulk-to-daily-index join audit

on:
  push:
    branches:
      - phase320-sec-bulk-daily-index-join
    paths:
      - ".github/workflows/phase320_sec_bulk_daily_index_join.yml"
      - "research/phase320_sec_bulk_daily_index_join.py"
      - "research/test_phase320_sec_bulk_daily_index_join.py"
      - "research/phase283_sec_daily_index_parser.py"
      - "research/phase318_nport_next_business_day_clock.py"
      - "research/phase319_sec_daily_index_live_pilot.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase320-sec-bulk-daily-index-join
  cancel-in-progress: false

jobs:
  bulk-index-join:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run offline regressions
        run: |
          python -m compileall -q research/phase283_sec_daily_index_parser.py research/phase318_nport_next_business_day_clock.py research/phase319_sec_daily_index_live_pilot.py research/phase320_sec_bulk_daily_index_join.py research/test_phase320_sec_bulk_daily_index_join.py
          python -m unittest -v research.test_phase320_sec_bulk_daily_index_join

      - name: Download immutable Phase 294 source artifact
        run: |
          mkdir -p phase294_input
          gh run download 43083625013 --repo jafelix81/NuevaEstrategia --name phase294-sec-form4-bulk-sample-acquisition --dir phase294_input

      - name: Reconcile stratified bulk accessions to SEC daily indexes and original headers
        run: |
          python -m research.phase320_sec_bulk_daily_index_join --archive-dir phase294_input --output-dir phase320_output

      - name: Enforce source integrity and frozen-baseline controls
        run: |
          python - <<'PY'
          import json, sys
          p = "phase320_output/phase320_bulk_daily_index_join_result.json"
          r = json.load(open(p, encoding="utf-8"))
          if r.get("source_archives", {}).get("archives_verified") != 6:
              sys.exit("Six Phase 294 archives were not verified")
          if r.get("sample", {}).get("sampled_accessions") != 72:
              sys.exit("Expected 72 deterministic sample accessions")
          if r.get("original_header_crosscheck", {}).get("headers_identity_mismatch", 0) != 0:
              sys.exit("Original SEC header/entity identity mismatch; inspect quarantined rows")
          if r.get("original_header_crosscheck", {}).get("dual_path_equivalence_mismatch", 0) != 0:
              sys.exit("Issuer and SEC-HEADER entity paths returned different payload hashes")
          if r.get("original_header_crosscheck", {}).get("dual_path_equivalence_verified", 0) != 72:
              sys.exit("Expected 72 original-header entity-path equivalence checks")
          if r.get("daily_index_join", {}).get("bulk_accessions_found_on_filed_date", 0) != 72:
              sys.exit("Not all bulk accessions were found on their official filed-date index")
          if r.get("daily_index_join", {}).get("index_identity_conflicts", 0) != 0:
              sys.exit("Daily-index accession identity conflict")
          if r.get("retrieval", {}).get("http_request_errors", 0) != 0:
              sys.exit("SEC retrieval error; inspect partial audit artifact")
          if r.get("retrieval", {}).get("parser_errors", 0) != 0:
              sys.exit("SEC parser error; inspect partial audit artifact")
          c = r.get("controls", {})
          for key in ("strict_pit_admitted", "alpha_test_authorized", "return_test_run",
                      "bootstrap_loo_run", "chronological_oos_run", "holdout_used",
                      "production_changed", "universe_changed", "capital_changed",
                      "parameters_changed", "raw_sec_bytes_uploaded", "vendor_contacted",
                      "data_purchased", "email_sent"):
              if c.get(key) is not False:
                  sys.exit("Research control unexpectedly opened: " + key)
          if c.get("f80_frozen") is not True:
              sys.exit("F80 frozen control failed")
          print("PHASE320_STATUS=" + str(r.get("status")))
          print("BULK_TO_INDEX=" + str(r.get("daily_index_join")))
          print("ORIGINAL_HEADER=" + str(r.get("original_header_crosscheck")))
          PY

      - name: Upload parsed metadata, hashes and join results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase320-sec-bulk-daily-index-join
          path: phase320_output/
          retention-days: 90
          if-no-files-found: warn
