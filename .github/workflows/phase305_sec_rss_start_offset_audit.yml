name: Phase 305 SEC RSS start-offset pagination audit

on:
  push:
    branches: [phase305-sec-rss-start-offset-pagination-audit]
    paths:
      - 'research/phase305_sec_rss_start_offset_audit.py'
      - 'research/test_phase305_sec_rss_start_offset_audit.py'
      - '.github/workflows/phase305_sec_rss_start_offset_audit.yml'

permissions:
  contents: read

concurrency:
  group: phase305-sec-rss-start-offset-audit
  cancel-in-progress: false

jobs:
  offset-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_CONTACT_EMAIL: \${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run offline regression tests
        env:
          PYTHONPATH: research
        run: |
          python -m py_compile research/phase303_sec_latest_filings_rss_probe.py research/phase304_sec_rss_count_cap_audit.py research/phase305_sec_rss_start_offset_audit.py research/test_phase305_sec_rss_start_offset_audit.py
          python -m unittest -v research.test_phase305_sec_rss_start_offset_audit
          python -m unittest -v research.test_phase304_sec_rss_count_cap_audit
          python -m unittest -v research.test_phase303_sec_latest_filings_rss_probe
      - name: Probe SEC Atom start-offset pagination
        run: python -u -m research.phase305_sec_rss_start_offset_audit --output phase305_output
      - name: Upload raw Atom pages and audit result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase305-sec-rss-start-offset-audit
          path: phase305_output/
          if-no-files-found: warn
          retention-days: 90
