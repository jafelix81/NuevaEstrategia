name: Fase 16B - Momentum Failure Anatomy

on:
  workflow_dispatch:

jobs:
  phase16b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Phase 15B exact engine and export C20 trade ledger
        run: |
          # Replace the following filename with the exact Phase 15B engine
          # already used in the repository if its filename differs.
          python -u Nueva_Estrategia_Fase15B_Drawdown_Audit_LTM.py
          test -f phase15b_c20_trades.csv

      - name: Run Phase 16B
        env:
          PHASE15B_TRADES_PATH: phase15b_c20_trades.csv
        run: |
          python -u Nueva_Estrategia_Fase16B_Momentum_Failure_Anatomy.py
