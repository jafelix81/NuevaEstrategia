name: Fase 16B - Momentum Failure Anatomy

on:
  workflow_dispatch:

jobs:
  phase16b:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy

      - name: Run Phase 15B exact engine
        run: |
          python -u Nueva_Estrategia_Fase15B_Drawdown_Audit_LTM.py
          test -f phase15b_c20_trades.csv

      - name: Run Phase 16B
        env:
          PHASE15B_TRADES_PATH: phase15b_c20_trades.csv
        run: |
          python -u Nueva_Estrategia_Fase16B_Momentum_Failure_Anatomy.py

      - name: Upload Phase 16B diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: fase16B-momentum-failure-anatomy
          path: |
            phase15b_c20_trades.csv
            fase16B_momentum_failure_anatomy.csv
            nueva_estrategia_phase15_drawdown_audit_ltm/**
