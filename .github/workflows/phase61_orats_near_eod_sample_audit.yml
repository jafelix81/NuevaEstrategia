name: Phase 61 - ORATS Near-EOD public sample audit

on:
  push:
    branches:
      - phase61-orats-near-eod-sample-audit
    paths:
      - "research/phase61_orats_near_eod_sample_audit.py"
      - "research/test_phase61_orats_near_eod_sample_audit.py"
      - ".github/workflows/phase61_orats_near_eod_sample_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run parser and coverage tests
        run: python -m unittest research.test_phase61_orats_near_eod_sample_audit -v
      - name: Download and audit public ORATS sample
        run: python research/phase61_orats_near_eod_sample_audit.py
      - name: Upload ORATS sample audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase61-orats-near-eod-public-sample
          path: phase61_orats_near_eod_sample_audit/
          if-no-files-found: warn
          retention-days: 30
