name: Fase 27A - SEC N-PORT Feasibility
on:
  push:
    branches: ["phase27a-sec-nport-feasibility"]
  workflow_dispatch:
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 27A
        run: python Nueva_Estrategia_Fase27A_SEC_NPORT_Feasibility.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase27a-sec-nport-feasibility
          path: phase27a_sec_nport_feasibility.json
