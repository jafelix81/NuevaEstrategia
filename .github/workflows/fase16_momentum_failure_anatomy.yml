name: Fase 16 - Momentum Failure Anatomy

on:
  workflow_dispatch:

jobs:
  phase16:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Phase 16
        env:
          PHASE12_LEDGER_PATH: ${{ vars.PHASE12_LEDGER_PATH }}
        run: |
          python -u Nueva_Estrategia_Fase16_Momentum_Failure_Anatomy.py
