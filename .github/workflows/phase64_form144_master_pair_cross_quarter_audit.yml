name: Phase 64 - SEC Form 144 master-pair cross-quarter identity audit

on:
  push:
    branches: [phase64-sec-form144-master-pair-validation]
    paths:
      - 'research/phase50_form144_global_index_pilot.py'
      - 'research/phase64_form144_master_pair_cross_quarter_audit.py'
      - 'research/test_phase64_form144_master_pair_cross_quarter_audit.py'
      - '.github/workflows/phase64_form144_master_pair_cross_quarter_audit.yml'
  workflow_dispatch:

concurrency:
  group: phase64-form144-master-pair-audit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 50 parser regression tests
        run: python -m unittest research.test_phase50_form144_global_index_pilot -v
      - name: Run Phase 64 identity tests
        run: python -m unittest research.test_phase64_form144_master_pair_cross_quarter_audit -v
      - name: Audit six independent quarters
        run: python -u research/phase64_form144_master_pair_cross_quarter_audit.py --quarters 2023Q2,2024Q1,2024Q4,2025Q1,2025Q4,2026Q1 --target-per-form 25 --control-per-form 25 --workers 5
      - name: Upload Phase 64 outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase64-form144-master-pair-cross-quarter-audit
          path: phase64_form144_master_pair_audit/
          if-no-files-found: warn
