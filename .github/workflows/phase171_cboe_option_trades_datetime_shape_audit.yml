name: Phase 171 Cboe Option Trades date-time shape audit

on:
  pull_request:
    branches: [main]
    paths:
      - research/phase171_cboe_option_trades_datetime_shape_audit.py
      - research/test_phase171_cboe_option_trades_datetime_shape_audit.py
      - .github/workflows/phase171_cboe_option_trades_datetime_shape_audit.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase171-cboe-option-trades-datetime-shape
  cancel-in-progress: false

jobs:
  datetime-shape-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Phase 171
        run: python -m py_compile research/phase171_cboe_option_trades_datetime_shape_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase171_cboe_option_trades_datetime_shape_audit
      - name: Download and audit public Cboe sample in memory
        run: python -m research.phase171_cboe_option_trades_datetime_shape_audit --output-dir phase171_output
      - name: Upload metadata-only diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase171-cboe-option-trades-datetime-shape
          path: phase171_output/phase171_cboe_option_trades_datetime_shape_summary.json
          if-no-files-found: ignore
          retention-days: 90
      - name: Enforce diagnostic-only output contract
        if: always()
        run: |
          test -f phase171_output/phase171_cboe_option_trades_datetime_shape_summary.json
          python -c "import json; p='phase171_output/phase171_cboe_option_trades_datetime_shape_summary.json'; s=json.load(open(p)); assert s['status']=='DIAGNOSTIC_COMPLETE'; assert s['alpha_admission'] is False; assert s['strict_pit'] is False; print('PHASE171_STATUS=' + s['status'])"
