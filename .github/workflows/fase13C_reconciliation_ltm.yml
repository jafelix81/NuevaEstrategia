name: Phase 13C - Reconciliation Phase12 vs Corrected Buffer

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 13C
        run: python -u Nueva_Estrategia_Fase13C_Reconciliation_LTM.py

      - name: Upload Phase 13C artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase13c-reconciliation-ltm
          path: nueva_estrategia_phase13c_reconciliation_ltm/
