name: Fase 7 - Economic Robustness LTM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 7
        run: |
          python Nueva_Estrategia_Fase7_EconomicRobustness_LTM.py

      - name: Upload Phase 7 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase7-economic-robustness-ltm-results
          path: nueva_estrategia_phase7_economic_robustness/**
          if-no-files-found: warn
          retention-days: 14
