name: Phase 267 FINRA short-interest PIT and pagination audit

on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - "research/phase267_finra_short_interest_audit_input.json"
      - "research/phase267_finra_short_interest_pit_pagination_audit.py"
      - "research/test_phase267_finra_short_interest_pit_pagination_audit.py"
      - "research/PHASE267_FINRA_SHORT_INTEREST_PIT_PAGINATION_AUDIT_2026-11-10.md"
      - ".github/workflows/phase267_finra_short_interest_pit_pagination_audit.yml"
  pull_request:
    branches: [phase99-broad-pit-universe-charter]
    paths:
      - "research/phase267_finra_short_interest_audit_input.json"
      - "research/phase267_finra_short_interest_pit_pagination_audit.py"
      - "research/test_phase267_finra_short_interest_pit_pagination_audit.py"
      - "research/PHASE267_FINRA_SHORT_INTEREST_PIT_PAGINATION_AUDIT_2026-11-10.md"
      - ".github/workflows/phase267_finra_short_interest_pit_pagination_audit.yml"

permissions:
  contents: read

concurrency:
  group: phase267-finra-short-interest-pit-pagination-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned XNYS calendar dependencies
        run: python -m pip install pandas==2.2.3 exchange_calendars==4.13.1
      - name: Compile Phase 267 audit and tests
        run: python -m py_compile research/phase267_finra_short_interest_pit_pagination_audit.py research/test_phase267_finra_short_interest_pit_pagination_audit.py
      - name: Run Phase 267 deterministic tests
        run: python -m unittest -v research.test_phase267_finra_short_interest_pit_pagination_audit
      - name: Build deterministic audit result
        run: python -m research.phase267_finra_short_interest_pit_pagination_audit --output phase267_output/phase267_finra_short_interest_pit_pagination_audit_result.json
      - name: Enforce no-PIT/no-alpha decision and calendar/pagination counts
        run: |
          python - <<'PY'
          import json
          p = "phase267_output/phase267_finra_short_interest_pit_pagination_audit_result.json"
          r = json.load(open(p, encoding="utf-8"))
          assert r["status"] == "INVALIDATED_PIT_AND_UNVERIFIED_HISTORICAL_COVERAGE"
          assert r["retrieval_audit"]["coverage_status"] == "UNVERIFIED_FIRST_PAGE_ONLY"
          assert r["settlement_calendar_audit"]["wrong_settlement_queries"] == 2
          assert r["publication_and_execution_audit"]["old_knowledge_date_early_cycles"] == 19
          assert r["publication_and_execution_audit"]["training_price_anchor_lookahead_cycles"] == 55
          assert r["revision_vintage_audit"]["revision_flag_rows"] == 102
          assert r["decision"]["historical_alpha_admitted"] is False
          assert r["decision"]["f80_frozen"] is True
          print("PHASE267_STATUS=" + r["status"])
          print("PHASE267_API_CAPPED_PAGES=" + str(r["retrieval_audit"]["successful_queries"]))
          print("PHASE267_PUBLICATION_DATE_EARLY=" + str(r["publication_and_execution_audit"]["old_knowledge_date_early_cycles"]))
          PY
      - name: Upload metadata-only Phase 267 result
        uses: actions/upload-artifact@v4
        with:
          name: phase267-finra-short-interest-pit-pagination-audit
          path: phase267_output/phase267_finra_short_interest_pit_pagination_audit_result.json
          if-no-files-found: error
          retention-days: 90
