name: Phase 354 - OCC to Cboe EOD open-interest cross-check

on:
  push:
    branches:
      - phase354-occ-cboe-eod-oi-crosscheck
    paths:
      - .github/workflows/phase354_occ_cboe_eod_oi_crosscheck.yml
      - research/phase354_occ_cboe_eod_oi_crosscheck.py
      - research/test_phase354_occ_cboe_eod_oi_crosscheck.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase354-occ-cboe-eod-oi-crosscheck
  cancel-in-progress: false

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: |
          python -m py_compile research/phase354_occ_cboe_eod_oi_crosscheck.py research/test_phase354_occ_cboe_eod_oi_crosscheck.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase354_occ_cboe_eod_oi_crosscheck
      - name: Download public Cboe sample and OCC daily OI reports
        run: python -m research.phase354_occ_cboe_eod_oi_crosscheck --output phase354_output/audit.json
      - name: Enforce diagnostic-only research gates
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase354_output/audit.json", encoding="utf-8"))
          if result.get("status") != "COMPLETED_CROSS_SOURCE_OI_DIAGNOSTIC":
              print(json.dumps(result, indent=2))
              sys.exit(1)
          gates = (
              "historical_pit_admitted", "prospective_pit_admitted",
              "licensing_confirmed", "return_test_authorized",
              "alpha_admission", "holdout_used",
          )
          if any(result.get("gates", {}).get(gate) for gate in gates):
              sys.exit(2)
          if not result.get("gates", {}).get("f80_frozen"):
              sys.exit(3)
          print("PHASE354_STATUS=" + result["status"])
          for field, alignment in result["alignment_by_field"].items():
              print(f"{field}_ALIGNMENT={alignment['status']}")
          print("PIT_ALPHA_GATES=CLOSED")
          PY
      - name: Upload metadata-only artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase354-occ-cboe-eod-oi-crosscheck
          path: phase354_output/audit.json
          if-no-files-found: warn
          retention-days: 90
