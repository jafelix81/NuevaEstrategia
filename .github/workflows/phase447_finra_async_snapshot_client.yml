name: Phase 447 FINRA Async Snapshot Client

on:
  pull_request:
    paths:
      - 'research/phase447_finra_async_snapshot_client.py'
      - 'research/test_phase447_finra_async_snapshot_client.py'
      - '.github/workflows/phase447_finra_async_snapshot_client.yml'
  push:
    branches:
      - main
    paths:
      - 'research/phase447_finra_async_snapshot_client.py'
      - 'research/test_phase447_finra_async_snapshot_client.py'
      - '.github/workflows/phase447_finra_async_snapshot_client.yml'

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated dependency
        run: python -m pip install requests
      - name: Compile client
        run: python -m py_compile research/phase447_finra_async_snapshot_client.py
      - name: Run synthetic contract tests
        run: python -m unittest discover -s research -p 'test_phase447_finra_async_snapshot_client.py' -v
