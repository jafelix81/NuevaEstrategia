name: Fase 19C - QUICK Confirmation

on:
  workflow_dispatch:

jobs:
  phase19c:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy yfinance scipy

      - name: Run Phase 19C
        run: |
          python -u Nueva_Estrategia_Fase19C_QUICK_Confirmation.py

      - name: Upload Phase 19C artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fase19c-quick-confirmation
          path: nueva_estrategia_phase19c_quick_confirmation/
