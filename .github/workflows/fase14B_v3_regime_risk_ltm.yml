name: Phase 14B v3 - Market Regime Risk Management LTM

on:
  workflow_dispatch:

jobs:
  run-phase14b-v3:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 14B v3
        run: python -u Nueva_Estrategia_Fase14B_v3_RegimeRisk_LTM.py

      - name: Upload Phase 14B v2 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14B-v3-regime-risk-ltm
          path: nueva_estrategia_phase14B_regime_risk_ltm/
          if-no-files-found: warn
