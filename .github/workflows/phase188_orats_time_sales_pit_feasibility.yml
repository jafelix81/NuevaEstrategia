name: Phase 188 ORATS Time & Sales PIT and acquisition feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase188_orats_time_sales_pit_feasibility.py"
      - "research/test_phase188_orats_time_sales_pit_feasibility.py"
      - ".github/workflows/phase188_orats_time_sales_pit_feasibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase188-orats-time-sales-pit-feasibility
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: python -m py_compile research/phase188_orats_time_sales_pit_feasibility.py research/test_phase188_orats_time_sales_pit_feasibility.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase188_orats_time_sales_pit_feasibility
      - name: Build deterministic PIT and acquisition audit
        run: python -m research.phase188_orats_time_sales_pit_feasibility --output phase188_output/phase188_orats_time_sales_pit_audit.json
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase188-orats-time-sales-pit-feasibility
          path: phase188_output/phase188_orats_time_sales_pit_audit.json
          if-no-files-found: error
          retention-days: 90
