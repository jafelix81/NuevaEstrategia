name: Phase 371 - FINRA T1 ATS monthly coverage and concentration audit

on:
  push:
    branches:
      - phase371-finra-t1-ats-monthly-coverage-concentration-audit
    paths:
      - "research/phase371_finra_t1_ats_monthly_coverage_audit.py"
      - "research/test_phase371_finra_t1_ats_monthly_coverage_audit.py"
      - ".github/workflows/phase371_finra_t1_ats_monthly_coverage_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase371-finra-t1-ats-monthly-coverage-concentration-audit
  cancel-in-progress: false

jobs:
  monthly-t1-ats-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase371_finra_t1_ats_monthly_coverage_audit.py research/test_phase371_finra_t1_ats_monthly_coverage_audit.py
          python -m unittest -v research.test_phase371_finra_t1_ats_monthly_coverage_audit
      - name: Retrieve one full T1 partition per month and audit coverage, PIT and concentration
        run: python -u -m research.phase371_finra_t1_ats_monthly_coverage_audit --output phase371_finra_t1_ats_monthly_coverage_audit
      - name: Enforce research-only controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase371_finra_t1_ats_monthly_coverage_audit/summary.json",encoding="utf-8"))
          if not r.get("all_partitions_complete") or r.get("errors") or r.get("missing_months"):
              sys.exit("Phase 371 monthly partition retrieval is incomplete")
          if r.get("pit_availability_established") is not False or r.get("historical_signal_test_authorized"):
              sys.exit("Phase 371 cannot claim exact PIT or authorize signal tests")
          if r.get("forward_returns_used") or r.get("holdout_used") or r.get("f80_changed"):
              sys.exit("Research-only controls violated")
          if r.get("raw_rows_retained") or r.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers retained")
          print("PHASE371_RETRIEVAL=PASS")
          print("MONTHS=",r["expected_months"])
          print("ROWS=",r["total_rows"],"PAGES=",r["total_pages"])
          print("DATE_GATES=",sum(p["ats_date_gate"] for p in r["partitions"]),"/",len(r["partitions"]))
          print("BRIDGE_GATES=",sum(p["bridge"]["bridge_gate"]=="PASS" for p in r["partitions"]),"/",len(r["partitions"]))
          print("CONCENTRATION_GATES=",sum(p["bridge"]["concentration_gate"]=="PASS" for p in r["partitions"]),"/",len(r["partitions"]))
          print("UNIQUE_SYMBOLS_UNION=",r["unique_symbols_union_count"])
          print("UNIQUE_PARTICIPANTS_UNION=",r["unique_participant_keys_union_count"])
          PY
      - name: Upload anonymized audit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase371-finra-t1-ats-monthly-coverage-audit
          path: phase371_finra_t1_ats_monthly_coverage_audit/
          if-no-files-found: error
          retention-days: 90
