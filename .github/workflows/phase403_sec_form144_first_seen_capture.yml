name: Phase 403 - SEC Form 144 prospective first-seen capture

on:
  push:
    branches: [phase403-sec-form144-prospective-first-seen-capture]
    paths:
      - ".github/workflows/phase403_sec_form144_first_seen_capture.yml"
  pull_request:
    paths:
      - ".github/workflows/phase403_sec_form144_first_seen_capture.yml"
      - "research/phase403_sec_form144_first_seen_capture.py"
      - "research/phase509_form144_structured_detail_parser.py"
      - "research/test_phase509_form144_structured_detail_parser.py"
      - "research/phase516_form144_ledger_quality_audit.py"
      - "research/test_phase516_form144_ledger_quality_audit.py"
      - "research/PHASE516_SEC_FORM144_LEDGER_QUALITY_AND_EVENT_SEMANTICS_AUDIT_2026-11-20.md"
      - "research/PHASE516_SEC_FORM144_LEDGER_QUALITY_AND_EVENT_SEMANTICS_SUMMARY_2026-11-20.json"
      - "research/test_phase403_sec_form144_first_seen_capture.py"
      - "research/PHASE403_SEC_FORM144_PROSPECTIVE_FIRST_SEEN_CAPTURE_2026-11-14.md"
      - "research/PHASE401_FORM144_CANDIDATE_CIK_MANIFEST_2026-11-14.json"
      - "research/phase454_form144_event_ledger_schema_migration.py"
      - "research/test_phase454_form144_event_ledger_schema_migration.py"
      - "research/PHASE454_FORM144_EVENT_LEDGER_SCHEMA_MIGRATION_2026-11-17.md"
      - "research/PHASE454_FORM144_EVENT_LEDGER_SCHEMA_MIGRATION_SUMMARY_2026-11-17.json"
      - "research/PHASE464_SEC_FORM144_FIRST_PRODUCTION_CAPTURE_AUDIT_2026-11-17.md"
      - "research/PHASE464_SEC_FORM144_FIRST_PRODUCTION_CAPTURE_SUMMARY_2026-11-17.json"
      - "research/phase464_form144_first_production_capture_audit.py"
      - "research/test_phase464_form144_first_production_capture_audit.py"
      - "research/test_phase465_sec_atom_pagination.py"
      - "research/PHASE465_SEC_FORM144_ATOM_PAGINATION_AND_CFTC_DELIVERY_AUDIT_2026-11-17.md"
      - "research/PHASE465_SEC_FORM144_ATOM_PAGINATION_AND_CFTC_DELIVERY_SUMMARY_2026-11-17.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-17_PHASE465.md"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-17_PHASE464.md"
      - "research/phase549_form144_10b5_plan_polarity_audit.py"
      - "research/test_phase549_form144_10b5_plan_polarity_audit.py"
      - "research/test_phase565_form144_post_capture_10b5_audit.py"
      - "research/phase665_form144_accession_pit_plan_date_join.py"
      - "research/test_phase665_form144_accession_pit_plan_date_join.py"
      - "research/phase525_form144_form4_crosswalk.py"
      - "research/test_phase525_form144_form4_crosswalk.py"
      - "research/PHASE665_FORM144_ACCESSION_LEVEL_PIT_PLAN_DATE_JOIN_2026-11-27.md"
      - "research/PHASE665_FORM144_ACCESSION_LEVEL_PIT_PLAN_DATE_JOIN_2026-11-27.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-27_PHASE665.md"
  workflow_dispatch:
  schedule:
    - cron: "47 * * * *"

permissions:
  contents: write

concurrency:
  group: sec-form144-prospective-first-seen
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline regressions
        run: |
          python -m py_compile research/phase401_form144a_full_parent_identity_census.py research/phase403_sec_form144_first_seen_capture.py research/phase454_form144_event_ledger_schema_migration.py research/test_phase454_form144_event_ledger_schema_migration.py research/phase464_form144_first_production_capture_audit.py research/test_phase464_form144_first_production_capture_audit.py research/test_phase465_sec_atom_pagination.py research/phase509_form144_structured_detail_parser.py research/test_phase509_form144_structured_detail_parser.py research/phase516_form144_ledger_quality_audit.py research/test_phase516_form144_ledger_quality_audit.py research/phase549_form144_10b5_plan_polarity_audit.py research/test_phase549_form144_10b5_plan_polarity_audit.py research/test_phase565_form144_post_capture_10b5_audit.py research/phase665_form144_accession_pit_plan_date_join.py research/test_phase665_form144_accession_pit_plan_date_join.py research/phase525_form144_form4_crosswalk.py research/test_phase525_form144_form4_crosswalk.py
          python -m unittest -v research.test_phase403_sec_form144_first_seen_capture research.test_phase454_form144_event_ledger_schema_migration research.test_phase464_form144_first_production_capture_audit research.test_phase465_sec_atom_pagination research.test_phase509_form144_structured_detail_parser research.test_phase516_form144_ledger_quality_audit research.test_phase549_form144_10b5_plan_polarity_audit research.test_phase565_form144_post_capture_10b5_audit research.test_phase665_form144_accession_pit_plan_date_join research.test_phase525_form144_form4_crosswalk
          python -m research.phase516_form144_ledger_quality_audit --input research/data/sec_form144_first_seen/sale_details.csv --output phase516_output/summary.json
          python -m research.phase516_form144_ledger_quality_audit --input research/data/sec_form144_first_seen/sale_details.csv --output phase403_output/phase516_post_capture_summary.json
          python -c "import json; from pathlib import Path; p=Path('phase403_output/phase516_post_capture_summary.json'); d=json.loads(p.read_text()); assert d['filing_count'] > 0 and d['row_count'] >= d['filing_count']; assert 'pit' in d and 'signal_eligible_filing_headers' in d['pit']; print('Phase 550 output-path/schema smoke test passed')"
          python -m research.phase549_form144_10b5_plan_polarity_audit --pit-summary phase403_output/phase516_post_capture_summary.json --output phase560_output/summary.json
          python -m research.phase665_form144_accession_pit_plan_date_join --output phase665_output/summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("phase665_output/summary.json").read_text())
          counts = summary["counts"]
          files = summary["source_files"]
          detail_unique = files["sale_details"]["unique_accessions"]
          event_unique = files["events"]["unique_accessions"]
          assert summary["phase"] == 665
          assert counts["structured_detail_accessions"] == detail_unique
          assert files["sale_details"]["rows"] >= detail_unique
          assert files["events"]["rows"] >= event_unique
          assert detail_unique <= event_unique
          assert counts["event_accessions_without_structured_details"] == event_unique - detail_unique
          assert counts["structured_detail_accessions_without_event"] == 0
          assert counts["research_observation_eligible_accessions"] + counts["initial_baseline_no_lower_bound_accessions"] <= detail_unique
          assert counts["formal_plan_date_accessions"] <= detail_unique
          assert counts["formal_plan_date_and_research_observation_eligible_accessions"] <= counts["research_observation_eligible_accessions"]
          assert counts["formal_plan_date_and_initial_baseline_accessions"] <= counts["initial_baseline_no_lower_bound_accessions"]
          assert summary["integrity"]["crossledger_pit_mismatches"] == 0
          assert summary["integrity"]["all_structured_detail_accessions_present_in_event_ledger"] is True
          assert summary["controls"]["signal_admitted"] is False
          print("Phase 665 dynamic actual-ledger reconciliation passed")
          PY

      - name: Upload reproducible Phase 665 accession-level join
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: phase665-form144-accession-pit-join
          path: phase665_output/summary.json
          retention-days: 90
          if-no-files-found: warn
      - name: Upload Phase 560 descriptive 10b5-1 refresh
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase560-form144-10b5-current-refresh
          path: phase560_output/summary.json
          retention-days: 90
          if-no-files-found: warn

  live-capture:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile capture and migration clients
        run: python -m py_compile research/phase403_sec_form144_first_seen_capture.py research/phase454_form144_event_ledger_schema_migration.py research/phase509_form144_structured_detail_parser.py research/phase516_form144_ledger_quality_audit.py research/phase549_form144_10b5_plan_polarity_audit.py research/phase665_form144_accession_pit_plan_date_join.py research/test_phase665_form144_accession_pit_plan_date_join.py
      - name: Migrate append-only event ledger schema
        run: python -m research.phase454_form144_event_ledger_schema_migration --path research/data/sec_form144_first_seen/events.csv --output phase403_output/schema_migration.json
      - name: Run SEC Latest Filings capture
        id: sec_capture
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$EVENT_NAME" in
            push) MODE=bootstrap ;;
            schedule) MODE=schedule ;;
            workflow_dispatch) MODE=manual ;;
            *) echo "Unsupported event: $EVENT_NAME"; exit 1 ;;
          esac
          python -u -m research.phase403_sec_form144_first_seen_capture --mode "$MODE" --run-id "$RUN_ID" --output phase403_output
      - name: Run post-capture Form 144 ledger quality audit
        id: post_capture_quality
        continue-on-error: true
        run: |
          python -m research.phase516_form144_ledger_quality_audit \
            --input research/data/sec_form144_first_seen/sale_details.csv \
            --output phase403_output/phase516_post_capture_summary.json
          python -c "import json; from pathlib import Path; p=Path('phase403_output'); poll=json.loads((p/'summary.json').read_text()); quality=json.loads((p/'phase516_post_capture_summary.json').read_text()); ledger=poll['structured_detail_summary']; assert quality['filing_count'] == ledger['ledger_accession_count'], (quality['filing_count'], ledger['ledger_accession_count']); assert quality['row_count'] == ledger['ledger_row_count'], (quality['row_count'], ledger['ledger_row_count']); print('Phase 550 post-capture ledger-count reconciliation passed')"
      - name: Run post-capture Form 144 10b5-1 audit
        id: post_capture_10b5
        if: steps.post_capture_quality.outcome == 'success'
        run: |
          python -m research.phase549_form144_10b5_plan_polarity_audit --pit-summary phase403_output/phase516_post_capture_summary.json --output phase403_output/phase549_post_capture_summary.json
          python -c "import json; from pathlib import Path; p=Path('phase403_output'); d=json.loads((p/'phase549_post_capture_summary.json').read_text()); q=json.loads((p/'phase516_post_capture_summary.json').read_text()); f=d['form144']; pit=d['pit_eligibility_context']; assert f['accessions'] == q['filing_count']; assert f['detail_rows'] == q['row_count']; assert pit['filing_count'] == q['filing_count']; assert pit['formal_plan_date_overlap_status'] == 'NOT_COMPUTED_NO_ACCESSION_LEVEL_PIT_JOIN'; assert d['controls']['signal_admitted'] is False; print('Phase 565 post-capture 10b5-1 and PIT-scope reconciliation passed')"
      - name: Upload post-capture Form 144 10b5-1 audit
        if: always() && steps.post_capture_10b5.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: phase565-form144-10b5-post-capture
          path: phase403_output/phase549_post_capture_summary.json
          retention-days: 90
          if-no-files-found: error
      - name: Run post-capture Phase 665 accession-level PIT and plan-date join
        id: post_capture_pit_join
        if: steps.post_capture_quality.outcome == 'success'
        continue-on-error: true
        run: |
          python -m research.phase665_form144_accession_pit_plan_date_join --output phase403_output/phase665_post_capture_summary.json
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("phase403_output")
          poll = json.loads((root / "summary.json").read_text(encoding="utf-8"))
          pit = json.loads((root / "phase665_post_capture_summary.json").read_text(encoding="utf-8"))
          ledger = poll["structured_detail_summary"]
          assert pit["source_files"]["sale_details"]["rows"] == ledger["ledger_row_count"]
          assert pit["source_files"]["sale_details"]["unique_accessions"] == ledger["ledger_accession_count"]
          assert pit["counts"]["structured_detail_accessions_without_event"] == 0
          assert pit["integrity"]["crossledger_pit_mismatches"] == 0
          assert pit["controls"]["signal_admitted"] is False
          print("Post-capture Phase 665 accession-level PIT join passed.")
          print(json.dumps(pit["counts"], sort_keys=True))
          PY
      - name: Refresh post-capture Form 144 / Form 4 descriptive crosswalk
        id: post_capture_crosswalk
        if: steps.post_capture_quality.outcome == 'success'
        continue-on-error: true
        run: |
          python -u -m research.phase525_form144_form4_crosswalk --output phase403_output/phase525_post_capture
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("phase403_output/phase525_post_capture/crosswalk_summary.json").read_text(encoding="utf-8"))
          assert summary["disposition"] == "DESCRIPTIVE_CROSSWALK_ONLY_NO_SIGNAL"
          assert summary["signal_eligible_matches"] == 0
          assert summary["historical_f80_membership_verified"] is False
          assert summary["execution_intraday_time_known"] is False
          assert summary["alpha_test_authorized"] is False
          print("Post-capture Form 144 / Form 4 crosswalk refreshed; no signal admitted.")
          print(json.dumps(summary["acceptance_clock_audit"], sort_keys=True))
          PY
      - name: Commit append-only first-seen ledger and poll state
        # Persist a successful capture even if a downstream descriptive audit fails.
        if: always() && (github.event_name == 'push' || github.event_name == 'schedule') && steps.sec_capture.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/sec_form144_first_seen
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] SEC Form 144 first-seen capture ${GITHUB_RUN_ID}"
            git push
          else
            echo "No persistent first-seen changes."
          fi
      - name: Upload poll audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase403-sec-form144-first-seen
          path: phase403_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail after persistence if post-capture quality or 10b5 audit failed
        if: always() && (steps.post_capture_quality.outcome == 'failure' || steps.post_capture_10b5.outcome == 'failure' || steps.post_capture_pit_join.outcome == 'failure' || steps.post_capture_crosswalk.outcome == 'failure')
        run: |
          echo "Post-capture Phase 516 or Phase 549 audit failed; capture ledger persistence and artifact upload were attempted first." >&2
          exit 1
