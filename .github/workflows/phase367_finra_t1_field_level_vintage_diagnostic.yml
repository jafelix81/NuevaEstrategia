name: Phase 367 - FINRA T1 field-level vintage diagnostic

on:
  push:
    branches:
      - phase367-finra-t1-field-level-vintage-diagnostic
    paths:
      - "research/phase367_finra_t1_field_level_vintage_diagnostic.py"
      - "research/test_phase367_finra_t1_field_level_vintage_diagnostic.py"
      - ".github/workflows/phase367_finra_t1_field_level_vintage_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase367-finra-t1-field-level-vintage-diagnostic
  cancel-in-progress: false

jobs:
  field-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile diagnostic and tests
        run: python -m py_compile research/phase367_finra_t1_field_level_vintage_diagnostic.py research/test_phase367_finra_t1_field_level_vintage_diagnostic.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase367_finra_t1_field_level_vintage_diagnostic
      - name: Retrieve and compare T1 rows
        run: python -m research.phase367_finra_t1_field_level_vintage_diagnostic --output phase367_finra_t1_field_level_vintage_diagnostic
      - name: Enforce anonymized research-only controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase367_finra_t1_field_level_vintage_diagnostic/summary.json", encoding="utf-8"))
          if not result.get("all_partitions_complete") or result.get("errors"):
              sys.exit("Phase 367 did not retrieve both T1 partitions completely")
          if result.get("raw_rows_retained") or result.get("raw_keys_retained") or result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          comparison = result["comparison"]
          print("PHASE367_RETRIEVAL=PASS")
          print("MISMATCHED_ROW_PAIRS=" + str(comparison["mismatched_row_pairs"]))
          print("FIELD_MISMATCH_COUNTS=" + str(comparison["field_mismatch_counts"]))
          print("ONLY_NOTIONAL_ROWS=" + str(comparison["rows_differing_only_in_totalNotionalSum"]))
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized field-diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase367-finra-t1-field-level-vintage-diagnostic
          path: phase367_finra_t1_field_level_vintage_diagnostic/
          if-no-files-found: warn
          retention-days: 90
