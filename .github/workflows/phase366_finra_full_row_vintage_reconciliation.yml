name: Phase 366 - FINRA full-row vintage reconciliation

on:
  push:
    branches:
      - phase366-finra-full-row-vintage-reconciliation
    paths:
      - "research/phase366_finra_full_row_vintage_reconciliation.py"
      - "research/test_phase366_finra_full_row_vintage_reconciliation.py"
      - ".github/workflows/phase366_finra_full_row_vintage_reconciliation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase366-finra-full-row-vintage-reconciliation
  cancel-in-progress: false

jobs:
  full-row-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FINRA_API_TOKEN: ${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile audit and tests
        run: python -m py_compile research/phase366_finra_full_row_vintage_reconciliation.py research/test_phase366_finra_full_row_vintage_reconciliation.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase366_finra_full_row_vintage_reconciliation
      - name: Retrieve and compare full historical partitions
        run: python -m research.phase366_finra_full_row_vintage_reconciliation --output phase366_finra_full_row_vintage_reconciliation
      - name: Enforce retrieval-only research controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase366_finra_full_row_vintage_reconciliation/summary.json", encoding="utf-8"))
          if not result.get("all_partitions_complete") or not result.get("all_page_counts_match"):
              sys.exit("Phase 366 did not retrieve every targeted partition completely")
          if result.get("raw_rows_retained") or result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          print("PHASE366_RETRIEVAL=PASS")
          print("PARTITIONS=" + str(result["partitions_completed"]))
          print("VINTAGE_ROW_MATCH=" + str(result["all_vintages_exact_row_match"]))
          print("DISPOSITION=" + result["research_disposition"])
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized comparison artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase366-finra-full-row-vintage-reconciliation
          path: phase366_finra_full_row_vintage_reconciliation/
          if-no-files-found: warn
          retention-days: 90
