name: Fase 27N2 - SEC N-PORT PIT institutional flow pilot balance fix
on:
  push:
    branches: [phase27n-fix-balance-unit]
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: pip install --disable-pip-version-check --no-input yfinance
      - name: Run Phase 27N2
        run: python -u Nueva_Estrategia_Fase27N2_SEC_NPORT_PIT_FlowPilot_BalanceFix.py
      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: phase27n2-nport-pit-flow-pilot
          path: nueva_estrategia_phase27n2_nport_pit_flow/
          if-no-files-found: error
