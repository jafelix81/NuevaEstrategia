name: Fase 12 - Final OOS + Predefined Selection LTM

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase12:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 12
        run: |
          python -u Nueva_Estrategia_Fase12_FinalOOS_Selection_LTM.py

      - name: Upload Phase 12 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase12-final-oos-selection-ltm-results
          path: nueva_estrategia_phase12_final_oos_ltm/**
          if-no-files-found: warn
          retention-days: 30
