name: Phase 368 - FINRA revision lag and PIT availability audit

on:
  push:
    branches:
      - phase368-finra-revision-lag-pit-availability-audit
    paths:
      - "research/phase368_finra_revision_lag_pit_audit.py"
      - "research/test_phase368_finra_revision_lag_pit_audit.py"
      - ".github/workflows/phase368_finra_revision_lag_pit_availability_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase368-finra-revision-lag-pit-availability-audit
  cancel-in-progress: false

jobs:
  revision-lag-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      FINRA_API_TOKEN: \${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile audit and tests
        run: python -m py_compile research/phase368_finra_revision_lag_pit_audit.py research/test_phase368_finra_revision_lag_pit_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase368_finra_revision_lag_pit_audit
      - name: Retrieve full FINRA partitions and measure date-field gaps
        run: python -m research.phase368_finra_revision_lag_pit_audit --output phase368_finra_revision_lag_pit_audit
      - name: Enforce research-only and PIT controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase368_finra_revision_lag_pit_audit/summary.json", encoding="utf-8"))
          if not result.get("all_partitions_complete") or result.get("errors"):
              sys.exit("Phase 368 did not retrieve every preregistered partition")
          if result.get("pit_availability_established") is not False:
              sys.exit("Phase 368 must not claim PIT availability")
          if result.get("revision_vintage_history_reconstructed") is not False:
              sys.exit("Phase 368 must not claim intermediate vintages were reconstructed")
          if result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          if result.get("raw_rows_retained") or result.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers were retained")
          print("PHASE368_RETRIEVAL=PASS")
          print("PIT_AVAILABILITY=NOT_ESTABLISHED")
          print("ALPHA_TEST=NOT_AUTHORIZED")
          for item in result["partitions"]:
              print(f"PARTITION={item['week']}|{item['tier']}|ROWS={item['rows_retrieved']}|PAGES={item['pages_retrieved']}")
          PY
      - name: Upload anonymized date-field audit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase368-finra-revision-lag-pit-audit
          path: phase368_finra_revision_lag_pit_audit/
          if-no-files-found: warn
          retention-days: 90
