name: Fase 27G - SEC N-PORT Series Panel Correction

on:
  push:
    branches: [phase27g-nport-series-panel-correction]
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 27G
        run: python Nueva_Estrategia_Fase27G_SEC_NPORT_SeriesPanel_Correction.py
      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: phase27g-sec-nport-series-panel-correction
          path: nueva_estrategia_phase27g_sec_nport/
          if-no-files-found: error
