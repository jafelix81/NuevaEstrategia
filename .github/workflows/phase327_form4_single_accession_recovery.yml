name: Phase 327 SEC Form 4 single-accession archive recovery

on:
  push:
    branches:
      - phase327-form4-single-accession-recovery
    paths:
      - ".github/workflows/phase327_form4_single_accession_recovery.yml"
      - "research/phase327_form4_single_accession_recovery.py"
      - "research/test_phase327_form4_single_accession_recovery.py"
      - "research/phase326_prior_recovery_manifest_2026-11-12.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase327-form4-single-accession-recovery
  cancel-in-progress: false

jobs:
  single-accession-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_CONTACT_EMAIL: \${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run offline regressions
        run: |
          python -m compileall -q research/phase327_form4_single_accession_recovery.py research/test_phase327_form4_single_accession_recovery.py
          python -m unittest -v research.test_phase327_form4_single_accession_recovery

      - name: Retry only the single quarantined accession through zero-padded SEC paths
        run: |
          python -m research.phase327_form4_single_accession_recovery \
            --prior-manifest research/phase326_prior_recovery_manifest_2026-11-12.json \
            --output-dir phase327_output \
            --email "$SEC_CONTACT_EMAIL"

      - name: Enforce one-record recovery scope and frozen-baseline controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase327_output/phase327_recovery_result.json", encoding="utf-8"))
          s=r["summary"]; c=r["controls"]
          if s["prior_retrieved"] != 282 or s["retried_accessions"] != 1:
              sys.exit("Phase 327 did not preserve the one-record recovery scope")
          if s["final_retrieved"] not in (282, 283):
              sys.exit("Unexpected Phase 327 retrieval population")
          if s["final_unresolved_accessions"] not in ([], ["0000939057-26-000239"]):
              sys.exit("Unexpected unresolved accession set")
          if s["final_header_identity_matches"] != s["final_retrieved"]:
              sys.exit("Retrieved header identity is incomplete")
          if s["final_xml_parsed"] != s["final_retrieved"] or s["final_xml_issuer_cik_matches"] != s["final_retrieved"] or s["final_xml_owner_ciks_matches"] != s["final_retrieved"]:
              sys.exit("Retrieved XML identity is incomplete")
          for key in ("strict_pit_admitted","alpha_test_authorized","return_test_run",
                      "bootstrap_loo_run","chronological_oos_run","holdout_used",
                      "production_changed","universe_changed","capital_changed",
                      "parameters_changed","raw_sec_bytes_uploaded","vendor_contacted",
                      "data_purchased","email_sent"):
              if c.get(key) is not False:
                  sys.exit("Research control unexpectedly opened: "+key)
          if c.get("f80_frozen") is not True or c.get("previously_validated_filings_refetched") is not False:
              sys.exit("F80 or no-refetch control failed")
          print("PHASE327_STATUS="+r["status"])
          print("PHASE327_SUMMARY="+str(s))
          print("PHASE327_CONTROLS="+str(c))
          PY

      - name: Upload recovery diagnostics only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase327-form4-single-accession-recovery
          path: phase327_output/
          retention-days: 90
          if-no-files-found: warn
