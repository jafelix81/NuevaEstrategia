name: Phase 46 - Cboe equity options actual-file audit

on:
  push:
    branches:
      - phase46-cboe-equity-options-actual-file-audit
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase46-cboe-equity-options-actual-file-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check --no-input pandas openpyxl
      - name: Run Cboe actual-file audit
        run: python research/phase46_cboe_equity_options_actual_file_audit.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase46-cboe-equity-options-audit
          path: cboe_equity_options_actual_file_audit.json
          if-no-files-found: warn
          retention-days: 30
