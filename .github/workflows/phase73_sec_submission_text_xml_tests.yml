name: Phase 73 - SEC complete-submission XML extractor tests

on:
  push:
    branches:
      - phase73-13dg-submission-text-xml-recovery
    paths:
      - research/phase73_sec_submission_text_xml_tests_trigger.txt

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser test dependencies
        run: python -m pip install pandas requests
      - name: Run Phase 72 parser regression tests
        run: python -m unittest research.test_phase72_13dg_structured_xml_parser -v
      - name: Run Phase 72 corpus helper regression tests
        run: python -m unittest research.test_phase72_13dg_structured_xml_corpus_audit -v
      - name: Run Phase 73 SEC submission-text extractor tests
        run: python -m unittest research.test_phase73_sec_submission_text_extractor -v
