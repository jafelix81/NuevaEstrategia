name: Phase 79 - EFTS query semantics diagnostic

on:
  push:
    branches:
      - phase79-efts-query-semantics-diagnostic
    paths:
      - research/phase79_efts_query_semantics_diagnostic.py
      - research/test_phase79_efts_query_semantics_diagnostic.py
      - research/phase79_efts_query_semantics_trigger.txt
      - .github/workflows/phase79_efts_query_semantics.yml

permissions:
  contents: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  tests_and_guarded_diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run Phase 79 offline tests
        run: python -m unittest research.test_phase79_efts_query_semantics_diagnostic -v
      - name: Compile Phase 79 module
        run: python -m py_compile research/phase79_efts_query_semantics_diagnostic.py
      - name: Run bounded EFTS diagnostic only on explicit trigger commit
        if: contains(github.event.head_commit.message, 'Trigger Phase 79 bounded EFTS query diagnostics')
        run: python -u -m research.phase79_efts_query_semantics_diagnostic --outdir phase79_efts_query_diagnostics --sleep-seconds 0.6
      - name: Upload Phase 79 diagnostic outputs
        if: always() && contains(github.event.head_commit.message, 'Trigger Phase 79 bounded EFTS query diagnostics')
        uses: actions/upload-artifact@v4
        with:
          name: phase79-efts-query-semantics-diagnostic
          path: phase79_efts_query_diagnostics/
          retention-days: 90
