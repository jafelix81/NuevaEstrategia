name: Phase 610 - SEC 13F acceptance timestamp feasibility

on:
  push:
    branches: [phase610-sec-13f-acceptance-timestamp-feasibility]
    paths:
      - "research/phase610_sec_13f_acceptance_timestamp_feasibility.py"
      - "research/test_phase610_sec_13f_acceptance_timestamp_feasibility.py"
      - ".github/workflows/phase610_sec_13f_acceptance_timestamp_feasibility.yml"
  pull_request:
    branches: [phase609-sec-13f-full-quarter-group-audit]
    paths:
      - "research/phase610_sec_13f_acceptance_timestamp_feasibility.py"
      - "research/test_phase610_sec_13f_acceptance_timestamp_feasibility.py"
      - ".github/workflows/phase610_sec_13f_acceptance_timestamp_feasibility.yml"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile and run offline regressions
        run: |
          python -m py_compile research/phase610_sec_13f_acceptance_timestamp_feasibility.py research/test_phase610_sec_13f_acceptance_timestamp_feasibility.py
          python -m unittest -v research.test_phase610_sec_13f_acceptance_timestamp_feasibility

  bounded-live-acceptance-audit:
    if: github.event_name == 'push'
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch six SEC filing detail pages
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: python research/phase610_sec_13f_acceptance_timestamp_feasibility.py
      - name: Upload timestamp feasibility result
        if: always() && hashFiles('phase610_sec_13f_acceptance_timestamp_feasibility.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: phase610-sec-13f-acceptance-timestamp-feasibility
          path: phase610_sec_13f_acceptance_timestamp_feasibility.json
          retention-days: 30
