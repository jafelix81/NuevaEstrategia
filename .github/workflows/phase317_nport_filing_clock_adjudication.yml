name: Phase 317 N-PORT filing clock adjudication

on:
  push:
    branches:
      - phase317-nport-filing-clock-adjudication
    paths:
      - ".github/workflows/phase317_nport_filing_clock_adjudication.yml"
      - "research/phase317_nport_filing_clock_adjudication.py"
      - "research/test_phase317_nport_filing_clock_adjudication.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase317-nport-filing-clock-adjudication
  cancel-in-progress: false

jobs:
  offline-adjudication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Download first immutable Phase 316 sample
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase316-nport-multifiler-stratified-expansion
          repository: jafelix81/NuevaEstrategia
          run-id: 43166221052
          github-token: ${{ github.token }}
          path: phase316_a

      - name: Download independent repeat Phase 316 sample
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase316-nport-multifiler-stratified-expansion
          repository: jafelix81/NuevaEstrategia
          run-id: 43166231154
          github-token: ${{ github.token }}
          path: phase316_b

      - name: Download Phase 310 purposive-control artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase310-nport-raw-filing-vintage-audit
          repository: jafelix81/NuevaEstrategia
          run-id: 43154326395
          github-token: ${{ github.token }}
          path: phase310_input

      - name: Compile and run offline regressions
        run: |
          python -m compileall -q research/phase317_nport_filing_clock_adjudication.py research/test_phase317_nport_filing_clock_adjudication.py
          python -m unittest -v research.test_phase317_nport_filing_clock_adjudication

      - name: Adjudicate filing clock, amendments and repeatability
        run: python research/phase317_nport_filing_clock_adjudication.py --phase316-a phase316_a --phase316-b phase316_b --phase310 phase310_input --output-dir phase317_output

      - name: Upload immutable adjudication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase317-nport-filing-clock-adjudication
          path: phase317_output/
          retention-days: 90
          if-no-files-found: error
