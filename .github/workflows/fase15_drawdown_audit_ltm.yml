name: Fase 15 - Drawdown Audit LTM

on:
  workflow_dispatch:

jobs:
  phase15-drawdown-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 15
        run: python -u Nueva_Estrategia_Fase15_Drawdown_Audit_LTM.py

      - name: Upload Phase 15 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase15-drawdown-audit-ltm
          path: nueva_estrategia_phase15_drawdown_audit_ltm/
          if-no-files-found: warn
