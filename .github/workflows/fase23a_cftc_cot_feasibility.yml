name: Fase 23A - CFTC COT Feasibility

on:
  push:
    branches: [ phase23a-cftc-cot-feasibility ]
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run Phase 23A
        run: python -u Nueva_Estrategia_Fase23A_CFTC_COT_Feasibility.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase23a-cftc-cot-feasibility
          path: nueva_estrategia_phase23a_cftc_cot_feasibility/**
          retention-days: 30
