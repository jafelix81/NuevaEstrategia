name: FASE 20B - FINRA Incremental

on:
  push:
    branches: [phase20b-finra-incremental]
  workflow_dispatch:

env:
  PHASE20B_REVISION: train-derived-incremental

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests yfinance openpyxl
      - name: Run Phase 20B
        run: python -u Nueva_Estrategia_Fase20B_FINRA_Incremental_OOS.py
      - name: Upload Phase 20B artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase20b-finra-incremental
          path: nueva_estrategia_phase20b_finra_incremental/
