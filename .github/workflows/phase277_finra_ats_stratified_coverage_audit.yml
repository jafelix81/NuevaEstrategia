name: Phase 277 FINRA ATS stratified multi-year coverage audit

on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - "research/phase277_finra_ats_stratified_coverage_audit.py"
      - "research/test_phase277_finra_ats_stratified_coverage_audit.py"
      - "research/PHASE277_FINRA_ATS_STRATIFIED_COVERAGE_AUDIT_2026-11-10.md"
      - ".github/workflows/phase277_finra_ats_stratified_coverage_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase277-finra-ats-stratified-coverage
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install requests dependency
        run: python -m pip install requests
      - name: Compile Phase 277 and dependency
        run: python -m py_compile research/phase100_finra_ats_revalidation.py research/phase277_finra_ats_stratified_coverage_audit.py research/test_phase277_finra_ats_stratified_coverage_audit.py
      - name: Run offline Phase 277 regression tests
        run: python -m unittest -v research.test_phase277_finra_ats_stratified_coverage_audit
      - name: Fetch and audit eight new historical weeks
        run: python -u -m research.phase277_finra_ats_stratified_coverage_audit
      - name: Upload metadata-only audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase277-finra-ats-stratified-coverage
          path: phase277_finra_ats_stratified_coverage_audit/
          retention-days: 90
          if-no-files-found: error
      - name: Enforce complete retrieval and no-alpha controls
        run: |
          python - <<'PY'
          import json, sys
          p='phase277_finra_ats_stratified_coverage_audit/summary.json'
          r=json.load(open(p, encoding='utf-8'))
          print('PHASE277_STATUS='+str(r.get('status')))
          gates=r.get('gates', {})
          required=('all_16_partitions_present','all_api_record_totals_reconciled','all_page_hashes_valid')
          if not all(gates.get(k) is True for k in required):
              sys.exit(1)
          if r.get('economic_interpretation', {}).get('alpha_test_authorized') is not False:
              sys.exit(2)
          if r.get('pit', {}).get('strict_pit_admitted') is not False:
              sys.exit(3)
          if r.get('controls', {}).get('f80_frozen') is not True:
              sys.exit(4)
          PY
