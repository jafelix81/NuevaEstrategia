name: Fase 21A - SEC Form 4 Feasibility

on:
  push:
    branches:
      - phase21-smartmoney-feasibility
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase21a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy requests yfinance openpyxl

      - name: Run Phase 21A
        run: |
          python -u Nueva_Estrategia_Fase21A_SEC_Form4_Feasibility.py

      - name: Upload Phase 21A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase21a-sec-form4-feasibility
          path: nueva_estrategia_phase21a_sec_form4_feasibility/**
          if-no-files-found: warn
          retention-days: 30
