name: Phase 379 - CFTC archive Updated-date PIT feasibility audit

on:
  push:
    branches:
      - phase379-cftc-archive-updated-date-pit-audit
    paths:
      - "research/phase379_cftc_archive_updated_date_pit_audit.py"
      - "research/test_phase379_cftc_archive_updated_date_pit_audit.py"
      - ".github/workflows/phase379_cftc_archive_updated_date_pit_audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase379-cftc-archive-updated-date-pit-audit
  cancel-in-progress: false

jobs:
  archive-date-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase379_cftc_archive_updated_date_pit_audit.py research/test_phase379_cftc_archive_updated_date_pit_audit.py
          python -m unittest -v research.test_phase379_cftc_archive_updated_date_pit_audit
      - name: Retrieve official CFTC archive date samples
        run: python -u -m research.phase379_cftc_archive_updated_date_pit_audit --output phase379_cftc_archive_updated_date_pit_audit
      - name: Enforce research-only timestamp controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase379_cftc_archive_updated_date_pit_audit/summary.json",encoding="utf-8"))
          if not r.get("all_official_schedule_samples_not_earlier_gate"):
              sys.exit("CFTC archive Updated date precedes an official release or a required sample is missing")
          if not r.get("all_successful_headings_match"):
              sys.exit("CFTC archive heading or Updated date chronology failed")
          if r.get("archive_updated_field_formally_defined_as_first_publication") or r.get("strict_historical_pit_authorized"):
              sys.exit("Archive Updated date was incorrectly promoted to a certified PIT timestamp")
          if r.get("raw_html_retained") or r.get("raw_positions_retained") or r.get("alpha_test_authorized") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Research-only control violated")
          print("PHASE379_CFTC_ARCHIVE_UPDATED_DATE_AUDIT=PASS")
          print("OFFICIAL_SCHEDULE_NOT_EARLIER=",r["official_schedule_not_earlier_matches"],"/",r["official_schedule_sample_count"])
          print("OFFICIAL_SCHEDULE_EXACT_MATCHES=",r["official_schedule_exact_matches"],"/",r["official_schedule_sample_count"])
          print("LATER_ARCHIVE_UPDATES=",r["official_schedule_later_count"])
          print("ARCHIVE_ONLY_RETRIEVED=",r["archive_only_retrieved"],"/",r["archive_only_sample_count"])
          print("STRICT_PIT=NOT_AUTHORIZED")
          PY
      - name: Upload date-only summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase379-cftc-archive-updated-date-pit-audit
          path: phase379_cftc_archive_updated_date_pit_audit/
          if-no-files-found: warn
          retention-days: 90
