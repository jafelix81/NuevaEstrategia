name: Fase 22 - SEC 13F Feasibility

on:
  push:
    branches:
      - phase22-sec-13f-feasibility
  workflow_dispatch:

jobs:
  phase22:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Run Phase 22
        run: python -u Nueva_Estrategia_Fase22_SEC_13F_Feasibility.py
      - name: Upload Phase 22 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase22-sec-13f-feasibility
          path: nueva_estrategia_phase22_sec_13f_feasibility/**
          retention-days: 30
