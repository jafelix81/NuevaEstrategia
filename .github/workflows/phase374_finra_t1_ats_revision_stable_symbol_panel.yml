name: Phase 374 - FINRA T1 ATS revision-stable symbol panel

on:
  push:
    branches:
      - phase374-finra-t1-ats-revision-stable-symbol-panel
    paths:
      - "research/phase374_finra_t1_ats_revision_stable_symbol_panel.py"
      - "research/test_phase374_finra_t1_ats_revision_stable_symbol_panel.py"
      - ".github/workflows/phase374_finra_t1_ats_revision_stable_symbol_panel.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase374-finra-t1-ats-revision-stable-symbol-panel
  cancel-in-progress: false

jobs:
  revision-stable-panel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FINRA_API_TOKEN: \${{ secrets.FINRA_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase371_finra_t1_ats_monthly_coverage_audit.py research/phase374_finra_t1_ats_revision_stable_symbol_panel.py research/test_phase374_finra_t1_ats_revision_stable_symbol_panel.py
          python -m unittest -v research.test_phase374_finra_t1_ats_revision_stable_symbol_panel
      - name: Retrieve 47 full monthly T1 partitions and calculate revision-stable symbol panel
        run: python -u -m research.phase374_finra_t1_ats_revision_stable_symbol_panel --output phase374_finra_t1_ats_revision_stable_symbol_panel
      - name: Enforce research-only and no-lookahead controls
        run: |
          python - <<'PY'
          import json, sys
          r=json.load(open("phase374_finra_t1_ats_revision_stable_symbol_panel/summary.json",encoding="utf-8"))
          if not r.get("all_partitions_complete") or r.get("errors"):
              sys.exit("Phase 374 did not retrieve every monthly T1 partition")
          if r.get("pit_availability_established") is not False or r.get("historical_signal_test_authorized"):
              sys.exit("Phase 374 cannot claim exact PIT or authorize returns")
          if r.get("forward_returns_used") or r.get("holdout_used") or r.get("f80_changed") or r.get("production_changed"):
              sys.exit("Research-only controls violated")
          if r.get("raw_rows_retained") or r.get("raw_identifiers_retained"):
              sys.exit("Raw rows or identifiers retained")
          print("PHASE374_RETRIEVAL=PASS")
          print("MONTHS=",r["expected_months"])
          print("ROWS=",r["total_rows"],"PAGES=",r["total_pages"])
          print("REVISION_STABLE_SYMBOLS=",r["revision_stable_symbol_groups"])
          print("REVISED_SYMBOL_GROUPS=",r["revised_symbol_groups"])
          print("STABLE_CONCENTRATION_SYMBOLS=",r["revision_stable_concentration_symbols"])
          print("PIT_AVAILABILITY=NOT_ESTABLISHED")
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized summary only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase374-finra-t1-ats-revision-stable-symbol-panel
          path: phase374_finra_t1_ats_revision_stable_symbol_panel/
          if-no-files-found: warn
          retention-days: 90
