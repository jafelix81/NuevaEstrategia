name: Fase 22C v2 - SEC 13F Fuzzy Mapping Audit

on:
  push:
    branches: [main, phase22c-sec13f-mapping-audit-fix]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas requests
      - name: Run Phase 22C v3
        run: python -u Nueva_Estrategia_Fase22C_SEC_13F_Fuzzy_Mapping_Audit_v2.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase22c-sec-13f-mapping-audit-v3
          path: nueva_estrategia_phase22c_sec_13f_fuzzy_mapping_audit/
