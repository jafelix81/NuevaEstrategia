name: Phase 340 Form 4 transaction-date anchor PIT audit
on:
  push:
    branches:
      - phase340-form4-transaction-date-anchor-pit-audit
    paths:
      - "research/phase340_form4_transaction_date_anchor_pit_audit.py"
      - "research/test_phase340_form4_transaction_date_anchor_pit_audit.py"
permissions:
  actions: read
  contents: read
concurrency:
  group: phase340-form4-transaction-date-anchor-pit-audit
  cancel-in-progress: false
jobs:
  transaction-date-anchor-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile and run offline regressions
        run: |
          python -m py_compile research/phase340_form4_transaction_date_anchor_pit_audit.py research/test_phase340_form4_transaction_date_anchor_pit_audit.py
          python -m unittest -v research.test_phase340_form4_transaction_date_anchor_pit_audit
      - name: Download and verify immutable Phase 338 and 339 artifacts
        run: |
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 180 -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/jafelix81/NuevaEstrategia/actions/artifacts/13953101909/zip" -o phase338_source.zip
          echo "30b6a5b6753b24e8bd5d810d4193396249ed3f64de259e2fb8ef9513e29ecf92  phase338_source.zip" | sha256sum --check
          mkdir -p phase338_source
          unzip -q phase338_source.zip -d phase338_source
          echo "0bcd8f355bd697d804296caeffd67fd69ff6aa593b8a5643535ad2f0224027a8  phase338_source/phase338_broad_identity_audit.json" | sha256sum --check
          echo "9cca7f3eb027776dff89a4b44a0b234386ead708d758051a2b5e604f6d43736a  phase338_source/phase338_sample_manifest.json" | sha256sum --check
          curl --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 180 -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/jafelix81/NuevaEstrategia/actions/artifacts/13959007527/zip" -o phase339_source.zip
          echo "186bd582c8cd0ffff73cda16c7331e5a2bd34e413b6aba3715b5fac430a0a66f  phase339_source.zip" | sha256sum --check
          mkdir -p phase339_source
          unzip -q phase339_source.zip -d phase339_source
          echo "4560b26f6cb37db8a3cf499207643026aab7e4e309ef8c7cf496b9e02d2d9e15  phase339_source/phase339_security_exchange_audit.json" | sha256sum --check
      - name: Retrieve 72 original Form 4 submissions and test transaction-date anchor chronology
        run: |
          python -m research.phase340_form4_transaction_date_anchor_pit_audit --audit-json phase338_source/phase338_broad_identity_audit.json --manifest phase338_source/phase338_sample_manifest.json --phase339-json phase339_source/phase339_security_exchange_audit.json --output-dir phase340_output
      - name: Enforce complete accession accounting and frozen controls
        run: |
          python - <<'PY'
          import json
          r=json.load(open("phase340_output/phase340_transaction_date_anchor_audit.json",encoding="utf-8"))
          assert r["phase"]==340
          assert len(r["accessions"])==72
          assert len({x["accession"] for x in r["accessions"]})==72
          assert r["summary"]["sample_accessions_expected"]==72
          assert r["summary"]["accessions_retrieved"]+r["summary"]["accession_retrieval_failures"]==72
          assert len(r["transactions"])==r["summary"]["transaction_rows"]
          c=r["controls"]
          for k in ("strict_pit_admitted","transaction_level_security_mapping_admitted","event_study_admitted","alpha_test_run","return_test_run","bootstrap_loo_run","chronological_oos_run","holdout_used","production_changed","universe_changed","capital_changed","parameters_changed","data_purchased","vendor_contacted"):
              assert c[k] is False
          assert c["f80_frozen"] is True
          print("PHASE340_STATUS="+r["status"])
          print("PHASE340_SUMMARY="+json.dumps(r["summary"],sort_keys=True))
          print("PHASE340_COVERAGE="+json.dumps(r["coverage"],sort_keys=True))
          PY
      - name: Upload Phase 340 evidence and raw public submissions
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase340-form4-transaction-date-anchor-pit-audit
          path: phase340_output/
          retention-days: 90
          if-no-files-found: warn

# Workflow registration refresh; SEC retrieval remains gated to the dedicated Phase 340 branch.
