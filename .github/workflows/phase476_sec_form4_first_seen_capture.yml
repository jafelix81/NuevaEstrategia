name: Phase 476 - SEC Form 4 first-seen prospective metadata capture
# Phase 525 adds schedule-only filing-level owner enrichment and a non-signal crosswalk.

on:
  push:
    branches: [phase476-sec-form4-first-seen-capture, phase477-sec-form4-feed-timestamp-consistency-gate]
    paths:
      - ".github/workflows/phase476_sec_form4_first_seen_capture.yml"
      - "research/phase476_sec_form4_first_seen_capture.py"
      - "research/test_phase476_sec_form4_first_seen_capture.py"
      - "research/phase510_form4_structured_transaction_ledger.py"
      - "research/test_phase510_form4_structured_transaction_ledger.py"
      - "research/phase525_form4_reporting_owner_identity.py"
      - "research/test_phase525_form4_reporting_owner_identity.py"
      - "research/phase525_form144_form4_crosswalk.py"
      - "research/test_phase525_form144_form4_crosswalk.py"
      - "research/PHASE623_FORM4_TRANSACTION_FOOTNOTE_REFERENCE_INTEGRITY_AUDIT_2026-11-25.md"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-25_PHASE623.md"
      - "research/PHASE525_SEC_FORM144_FORM4_MATCHED_EVENT_AND_OWNER_IDENTITY_AUDIT_2026-11-20.md"
      - "research/PHASE525_SEC_FORM144_FORM4_MATCHED_EVENT_AND_OWNER_IDENTITY_SUMMARY_2026-11-20.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-20_PHASE525.md"
      - "research/PHASE476_SEC_FORM4_FIRST_SEEN_PROSPECTIVE_CAPTURE_AUDIT_2026-11-18.md"
      - "research/PHASE476_SEC_FORM4_FIRST_SEEN_PROSPECTIVE_CAPTURE_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE476.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_2026-11-18.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE477.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_2026-11-18.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE477.md"
  pull_request:
    paths:
      - ".github/workflows/phase476_sec_form4_first_seen_capture.yml"
      - "research/phase476_sec_form4_first_seen_capture.py"
      - "research/test_phase476_sec_form4_first_seen_capture.py"
      - "research/phase510_form4_structured_transaction_ledger.py"
      - "research/test_phase510_form4_structured_transaction_ledger.py"
      - "research/phase525_form4_reporting_owner_identity.py"
      - "research/test_phase525_form4_reporting_owner_identity.py"
      - "research/phase525_form144_form4_crosswalk.py"
      - "research/test_phase525_form144_form4_crosswalk.py"
      - "research/PHASE623_FORM4_TRANSACTION_FOOTNOTE_REFERENCE_INTEGRITY_AUDIT_2026-11-25.md"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-25_PHASE623.md"
      - "research/PHASE525_SEC_FORM144_FORM4_MATCHED_EVENT_AND_OWNER_IDENTITY_AUDIT_2026-11-20.md"
      - "research/PHASE525_SEC_FORM144_FORM4_MATCHED_EVENT_AND_OWNER_IDENTITY_SUMMARY_2026-11-20.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-20_PHASE525.md"
      - "research/PHASE476_SEC_FORM4_FIRST_SEEN_PROSPECTIVE_CAPTURE_AUDIT_2026-11-18.md"
      - "research/PHASE476_SEC_FORM4_FIRST_SEEN_PROSPECTIVE_CAPTURE_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE476.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_2026-11-18.md"
      - "research/PHASE477_SEC_FORM4_FEED_TIMESTAMP_CONSISTENCY_GATE_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE477.md"
      - "research/PHASE478_SEC_FORM4_FAIL_CLOSED_RETRY_INTEGRITY_2026-11-18.md"
      - "research/PHASE478_SEC_FORM4_FAIL_CLOSED_RETRY_INTEGRITY_SUMMARY_2026-11-18.json"
      - "research/SMART_MONEY_RESEARCH_STATE_ADDENDUM_2026-11-18_PHASE478.md"
  workflow_dispatch:
  schedule:
    - cron: "17 * * * 1-5"

permissions:
  contents: write

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline regressions
        run: |
          python -m py_compile research/phase476_sec_form4_first_seen_capture.py research/test_phase476_sec_form4_first_seen_capture.py research/phase510_form4_structured_transaction_ledger.py research/test_phase510_form4_structured_transaction_ledger.py research/phase525_form4_reporting_owner_identity.py research/test_phase525_form4_reporting_owner_identity.py research/phase525_form144_form4_crosswalk.py research/test_phase525_form144_form4_crosswalk.py
          python -m unittest -v research.test_phase476_sec_form4_first_seen_capture research.test_phase510_form4_structured_transaction_ledger research.test_phase525_form4_reporting_owner_identity research.test_phase525_form144_form4_crosswalk
  live-capture:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: offline-regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile capture client
        run: python -m py_compile research/phase476_sec_form4_first_seen_capture.py
      - name: Capture Form 4 / 4-A first-seen metadata
        id: sec_capture
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then MODE=schedule; else MODE=manual; fi
          python -u -m research.phase476_sec_form4_first_seen_capture --mode "$MODE" --run-id "$RUN_ID" --output phase476_output
      - name: Backfill bounded Form 4 structured transaction details
        if: github.event_name == 'schedule'
        run: python -u -m research.phase510_form4_structured_transaction_ledger --mode schedule --limit 10 --output phase510_output
      - name: Backfill transaction-linked Form 4 footnote references
        if: github.event_name == 'schedule'
        run: python -u -m research.phase510_form4_structured_transaction_ledger --mode schedule --limit 10 --footnote-reference-backfill --output phase510_footnote_output
      - name: Backfill filing-level Form 4 reporting-owner identity and remarks
        if: github.event_name == 'schedule'
        run: python -u -m research.phase525_form4_reporting_owner_identity --mode schedule --limit 10 --output phase525_output
      - name: Build descriptive Form 144 / Form 4 crosswalk
        if: github.event_name == 'schedule'
        run: python -u -m research.phase525_form144_form4_crosswalk --output phase525_output
      - name: Commit append-only metadata ledger
        if: github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/data/sec_form4_first_seen
          if ! git diff --cached --quiet; then
            git commit -m "[skip ci] SEC Form 4 first-seen metadata ${GITHUB_RUN_ID}"
            git push
          else
            echo "No persistent Form 4 metadata changes."
          fi
      - name: Upload compact poll summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase476-sec-form4-first-seen
          path: |
            phase476_output/
            phase510_output/
            phase510_footnote_output/
            phase525_output/
          retention-days: 90
          if-no-files-found: warn
      - name: Fail after persistence if any Form 4 feed is incomplete
        if: always() && steps.sec_capture.outcome == 'success'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("phase476_output/poll_summary.json").read_text(encoding="utf-8"))
          if not summary.get("all_feeds_successful", False):
              failed = [name for name, feed in summary.get("feeds", {}).items() if not feed.get("poll_success", False)]
              raise SystemExit("Incomplete SEC Form 4 feed poll(s); candidates remain suppressed: " + ", ".join(failed))
          print("Both Form 4 and Form 4/A watermark/continuity gates passed.")
          PY
