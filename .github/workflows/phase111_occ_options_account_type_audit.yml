name: Phase 111 OCC options account-type historical audit

on:
  push:
    branches:
      - phase99-broad-pit-universe-charter
    paths:
      - research/PHASE111_OCC_OPTIONS_ACCOUNT_TYPE_HISTORICAL_FEASIBILITY_SPEC_2026-11-05.md
      - research/phase111_occ_options_account_type_audit.py
      - research/test_phase111_occ_options_account_type_audit.py

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[phase111-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency
        run: python -m pip install --upgrade requests
      - name: Offline parser tests
        run: python -m unittest -v research/test_phase111_occ_options_account_type_audit.py
      - name: Live OCC historical-access audit
        run: python research/phase111_occ_options_account_type_audit.py --output phase111_occ_output
      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase111-occ-options-account-type-audit
          path: phase111_occ_output/
          if-no-files-found: error
          retention-days: 90
