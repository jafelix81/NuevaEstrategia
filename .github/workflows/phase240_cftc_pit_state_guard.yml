name: Phase 240 CFTC BPR/TFF PIT state-machine regression

on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - "research/phase234_cftc_bpr_capture.py"
      - "research/test_phase234_cftc_bpr_capture.py"
      - "research/phase239_cftc_tff_prospective_capture.py"
      - "research/test_phase239_cftc_tff_prospective_capture.py"
      - "research/test_phase266_cftc_capture_workflow_security.py"
      - ".github/workflows/phase234_cftc_bpr_prospective_capture.yml"
      - ".github/workflows/phase240_cftc_pit_state_guard.yml"

permissions:
  contents: read

concurrency:
  group: phase240-cftc-pit-state-guard
  cancel-in-progress: false

jobs:
  state-machine-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile CFTC capture code, tests and workflow security contract
        run: |
          python -m py_compile \
            research/phase234_cftc_bpr_capture.py \
            research/test_phase234_cftc_bpr_capture.py \
            research/phase239_cftc_tff_prospective_capture.py \
            research/test_phase239_cftc_tff_prospective_capture.py \
            research/test_phase266_cftc_capture_workflow_security.py
      - name: Run Phase 266 CFTC workflow security contract
        run: python -m unittest -v research.test_phase266_cftc_capture_workflow_security
      - name: Run BPR capture regression tests
        run: python -m unittest -v research.test_phase234_cftc_bpr_capture
      - name: Run TFF capture regression tests
        run: python -m unittest -v research.test_phase239_cftc_tff_prospective_capture
