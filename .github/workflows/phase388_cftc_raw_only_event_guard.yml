name: Phase 388 - CFTC raw-only prospective event guard
on:
  push:
    branches: [phase388-cftc-event-raw-only-guard]
    paths:
      - "research/phase384_cftc_tff_prospective_capture.py"
      - "research/test_phase384_cftc_tff_prospective_capture.py"
      - ".github/workflows/phase388_cftc_raw_only_event_guard.yml"
      - "research/PHASE388_CFTC_RAW_ONLY_EVENT_PAYLOAD_GUARD_2026-11-14.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase388-cftc-raw-only-event-guard
  cancel-in-progress: false
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned dependency
        run: python -m pip install requests
      - name: Compile and test
        run: |
          python -m py_compile research/phase384_cftc_tff_prospective_capture.py research/test_phase384_cftc_tff_prospective_capture.py
          cd research
          python -m unittest -v test_phase384_cftc_tff_prospective_capture.py
