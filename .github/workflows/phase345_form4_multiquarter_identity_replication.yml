name: Phase 345 SEC Form 4 multi-quarter identity replication

on:
  push:
    branches:
      - phase345-form4-multiquarter-identity-replication
    paths:
      - "research/phase345_form4_multiquarter_identity_replication.py"
      - "research/test_phase345_form4_multiquarter_identity_replication.py"
      - ".github/workflows/phase345_form4_multiquarter_identity_replication.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase345-form4-multiquarter-identity-replication
  cancel-in-progress: false

jobs:
  multiquarter-identity-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run regime-aware offline regressions
        run: |
          python -m py_compile research/phase345_form4_multiquarter_identity_replication.py research/test_phase345_form4_multiquarter_identity_replication.py
          python -m unittest -v research.test_phase345_form4_multiquarter_identity_replication

      - name: Download immutable Phase 342 six-archive source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase342-sec-insider-bulk-six-archive-audit
          repository: ${{ github.repository }}
          run-id: 43265704634
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase345_input/phase342

      - name: Download immutable Phase 343 verified 2026Q3 identity artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase343-form4-candidate-specific-event-time-identity
          repository: ${{ github.repository }}
          run-id: 43286198150
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase345_input/phase343

      - name: Reprocess five historical cohorts and reuse verified 2026Q3
        run: |
          mkdir -p phase345_output
          python -m research.phase345_form4_multiquarter_identity_replication \
            --input-dir phase345_input \
            --output-dir phase345_output \
            --email "${SEC_CONTACT_EMAIL}"

      - name: Upload immutable source references, SEC responses and audit outputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase345-form4-multiquarter-identity-replication
          path: |
            phase345_input/
            phase345_output/
          retention-days: 90
          if-no-files-found: warn
