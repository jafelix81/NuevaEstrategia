name: Phase 306 SEC RSS contiguous overlapping scan

on:
  push:
    branches: [phase306-sec-rss-contiguous-overlap-scan]
    paths:
      - 'research/phase306_sec_rss_contiguous_scan.py'
      - 'research/test_phase306_sec_rss_contiguous_scan.py'
      - '.github/workflows/phase306_sec_rss_contiguous_scan.yml'

permissions:
  contents: read

concurrency:
  group: phase306-sec-rss-contiguous-overlap-scan
  cancel-in-progress: false

jobs:
  contiguous-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile and run offline regression tests
        env:
          PYTHONPATH: .:research
        run: |
          python -m py_compile research/phase303_sec_latest_filings_rss_probe.py research/phase304_sec_rss_count_cap_audit.py research/phase305_sec_rss_start_offset_audit.py research/phase306_sec_rss_contiguous_scan.py research/test_phase306_sec_rss_contiguous_scan.py
          python -m unittest -v research.test_phase306_sec_rss_contiguous_scan
          python -m unittest -v research.test_phase305_sec_rss_start_offset_audit
          python -m unittest -v research.test_phase304_sec_rss_count_cap_audit
          python -m unittest -v research.test_phase303_sec_latest_filings_rss_probe
      - name: Scan contiguous SEC Atom pages with overlap
        run: python -u -m research.phase306_sec_rss_contiguous_scan --output phase306_output
      - name: Upload raw Atom pages and scan ledger
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase306-sec-rss-contiguous-scan
          path: phase306_output/
          if-no-files-found: warn
          retention-days: 90
