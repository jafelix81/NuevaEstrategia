name: Phase 69 - Incremental Form 144 fund registrant scan

on:
  push:
    branches:
      - phase69-incremental-form144-fund-registrants
    paths:
      - research/phase69_form144_trigger.txt
      - research/phase69_form144_incremental_fund_registrant_scan.py
      - research/test_phase69_form144_incremental_fund_registrant_scan.py
      - research/PHASE69_INCREMENTAL_FORM144_FUND_REGISTRANT_SCAN_SPEC_2026-11-04.md
      - .github/workflows/phase69_form144_incremental_fund_registrant_scan.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase69-form144-incremental-fund-registrant-scan
  cancel-in-progress: false

jobs:
  offline_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Run Form 144 parser and identity regression tests
        run: >-
          python -m unittest
          research.test_phase50_form144_global_index_pilot
          research.test_phase64_form144_master_pair_cross_quarter_audit
          research.test_phase65_form144_event_field_coverage_audit
          research.test_phase67_form144_full_candidate_role_resolution
          research.test_phase69_form144_incremental_fund_registrant_scan
          -v

  incremental_scan:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'Trigger Phase 69 incremental Form 144 fund registrant scan')
    needs: offline_tests
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependency
        run: python -m pip install requests
      - name: Download the exact completed Phase 67 baseline artifact
        uses: actions/download-artifact@v4
        with:
          name: phase67-form144-full-candidate-role-resolution
          run-id: 41828139052
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: phase67_baseline
      - name: Run incremental ten-CIK Form 144 scan and strict merge audit
        run: >-
          python -u -m research.phase69_form144_incremental_fund_registrant_scan
          --base-dir phase67_baseline
          --workers 5
      - name: Upload Phase 69 incremental and expanded outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase69-form144-incremental-fund-registrant-scan
          path: phase69_form144_fund_registrant_scan/
          if-no-files-found: warn
          retention-days: 90
