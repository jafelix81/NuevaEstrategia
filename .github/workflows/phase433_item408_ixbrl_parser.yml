name: Phase 433-436 - Item 408 parser and cross-source semantics regression

on:
  pull_request:
    paths:
      - "research/phase433_item408_ixbrl_parser.py"
      - "research/test_phase433_item408_ixbrl_parser.py"
      - "research/phase434_item408_form4_temporal_reconciliation.py"
      - "research/test_phase434_item408_form4_temporal_reconciliation.py"
      - "research/PHASE434_ITEM408_FORM4_CASES_2026-11-16.json"
      - "research/phase435_item408_compass_reconciliation.py"
      - "research/test_phase435_item408_compass_reconciliation.py"
      - "research/PHASE435_ITEM408_COMPASS_CASEBOOK_2026-11-16.json"
      - "research/phase436_item408_cross_issuer_semantics.py"
      - "research/test_phase436_item408_cross_issuer_semantics.py"
      - "research/PHASE436_ITEM408_CROSS_ISSUER_SEMANTICS_CASEBOOK_2026-11-16.json"
      - "research/PHASE436_ITEM408_CROSS_ISSUER_SEMANTICS_AUDIT_2026-11-16.md"
      - ".github/workflows/phase433_item408_ixbrl_parser.yml"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research/phase433_item408_ixbrl_parser.py research/test_phase433_item408_ixbrl_parser.py research/phase434_item408_form4_temporal_reconciliation.py research/test_phase434_item408_form4_temporal_reconciliation.py research/phase435_item408_compass_reconciliation.py research/test_phase435_item408_compass_reconciliation.py research/phase436_item408_cross_issuer_semantics.py research/test_phase436_item408_cross_issuer_semantics.py
      - name: Run offline tests
        run: python -m unittest -v research.test_phase433_item408_ixbrl_parser research.test_phase434_item408_form4_temporal_reconciliation research.test_phase435_item408_compass_reconciliation research.test_phase436_item408_cross_issuer_semantics
