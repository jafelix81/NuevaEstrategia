name: Phase 433/434 - Item 408 parser and Form 4 reconciliation regression

on:
  pull_request:
    paths:
      - "research/phase433_item408_ixbrl_parser.py"
      - "research/test_phase433_item408_ixbrl_parser.py"
      - "research/phase434_item408_form4_temporal_reconciliation.py"
      - "research/test_phase434_item408_form4_temporal_reconciliation.py"
      - "research/PHASE434_ITEM408_FORM4_CASES_2026-11-16.json"
      - ".github/workflows/phase433_item408_ixbrl_parser.yml"

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile
        run: python -m py_compile research/phase433_item408_ixbrl_parser.py research/test_phase433_item408_ixbrl_parser.py research/phase434_item408_form4_temporal_reconciliation.py research/test_phase434_item408_form4_temporal_reconciliation.py
      - name: Run offline tests
        run: python -m unittest -v research.test_phase433_item408_ixbrl_parser research.test_phase434_item408_form4_temporal_reconciliation
