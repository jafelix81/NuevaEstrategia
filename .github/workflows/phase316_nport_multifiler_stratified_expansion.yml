name: Phase 316 N-PORT multi-registrant stratified expansion

on:
  push:
    branches:
      - phase316-nport-multifiler-stratified-expansion
    paths:
      - ".github/workflows/phase316_nport_multifiler_stratified_expansion.yml"
      - "research/phase316_nport_multifiler_stratified_expansion.py"
      - "research/test_phase316_nport_multifiler_stratified_expansion.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase316-nport-multifiler-stratified-expansion
  cancel-in-progress: false

jobs:
  expanded-raw-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Phase 312 parser dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download immutable Phase 311 full accession census
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase311-nport-historical-accession-census
          repository: jafelix81/NuevaEstrategia
          run-id: 43156706936
          github-token: ${{ github.token }}
          path: phase311_input

      - name: Compile and run Phase 316 regressions
        run: |
          python -m compileall -q research/phase316_nport_multifiler_stratified_expansion.py research/test_phase316_nport_multifiler_stratified_expansion.py
          python -m unittest -v research.test_phase314_nport_amendment_parent_audit research.test_phase316_nport_multifiler_stratified_expansion

      - name: Retrieve and reconcile expanded 280-accession sample
        run: python research/phase316_nport_multifiler_stratified_expansion.py --input-dir phase311_input --output-dir phase316_output --per-stratum 5

      - name: Upload immutable raw submissions and reconciliation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase316-nport-multifiler-stratified-expansion
          path: phase316_output/
          retention-days: 90
          if-no-files-found: error
