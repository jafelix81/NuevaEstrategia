name: Phase 659 - SEC Form 4 amendment lineage resolution

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/phase659_form4_amendment_lineage_resolution.yml"
      - "research/phase659_form4_amendment_lineage_resolution.py"
      - "research/test_phase659_form4_amendment_lineage_resolution.py"
      - "research/PHASE659_FORM4_AMENDMENT_LINEAGE_RESOLUTION_2026-11-27.md"
      - "research/data/sec_form4_first_seen/amendment_lineage_resolutions.json"
      - "research/data/sec_form4_first_seen/transaction_details.csv"
      - "research/data/sec_form4_first_seen/reporting_owners.csv"

permissions:
  contents: read

concurrency:
  group: phase659-form4-amendment-lineage-resolution
  cancel-in-progress: true

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline tests
        run: |
          python -m py_compile research/phase659_form4_amendment_lineage_resolution.py research/test_phase659_form4_amendment_lineage_resolution.py
          python -m unittest -v research.test_phase659_form4_amendment_lineage_resolution
      - name: Recompute amendment lineage audit
        run: |
          python -m research.phase659_form4_amendment_lineage_resolution \
            --transactions research/data/sec_form4_first_seen/transaction_details.csv \
            --owners research/data/sec_form4_first_seen/reporting_owners.csv \
            --sidecar research/data/sec_form4_first_seen/amendment_lineage_resolutions.json \
            --output phase659_output/summary.json
      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase659-form4-amendment-lineage
          path: phase659_output/
          if-no-files-found: error
          retention-days: 30
