name: Phase 648 - CFTC Russell reproducible feature pipeline

on:
  pull_request:
    paths:
      - "research/phase648_cftc_russell_feature_pipeline.py"
      - "research/test_phase648_cftc_russell_feature_pipeline.py"
      - "research/data/cftc_tff_prospective/historical_backfill.csv"
      - "research/data/cftc_tff_prospective/baseline_manifest.json"
      - "research/data/cftc_tff_prospective/events/**"
      - ".github/workflows/phase648_cftc_russell_feature_pipeline.yml"
      - "research/PHASE648_CFTC_RUSSELL_REPRODUCIBLE_FEATURE_PIPELINE_2026-11-26.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase648-cftc-russell-feature-pipeline
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned import dependency
        run: python -m pip install requests==2.34.2
      - name: Compile and run offline feature regressions
        run: |
          python -m py_compile research/phase384_cftc_tff_prospective_capture.py research/phase648_cftc_russell_feature_pipeline.py research/test_phase648_cftc_russell_feature_pipeline.py
          cd research
          python -m unittest -v test_phase648_cftc_russell_feature_pipeline.py
      - name: Reproduce feature summary without accessing price data
        run: |
          mkdir -p phase648_output
          cd research
          python phase648_cftc_russell_feature_pipeline.py --output ../phase648_output/russell_features.json
      - name: Upload reproducible feature summary
        uses: actions/upload-artifact@v4
        with:
          name: phase648-cftc-russell-feature-summary
          path: phase648_output/russell_features.json
          retention-days: 90
          if-no-files-found: error
