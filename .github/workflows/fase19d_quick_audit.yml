name: Fase 19D - QUICK Identity Threshold Audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase19d:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 19D
        run: python -u Nueva_Estrategia_Fase19D_QUICK_Audit.py

      - name: Upload Phase 19D artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase19d-quick-audit
          path: nueva_estrategia_phase19d_quick_audit/**
          if-no-files-found: warn
          retention-days: 14
