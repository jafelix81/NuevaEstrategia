name: Phase 51 - SEC 13F official security crosswalk

on:
  push:
    branches: [phase51-sec13f-official-security-crosswalk]
    paths:
      - 'research/phase51_sec13f_official_security_crosswalk.py'
      - '.github/workflows/phase51_sec13f_official_security_crosswalk.yml'
  workflow_dispatch:

concurrency:
  group: phase51-sec13f-official-security-crosswalk
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run SEC 13F official security crosswalk audit
        run: python -u research/phase51_sec13f_official_security_crosswalk.py
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase51-sec13f-official-security-crosswalk
          path: phase51-sec13f-official-security-crosswalk/
          if-no-files-found: error
