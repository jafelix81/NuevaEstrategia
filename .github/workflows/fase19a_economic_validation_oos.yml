name: Fase 19A - Economic Validation OOS
on:
  workflow_dispatch:
jobs:
  phase19a:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl
      - name: Verify frozen dependencies
        run: |
          test -f "Nueva_Estrategia_Fase11_Real1000_LTM_v4.py"
          test -f "Nueva_Estrategia_Fase12_FinalOOS_Selection_LTM.py"
      - name: Run Phase 19A
        run: python -u "Nueva_Estrategia_Fase19A_Economic_Validation_OOS.py"
      - name: List generated files
        if: always()
        run: find . -maxdepth 3 -type f | sort
      - name: Upload Phase 19A artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fase19a_economic_validation_oos
          path: nueva_estrategia_phase19a_economic_oos/
          if-no-files-found: warn
