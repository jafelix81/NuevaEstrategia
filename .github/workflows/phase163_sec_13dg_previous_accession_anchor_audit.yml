name: Phase 163 SEC 13D-G previous accession anchor semantics audit

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase163_*"
      - "research/test_phase163_*"
      - ".github/workflows/phase163_sec_13dg_previous_accession_anchor_audit.yml"
      - "SMART_MONEY_RESEARCH_STATE.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase163-sec-13dg-previous-accession-anchor-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile and run offline regression tests
        run: |
          python -m py_compile research/phase163_13dg_previous_accession_anchor_audit.py
          python -m unittest discover -s research -p 'test_phase163_*.py' -v
      - name: Recompute anchor and predecessor semantics
        run: |
          python research/phase163_13dg_previous_accession_anchor_audit.py \
            --output-dir phase163_output
      - name: Upload reproducible audit
        uses: actions/upload-artifact@v4
        with:
          name: phase163-sec-13dg-previous-accession-anchor-audit
          path: |
            phase163_output/phase163_13dg_previous_accession_anchor_rows.csv
            phase163_output/phase163_13dg_previous_accession_anchor_summary.json
          if-no-files-found: error
          retention-days: 30
