name: Phase 169 Cboe Option Sentiment specification and PIT feasibility

on:
  pull_request:
    branches: [main]
    paths:
      - research/phase169_cboe_option_sentiment_feasibility.py
      - research/test_phase169_cboe_option_sentiment_feasibility.py
      - .github/workflows/phase169_cboe_option_sentiment_feasibility.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase169-cboe-option-sentiment-feasibility
  cancel-in-progress: false

jobs:
  specification-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Phase 169
        run: python -m py_compile research/phase169_cboe_option_sentiment_feasibility.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase169_cboe_option_sentiment_feasibility
      - name: Build metadata-only feasibility artifact
        run: python -m research.phase169_cboe_option_sentiment_feasibility --output-dir phase169_output
      - name: Upload metadata-only audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase169-cboe-option-sentiment-feasibility
          path: phase169_output/phase169_cboe_option_sentiment_feasibility.json
          retention-days: 90
