name: Phase 393 - FINRA Nasdaq ISO-date provider retest

on:
  push:
    branches: [phase393-finra-nasdaq-iso-date-provider-retest]
    paths:
      - ".github/workflows/phase393_finra_nasdaq_iso_date_provider_retest.yml"
      - "research/phase393_finra_nasdaq_iso_date_provider_retest.py"
      - "research/test_phase393_finra_nasdaq_iso_date_provider_retest.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/phase393_finra_nasdaq_iso_date_provider_retest.yml"
      - "research/phase393_finra_nasdaq_iso_date_provider_retest.py"
      - "research/test_phase393_finra_nasdaq_iso_date_provider_retest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase393-finra-nasdaq-iso-date-provider-retest
  cancel-in-progress: false

jobs:
  provider-retest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install requests==2.34.2 pandas==3.1.1 numpy==2.4.6
      - name: Compile and test
        run: |
          python -m py_compile research/phase393_finra_nasdaq_iso_date_provider_retest.py research/test_phase393_finra_nasdaq_iso_date_provider_retest.py
          python -m unittest -v research.test_phase393_finra_nasdaq_iso_date_provider_retest
      - name: Retest Nasdaq with ISO date parameters
        run: python -u -m research.phase393_finra_nasdaq_iso_date_provider_retest
      - name: Enforce research-only controls
        run: |
          python - <<'PY'
          import json, sys
          p = "phase393_finra_nasdaq_iso_date_provider_retest/summary.json"
          result = json.load(open(p, encoding="utf-8"))
          forbidden = ("raw_prices_retained", "forward_returns_used", "alpha_test_authorized",
                       "holdout_used", "f80_changed", "production_changed", "fallback_accepted")
          if any(result.get(key) for key in forbidden):
              sys.exit("Phase 393 research-only control violated")
          if result.get("price_window_start") != "2016-10-24" or result.get("price_window_end_exclusive") != "2026-10-24":
              sys.exit("Fixed Phase 20C price window changed")
          print("PHASE393_RESEARCH_ONLY_CONTROLS=PASS")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase393-finra-nasdaq-iso-date-provider-retest
          path: phase393_finra_nasdaq_iso_date_provider_retest/
          if-no-files-found: error
          retention-days: 90
