name: Phase 147 IvyDB OI immutable correction-vintage regression

on:
  pull_request:
    branches: [main]
    paths:
      - "research/phase147_ivydb_oi_vintage_ledger.py"
      - "research/test_phase147_ivydb_oi_vintage_ledger.py"
      - "research/PHASE147_IVYDB_OI_IMMUTABLE_CORRECTION_VINTAGE_LEDGER_2026-11-05.md"
      - "SMART_MONEY_RESEARCH_STATE.md"
      - ".github/workflows/phase147_ivydb_oi_vintage_ledger.yml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile vintage ledger
        run: python -m py_compile research/phase147_ivydb_oi_vintage_ledger.py
      - name: Run offline vintage regression tests
        run: python -m unittest -v research.test_phase147_ivydb_oi_vintage_ledger
