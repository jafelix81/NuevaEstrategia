name: Phase 258 Form 144/Form 4 accession-cluster-preserving placebo

on:
  pull_request:
    branches:
      - phase99-broad-pit-universe-charter
    paths:
      - 'research/phase258_form144_form4_accession_cluster_preserving_placebo.py'
      - 'research/test_phase258_form144_form4_accession_cluster_preserving_placebo.py'
      - '.github/workflows/phase258_form144_form4_accession_cluster_preserving_placebo.yml'

concurrency:
  group: phase258-form144-accession-preserving-placebo
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Download immutable Phase 69 Form 144 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase69-form144-incremental-fund-registrant-scan
          repository: ${{ github.repository }}
          run-id: 41959603351
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase258_input/form144
      - name: Download immutable Phase 39 Form 4 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase39-sec-form4-actual-file-audit
          repository: ${{ github.repository }}
          run-id: 40606706518
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: phase258_input/form4
      - name: Run Phase 258 unit tests
        run: python -m unittest discover -s research -p 'test_phase258_form144_form4_accession_cluster_preserving_placebo.py' -v
      - name: Reproduce accession-cluster-preserving conditional placebos
        run: >-
          python -m research.phase258_form144_form4_accession_cluster_preserving_placebo
          --form144-csv phase258_input/form144/expanded_issuer_event_raw.csv
          --form4-zip phase258_input/form4/2026q3_form345.zip
          --output phase258_output/phase258_form144_form4_accession_cluster_preserving_placebo_result.json
          --permutations 1000 --seed 258
      - name: Enforce immutable sample, cluster, and no-alpha controls
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase258_output/phase258_form144_form4_accession_cluster_preserving_placebo_result.json'))
          assert x['sample']['eligible_notices'] == 1451
          assert x['sample']['eligible_tranches'] == 1460
          assert x['sample']['form4_unique_owner_sale_blocks'] == 10525
          assert x['sample']['unique_form4_accessions_with_selected_sale_blocks'] == 8897
          assert x['sample']['single_block_accessions'] == 7512
          assert x['sample']['multi_block_accessions'] == 1385
          assert x['sample']['blocks_in_multi_block_accessions_frozen'] == 3013
          assert x['sample']['exact_date_share_links'] == 521
          assert x['sample']['fallback_links'] == 49
          assert x['sample']['exact_links_in_single_block_accessions'] == 414
          assert x['sample']['exact_links_in_multi_block_accessions_frozen'] == 107
          assert x['owner_identity_audit']['issuer_normalized_names_mapped_to_multiple_ciks'] == 0
          assert x['owner_identity_audit']['owner_ciks_with_multiple_normalized_names'] == 0
          expected = {
              'issuer_owner_cik': (2943, 127, 58.848, 80),
              'issuer_owner_cik_month': (1451, 56, 26.249, 43),
              'issuer_owner_cik_iso_week': (565, 28, 14.208, 24),
          }
          assert len(x['placebos']) == 3
          for name, row in x['placebos'].items():
              mutable, observed, mean, maximum = expected[name]
              assert row['status'] == 'COMPLETED', name
              assert row['replicates'] == 1000, name
              assert row['mutable_single_accession_blocks'] == mutable, name
              assert row['observed_mutable_exact_links'] == observed, name
              assert row['null_mean'] == mean, name
              assert row['null_max'] == maximum, name
              assert row['null_replicates_at_or_above_observed'] == 0, name
              assert row['holm_adjusted_tail'] <= 0.01, name
          assert x['decision']['strict_pit_admitted'] is False
          assert x['decision']['alpha_test_authorized'] is False
          assert x['decision']['holdout_used'] is False
          assert x['decision']['f80_frozen'] is True
          print('Phase 258 accession-cluster and no-alpha controls passed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase258-form144-form4-accession-cluster-placebo
          path: phase258_output/*.json
          if-no-files-found: error
          retention-days: 90
