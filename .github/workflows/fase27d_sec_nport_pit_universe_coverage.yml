name: Fase 27D - SEC N-PORT PIT Universe Coverage

on:
  push:
    branches:
      - phase27d-sec-nport-pit-universe-coverage

permissions:
  contents: read

jobs:
  research:
    strategy:
      fail-fast: false
      matrix:
        periods:
          - "2019Q4,2020Q4"
          - "2021Q4,2022Q4"
          - "2023Q4,2024Q4"
          - "2025Q4,2026Q3"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NPORT_PERIODS: ${{ matrix.periods }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 27D period batch
        run: python -u Nueva_Estrategia_Fase27D_SEC_NPORT_PIT_Universe_Coverage.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase27d-sec-nport-${{ matrix.periods }}
          path: nueva_estrategia_phase27d_sec_nport/**
          if-no-files-found: error
