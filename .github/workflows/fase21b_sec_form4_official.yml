name: Fase 21B - SEC Form 4 Official Dataset

on:
  push:
    branches: [phase21b-sec-form4-official-dataset]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase21b-official:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas requests
      - name: Run Phase 21B official SEC dataset
        run: python -u Nueva_Estrategia_Fase21B_SEC_Form4_OfficialDataset_v2.py
      - name: Upload Phase 21B official artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase21b-sec-form4-official
          path: nueva_estrategia_phase21b_sec_form4_official/**
          if-no-files-found: warn
          retention-days: 30
