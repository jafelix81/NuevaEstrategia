name: FASE 19E - QUICK Reconciliation

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy yfinance openpyxl

      - name: Run Phase 19E
        run: python -u Nueva_Estrategia_Fase19E_QUICK_Reconciliation.py

      - name: Upload Phase 19E artifacts
        uses: actions/upload-artifact@v4
        with:
          name: phase19e-quick-reconciliation
          path: nueva_estrategia_phase19e_quick_reconciliation/
