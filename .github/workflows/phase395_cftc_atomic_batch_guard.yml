name: Phase 395 - CFTC atomic-batch eligibility regression

on:
  push:
    branches: [phase395-cftc-semiweekly-transition-readiness]
    paths:
      - ".github/workflows/phase395_cftc_atomic_batch_guard.yml"
      - "research/phase384_cftc_tff_prospective_capture.py"
      - "research/test_phase384_cftc_tff_prospective_capture.py"
      - "research/PHASE395_CFTC_SEMIWEEKLY_TRANSITION_READINESS_2026-11-14.md"
      - "SMART_MONEY_RESEARCH_STATE.md"

permissions:
  contents: read

concurrency:
  group: phase395-cftc-atomic-batch-guard
  cancel-in-progress: false

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install pinned dependency
        run: python -m pip install requests==2.34.2
      - name: Compile and run CFTC capture regression suite
        run: |
          python -m py_compile research/phase384_cftc_tff_prospective_capture.py research/test_phase384_cftc_tff_prospective_capture.py
          python -m unittest -v research.test_phase384_cftc_tff_prospective_capture
