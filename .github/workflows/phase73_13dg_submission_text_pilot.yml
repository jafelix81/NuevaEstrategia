name: Phase 73 - SEC 13D/13G complete-submission text pilot

on:
  push:
    branches:
      - phase73-13dg-submission-text-xml-recovery
    paths:
      - research/phase73_13dg_submission_text_pilot_trigger.txt

permissions:
  actions: read
  contents: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pilot dependencies
        run: python -m pip install --upgrade pip pandas requests
      - name: Run all parser regression tests
        run: |
          python -m unittest research.test_phase72_13dg_structured_xml_parser -v
          python -m unittest research.test_phase72_13dg_structured_xml_corpus_audit -v
          python -m unittest research.test_phase73_sec_submission_text_extractor -v
      - name: Download immutable Phase 35 source artifact
        uses: actions/download-artifact@v4
        with:
          name: phase35-13dg-pit-event-crosswalk-audit
          run-id: 41575083622
          github-token: ${{ github.token }}
          path: phase35_input
      - name: Validate source artifact
        run: test -s phase35_input/phase28d_events.csv
      - name: Run stratified 80-filing submission-text pilot
        run: |
          python -u -m research.phase73_13dg_submission_text_pilot \
            --input-csv phase35_input/phase28d_events.csv \
            --outdir phase73_13dg_submission_text_pilot \
            --sleep-seconds 0.6 \
            --max-retries 5 \
            --limit 80
      - name: Upload Phase 73 pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase73-13dg-submission-text-pilot
          path: phase73_13dg_submission_text_pilot/
          if-no-files-found: warn
          retention-days: 90
