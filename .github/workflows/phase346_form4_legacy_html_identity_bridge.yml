name: Phase 346 Form 4 legacy HTML identity bridge

on:
  push:
    branches:
      - phase346-form4-legacy-html-identity-bridge
    paths:
      - "research/phase346_form4_legacy_html_identity_bridge_audit.py"
      - "research/test_phase346_form4_legacy_html_identity_bridge_audit.py"
      - ".github/workflows/phase346_form4_legacy_html_identity_bridge.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: phase346-form4-legacy-html-identity-bridge
  cancel-in-progress: false

jobs:
  legacy-html-bridge-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run offline regressions
        run: |
          python -m py_compile research/phase346_form4_legacy_html_identity_bridge_audit.py research/test_phase346_form4_legacy_html_identity_bridge_audit.py
          python -m unittest -v research.test_phase346_form4_legacy_html_identity_bridge_audit

      - name: Download immutable Phase 345 source artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: phase345-form4-multiquarter-identity-replication
          repository: \${{ github.repository }}
          run-id: 43290739469
          github-token: \${{ secrets.GITHUB_TOKEN }}
          path: phase346_input

      - name: Audit legacy HTML identity evidence
        run: |
          python -m research.phase346_form4_legacy_html_identity_bridge_audit \
            --input-dir phase346_input \
            --output-dir phase346_output

      - name: Upload Phase 346 evidence and summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase346-form4-legacy-html-identity-bridge
          path: |
            phase346_output/
            phase346_input/phase345_output/phase345_multiquarter_identity_summary.json
            phase346_input/phase345_output/2006Q1/identity_audit/phase345_2006Q1_candidate_rows.csv
            phase346_input/phase345_output/2006Q1/identity_audit/sec_response_manifest.json
            phase346_input/phase345_output/2012Q1/identity_audit/phase345_2012Q1_candidate_rows.csv
            phase346_input/phase345_output/2012Q1/identity_audit/sec_response_manifest.json
          retention-days: 90
          if-no-files-found: error
