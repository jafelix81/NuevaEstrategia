name: Fase 27I - SEC N-PORT Snapshot Selection

on:
  push:
    branches: [phase27i-nport-snapshot-selection]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Phase 27I
        run: python -u Nueva_Estrategia_Fase27I_SEC_NPORT_SnapshotSelection.py
      - name: Upload research output
        uses: actions/upload-artifact@v4
        with:
          name: phase27i-sec-nport-snapshot-selection
          path: nueva_estrategia_phase27i_sec_nport/
          if-no-files-found: error
