name: Phase 174 Cboe Option Quotes public sample and PIT feasibility
on:
  pull_request:
    branches: [main]
    paths:
      - research/phase174_cboe_option_quotes_sample_audit.py
      - research/test_phase174_cboe_option_quotes_sample_audit.py
      - .github/workflows/phase174_cboe_option_quotes_sample_audit.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase174-cboe-option-quotes-sample-audit
  cancel-in-progress: false
jobs:
  sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Phase 174
        run: python -m py_compile research/phase174_cboe_option_quotes_sample_audit.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase174_cboe_option_quotes_sample_audit
      - name: Download and audit public Cboe sample
        run: python -m research.phase174_cboe_option_quotes_sample_audit --output phase174_output/phase174_cboe_option_quotes_sample_audit.json
      - name: Upload metadata-only audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase174-cboe-option-quotes-sample-audit
          path: phase174_output/phase174_cboe_option_quotes_sample_audit.json
          retention-days: 90
      - name: Enforce public sample schema gate
        run: |
          python - <<'PY'
          import json, sys
          p='phase174_output/phase174_cboe_option_quotes_sample_audit.json'
          r=json.load(open(p, encoding='utf-8'))
          print('PHASE174_STATUS='+str(r.get('overall_status', r.get('download_status'))))
          if r.get('download_status') != 'PASS':
              print('PHASE174_DOWNLOAD_FAILED')
              sys.exit(1)
          if r.get('sample_schema_gate_pass') is True:
              print('PHASE174_SAMPLE_SCHEMA=PASS')
              sys.exit(0)
          invalid_contract = int(r.get('total_invalid_contract_rows') or 0)
          invalid_timestamp = int(r.get('total_invalid_timestamp_rows') or 0)
          populated = int(r.get('total_populated_rows') or 0)
          expected_rejection = (
              r.get('overall_status') == 'DIAGNOSTIC_COMPLETE_SAMPLE_GATE_FAIL'
              and populated > 0
              and invalid_contract > 0
              and invalid_timestamp == 0
          )
          if expected_rejection:
              print('PHASE174_SAMPLE_SCHEMA=EXPECTED_REJECTION_DIAGNOSTIC_COMPLETE')
              print(f'INVALID_CONTRACT_ROWS={invalid_contract}; INVALID_TIMESTAMP_ROWS={invalid_timestamp}; POPULATED_ROWS={populated}')
              sys.exit(0)
          print('PHASE174_SAMPLE_SCHEMA=UNEXPECTED_REJECTION_REQUIRES_REVIEW')
          sys.exit(1)
          PY
