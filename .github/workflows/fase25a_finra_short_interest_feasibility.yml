name: Fase 25A - FINRA Short Interest Feasibility

on:
  push:
    branches:
      - phase25a-finra-short-interest-feasibility
  workflow_dispatch:

jobs:
  feasibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install --disable-pip-version-check pandas requests
      - name: Run Phase 25A
        run: python -u Nueva_Estrategia_Fase25A_FINRA_ShortInterest_Feasibility.py
      - name: Upload research outputs
        uses: actions/upload-artifact@v4
        with:
          name: phase25a-finra-short-interest-feasibility
          path: nueva_estrategia_phase25a_finra_short_interest_feasibility/
          retention-days: 30
