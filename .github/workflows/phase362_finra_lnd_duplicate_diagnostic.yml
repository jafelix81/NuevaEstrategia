name: Phase 362 - FINRA LND duplicate root-cause diagnostic

on:
  push:
    branches:
      - phase362-finra-lnd-duplicate-root-cause
    paths:
      - "research/phase362_finra_lnd_duplicate_diagnostic.py"
      - "research/test_phase362_finra_lnd_duplicate_diagnostic.py"
      - ".github/workflows/phase362_finra_lnd_duplicate_diagnostic.yml"
  pull_request:
    branches:
      - phase361-finra-five-week-bridge-audit
    paths:
      - "research/phase362_finra_lnd_duplicate_diagnostic.py"
      - "research/test_phase362_finra_lnd_duplicate_diagnostic.py"
      - ".github/workflows/phase362_finra_lnd_duplicate_diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase362-finra-lnd-duplicate-root-cause
  cancel-in-progress: false

jobs:
  lnd-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Install request dependency
        run: python -m pip install requests
      - name: Compile diagnostic and tests
        run: python -m py_compile research/phase362_finra_lnd_duplicate_diagnostic.py research/test_phase362_finra_lnd_duplicate_diagnostic.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase360_finra_symbol_bridge research.test_phase362_finra_lnd_duplicate_diagnostic
      - name: Retrieve one complete FINRA partition and isolate LND
        run: python -m research.phase362_finra_lnd_duplicate_diagnostic --output phase362_finra_lnd_diagnostic
      - name: Enforce retrieval-only controls
        run: |
          python - <<'PY'
          import json, sys
          result = json.load(open("phase362_finra_lnd_diagnostic/summary.json", encoding="utf-8"))
          if result.get("retrieval_gate") != "PASS" or not result.get("api_record_total_match"):
              sys.exit("Phase 362 did not retrieve the complete FINRA partition")
          if result.get("forward_returns_used") or result.get("alpha_test_authorized") or result.get("holdout_used") or result.get("f80_changed"):
              sys.exit("Research-only controls were violated")
          print("PHASE362_RETRIEVAL=PASS")
          print("DATA_GATE=" + str(result.get("overall_data_gate")))
          print("LND_ROWS=" + str(result.get("lnd_rows_total")))
          print("ALPHA_TEST=NOT_AUTHORIZED")
          PY
      - name: Upload anonymized diagnostic artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase362-finra-lnd-diagnostic
          path: phase362_finra_lnd_diagnostic/
          if-no-files-found: warn
          retention-days: 90
