name: Phase 246 Cboe All Access option trade feasibility

on:
  push:
    branches: [phase231-cboe-option-quotes-full-row-reparse]
    paths:
      - "research/phase246_cboe_all_access_option_trade_feasibility.py"
      - "research/test_phase246_cboe_all_access_option_trade_feasibility.py"
      - ".github/workflows/phase246_cboe_all_access_option_trade_feasibility.yml"
  pull_request:
    branches: [phase99-broad-pit-universe-charter]
    paths:
      - "research/phase246_cboe_all_access_option_trade_feasibility.py"
      - "research/test_phase246_cboe_all_access_option_trade_feasibility.py"
      - ".github/workflows/phase246_cboe_all_access_option_trade_feasibility.yml"

permissions:
  contents: read

concurrency:
  group: phase246-cboe-all-access-option-trade-feasibility
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Compile audit and tests
        run: python -m py_compile research/phase246_cboe_all_access_option_trade_feasibility.py research/test_phase246_cboe_all_access_option_trade_feasibility.py
      - name: Run offline regression tests
        run: python -m unittest -v research.test_phase246_cboe_all_access_option_trade_feasibility
      - name: Build deterministic feasibility artifact
        run: python -m research.phase246_cboe_all_access_option_trade_feasibility --output phase246_output/phase246_cboe_all_access_option_trade_feasibility.json
      - name: Upload metadata-only artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase246-cboe-all-access-option-trade-feasibility
          path: phase246_output/phase246_cboe_all_access_option_trade_feasibility.json
          if-no-files-found: error
          retention-days: 90
