name: Nueva Estrategia - Fase 2 Combinacion

on:
  workflow_dispatch:

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance scipy

      - name: Run Phase 2
        run: |
          python Nueva_Estrategia_Fase2_Combinacion.py

      - name: Upload Phase 2 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nueva-estrategia-phase2-${{ github.run_id }}
          path: nueva_estrategia_phase2_combinacion/
          if-no-files-found: error
