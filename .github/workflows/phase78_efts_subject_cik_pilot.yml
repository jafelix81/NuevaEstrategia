name: Phase 78 - SEC EFTS subject CIK positive-control pilot

on:
  push:
    branches:
      - phase78-efts-subject-cik-positive-control-pilot
    paths:
      - research/phase78_efts_subject_cik_pilot_trigger.txt

permissions:
  contents: read
  actions: read

concurrency:
  group: sec-public-data-research
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pilot dependency
        run: python -m pip install requests
      - name: Run 13-query EFTS positive-control pilot
        run: python -u -m research.phase78_efts_subject_cik_pilot --outdir phase78_efts_subject_cik_pilot --sleep-seconds 0.6 --page-size 100 --max-pages 10
      - name: Upload Phase 78 pilot outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase78-efts-subject-cik-pilot
          path: phase78_efts_subject_cik_pilot/
          retention-days: 90
