name: Phase 328 SEC collision-pair prior-filing XBRL identity pilot

on:
  push:
    branches:
      - phase328-sec-collision-prior-filing-xbrl-pilot
    paths:
      - ".github/workflows/phase328_sec_collision_prior_filing_xbrl_pilot.yml"
      - "research/phase328_sec_collision_prior_filing_xbrl_pilot.py"
      - "research/test_phase328_sec_collision_prior_filing_xbrl_pilot.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: phase328-sec-collision-prior-filing-xbrl-pilot
  cancel-in-progress: false

jobs:
  xbrl-identity-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SEC_CONTACT_EMAIL: \${{ secrets.SEC_CONTACT_EMAIL }}
      GH_TOKEN: \${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Compile and run offline regressions
        run: |
          python -m compileall -q research/phase328_sec_collision_prior_filing_xbrl_pilot.py research/test_phase328_sec_collision_prior_filing_xbrl_pilot.py
          python -m unittest -v research.test_phase328_sec_collision_prior_filing_xbrl_pilot

      - name: Download and verify immutable Phase 326 collision-pair metadata
        run: |
          curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/jafelix81/NuevaEstrategia/actions/artifacts/13939999128/zip" \
            -o phase326_source.zip
          echo "eea7eaf97b91acfdbdac866f8d98660ec98be03adc8c4038b800f74cf86d81d5  phase326_source.zip" | sha256sum --check

      - name: Retrieve latest prior SEC periodic filings and parse identity facts
        run: |
          python -m research.phase328_sec_collision_prior_filing_xbrl_pilot \
            --input-zip phase326_source.zip \
            --output-dir phase328_output \
            --email "$SEC_CONTACT_EMAIL"

      - name: Enforce sample, no-lookahead and frozen-baseline controls
        run: |
          python - <<'PY'
          import json, re, sys
          r=json.load(open("phase328_output/phase328_identity_pilot.json", encoding="utf-8"))
          s=r["summary"]; c=r["controls"]
          if s["collision_pairs"] != 28 or s["issuer_date_observations"] != 56:
              sys.exit("Phase 328 input population mismatch")
          if len(r["pairs"]) != 28 or len(r["observations"]) != 56:
              sys.exit("Phase 328 output population mismatch")
          for row in r["observations"]:
              filed=row.get("selected_filing_date")
              event=row["event_date"]
              if filed and not filed < event:
                  sys.exit("Same-day or later filing violates conservative as-of rule")
              if row.get("document_bytes", 0) and not re.fullmatch(r"[0-9a-f]{64}", row.get("document_sha256", "")):
                  sys.exit("Retrieved source document lacks SHA-256")
          for key in ("strict_pit_admitted","identity_crosswalk_admitted","universe_coverage_admitted",
                      "alpha_test_authorized","return_test_run","bootstrap_loo_run","chronological_oos_run",
                      "holdout_used","production_changed","universe_changed","capital_changed",
                      "parameters_changed","raw_sec_bytes_uploaded","vendor_contacted","data_purchased",
                      "email_sent","ticker_only_join_used","same_day_periodic_filing_used","later_filing_used"):
              if c.get(key) is not False:
                  sys.exit("Research control unexpectedly opened: "+key)
          if c.get("f80_frozen") is not True:
              sys.exit("F80 frozen control failed")
          if r["interpretation"]["strict_intraday_first_public_availability_established"] is not False:
              sys.exit("Intraday availability was overstated")
          print("PHASE328_SUMMARY="+json.dumps(s, sort_keys=True))
          print("PHASE328_CONTROLS="+json.dumps(c, sort_keys=True))
          PY

      - name: Upload parsed identity metadata and hashes only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase328-sec-collision-prior-filing-xbrl-pilot
          path: phase328_output/
          retention-days: 90
          if-no-files-found: warn
