name: Phase 50 v2 - SEC Form 144 feasibility audit
on:
  push:
    branches: [phase50-sec-form144-feasibility-v2]
  workflow_dispatch:
concurrency:
  group: phase50-sec-form144-feasibility-v2
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run SEC Form 144 feasibility audit v2
        run: python -u research/phase50_sec_form144_feasibility_v2.py
      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: phase50-sec-form144-feasibility-v2
          path: phase50_sec_form144_feasibility_v2/
          if-no-files-found: error
